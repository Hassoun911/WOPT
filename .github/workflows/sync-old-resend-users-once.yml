name: Sync Old Resend Users Into Hassoun CRM Once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/hassoun-1.0-store-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import historical Hassoun prayer recipients
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RESEND_API_KEY"
          test -n "$EMAIL_LINK_SECRET"
          cat > /tmp/import.mjs <<'NODE'
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const apiKey = process.env.RESEND_API_KEY;
          const secret = process.env.EMAIL_LINK_SECRET;
          const headers = { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' };
          async function get(path) {
            const r = await fetch(`https://api.resend.com${path}`, { headers });
            if (!r.ok) throw new Error(`${path}: ${r.status} ${await r.text()}`);
            return r.json();
          }
          const addresses = new Map();
          const add = (email, state='active', source='resend') => {
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
            const key = email.trim().toLowerCase();
            const old = addresses.get(key);
            if (!old || old.state === 'active') addresses.set(key, { email:key, state, source });
          };
          try {
            let after='';
            for (let page=0; page<50; page++) {
              const qs = new URLSearchParams({ limit:'100' }); if (after) qs.set('after', after);
              const data = await get(`/emails?${qs}`); const rows = data.data || data.emails || [];
              if (!rows.length) break;
              for (const row of rows) {
                const subject = String(row.subject || '').toLowerCase();
                const looksPrayer = /(fajr|dhuhr|zuhr|asr|maghrib|isha|prayer time|athan|adhan|وقت الصلاة|الفجر|الظهر|العصر|المغرب|العشاء)/i.test(subject);
                if (!looksPrayer) continue;
                for (const email of (Array.isArray(row.to) ? row.to : [row.to])) add(email, row.last_event === 'suppressed' ? 'suppressed' : 'active', 'sent-email');
              }
              const last = rows.at(-1); if (!last?.id || rows.length < 100) break; after = last.id;
            }
          } catch (e) { console.warn('Sent-email history unavailable:', e.message); }
          try {
            let after='';
            for (let page=0; page<50; page++) {
              const qs = new URLSearchParams({ limit:'100' }); if (after) qs.set('after', after);
              const data = await get(`/contacts?${qs}`); const rows = data.data || data.contacts || [];
              if (!rows.length) break;
              for (const c of rows) add(c.email, c.unsubscribed ? 'unsubscribed' : 'active', 'contact');
              const last = rows.at(-1); if (!last?.id || rows.length < 100) break; after = last.id;
            }
          } catch (e) { console.warn('Contacts unavailable:', e.message); }
          try {
            let after='';
            for (let page=0; page<50; page++) {
              const qs = new URLSearchParams({ limit:'100' }); if (after) qs.set('after', after);
              const data = await get(`/suppressions?${qs}`); const rows = data.data || data.suppressions || [];
              if (!rows.length) break;
              for (const s of rows) add(s.email, s.origin === 'bounce' ? 'bounced' : 'suppressed', 'suppression');
              const last = rows.at(-1); if (!last?.id || rows.length < 100) break; after = last.id;
            }
          } catch (e) { console.warn('Suppression list unavailable:', e.message); }
          const sql = [];
          const esc = s => `'${String(s).replaceAll("'", "''")}'`;
          let active=0, blocked=0;
          for (const item of addresses.values()) {
            const status = item.state === 'active' ? 'active' : item.state === 'bounced' ? 'bounced' : 'unsubscribed';
            if (status === 'active') active++; else blocked++;
            const publicId = crypto.randomUUID();
            const token = crypto.createHmac('sha256', secret).update(`manage|${publicId}|${item.email}`).digest('base64url');
            const manageHash = crypto.createHash('sha256').update(token).digest('hex');
            sql.push(`INSERT INTO email_subscribers (public_id,email,locale,latitude,longitude,timezone,country_code,country_name,region,city,calculation_method,madhab,status,manage_token_hash,verified_at,unsubscribed_at) SELECT ${esc(publicId)},${esc(item.email)},'en',42.3149,-83.0364,'America/Toronto','CA','Canada','Ontario','Windsor',3,'standard',${esc(status)},${esc(manageHash)},${status==='active'?'CURRENT_TIMESTAMP':'NULL'},${status==='active'?'NULL':'CURRENT_TIMESTAMP'} WHERE NOT EXISTS (SELECT 1 FROM email_subscribers WHERE email=${esc(item.email)} COLLATE NOCASE);`);
            sql.push(`INSERT OR IGNORE INTO subscriber_email_preferences (subscriber_id,prayer_alerts,daily_prayer_schedule,religious_occasions,daily_content,announcements,community_events,marketing) SELECT id,${status==='active'?1:0},0,1,0,1,1,0 FROM email_subscribers WHERE email=${esc(item.email)} COLLATE NOCASE;`);
            for (const p of ['fajr','dhuhr','asr','maghrib','isha']) sql.push(`INSERT OR IGNORE INTO subscriber_prayer_preferences (subscriber_id,prayer,email_twenty,email_ten,email_athan) SELECT id,${esc(p)},0,0,${status==='active'?1:0} FROM email_subscribers WHERE email=${esc(item.email)} COLLATE NOCASE;`);
          }
          if (sql.length) {
            const file='/tmp/legacy-users.sql'; require('node:fs').writeFileSync(file, sql.join('\n'));
          }
          require('node:fs').writeFileSync('/tmp/import-summary.json', JSON.stringify({ discovered: addresses.size, active, blocked }, null, 2));
          NODE
          # Node ESM cannot use require; patch the two fs calls before execution.
          sed -i "1i import fs from 'node:fs';" /tmp/import.mjs
          sed -i "s/require('node:fs').writeFileSync/fs.writeFileSync/g" /tmp/import.mjs
          node /tmp/import.mjs
          if [ -s /tmp/legacy-users.sql ]; then
            npx wrangler d1 execute wopt-prayer-push --remote --file /tmp/legacy-users.sql
          fi
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT status, COUNT(*) AS n FROM email_subscribers GROUP BY status ORDER BY status;" > /tmp/final-counts.json
          out="$GITHUB_WORKSPACE/.github/legacy-user-import-result.txt"
          {
            echo "legacy_resend_import=completed"
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            jq -r '"discovered="+(.discovered|tostring),"candidate_active="+(.active|tostring),"candidate_blocked="+(.blocked|tostring)' /tmp/import-summary.json
            jq -r '.[0].results[] | "crm_status_"+.status+"="+(.n|tostring)' /tmp/final-counts.json
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Save safe import summary
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/legacy-user-import-result.txt
          git commit -m "Record Hassoun legacy user import" || true
          git push origin HEAD:work/hassoun-1.0-store-admin || true
