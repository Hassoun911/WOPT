name: Wire game history routes once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'Wire standalone multiplayer history routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch Worker routes
        shell: python
        run: |
          from pathlib import Path
          p = Path('push-server/src/index.ts')
          s = p.read_text()
          imp = 'import { finishGameSession, listGameHistory } from "./gameHistory";\n'
          anchor = 'import { handleGames } from "./games";\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('games import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          generic = '      } else if (url.pathname.startsWith("/games/")) {\n        response = (await handleGames(request, env, url)) ?? json({ error: "Not found" }, 404);\n'
          routes = '      } else if (request.method === "GET" && url.pathname === "/games/history") {\n        response = await listGameHistory(url, env);\n      } else if (request.method === "POST" && /^\\/games\\/rooms\\/[A-Z2-9]{6}\\/finish$/.test(url.pathname)) {\n        response = await finishGameSession(request, env, url.pathname.split("/")[3]);\n' + generic
          if 'url.pathname === "/games/history"' not in s:
              if generic not in s: raise SystemExit('generic games route anchor missing')
              s = s.replace(generic, routes, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- push-server/src/index.ts; then exit 0; fi
          git add push-server/src/index.ts
          git commit -m "Wire standalone multiplayer history routes"
          git push origin HEAD:work/hassoun-1.0-store-admin
