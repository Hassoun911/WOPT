name: Apply Hassoun Settings Support Widgets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-settings-support-widgets.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply integration
        run: python .github/scripts/apply-settings-support-widgets.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Validate push server TypeScript
        working-directory: push-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Validate PWA build
        working-directory: pwa
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          WOPT_STATIC_EXPORT=1 npm run build

      - name: Commit integrated settings and widget release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx mobile/app.config.ts push-server/src/index.ts
          git commit -m "Add Hassoun settings support legal and widget center" || exit 0
          git push origin HEAD:main
