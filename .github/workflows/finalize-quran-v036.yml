name: Finalize Quran V3

on:
  push:
    paths:
      - ".github/workflows/finalize-quran-v036.yml"
      - ".github/scripts/finalize-quran-v036.mjs"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Quran V3 finalization
        run: node .github/scripts/finalize-quran-v036.mjs

      - name: Commit finalized Quran V3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/quranRendering.tsx mobile/App.tsx mobile/app.config.ts
          git diff --cached --quiet && exit 0
          git commit -m "Finalize elegant Quran V3 radio and book experience"
          git push origin HEAD:main
