name: Build Hassoun v1.0.12 v55 ticker and native push check

on:
  push:
    branches:
      - release/v1.0.12-messaging-from-v1.0.11-good
    paths:
      - '.github/workflows/build-v112-v55-ticker-push-check.yml'
      - 'mobile/scripts/apply-v112-ticker-position-fix.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hassoun-v112-v55-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout exact v1.0.11-derived branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.12-messaging-from-v1.0.11-good

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reproduce exact v1.0.11 good source state
        run: |
          node scripts/apply-v110-location-fix.mjs
          node scripts/apply-v111-city-highlight-fix.mjs

      - name: Apply messaging system
        run: node scripts/apply-v112-messaging-fix.mjs

      - name: Fix next prayer responsive layout
        run: node scripts/apply-v112-next-prayer-layout-fix.mjs

      - name: Move scrolling ticker into top header gap
        run: node scripts/apply-v112-ticker-position-fix.mjs

      - name: Check and inject Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          rm -f google-services.json
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
          elif [ -n "${FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          fi

          if [ -s google-services.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          import json
          cfg = Path('google-services.json')
          json.loads(cfg.read_text())
          p = Path('app.config.ts')
          s = p.read_text()
          anchor = '  android: {\n    package: "ca.wopt.windsorprayertimes",'
          repl = '  android: {\n    googleServicesFile: "./google-services.json",\n    package: "ca.wopt.windsorprayertimes",'
          if anchor not in s:
              raise SystemExit('Android config anchor missing')
          p.write_text(s.replace(anchor, repl, 1))
          PY
            echo 'present' > /tmp/fcm-config-status.txt
            echo 'Android Firebase config: PRESENT' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'absent' > /tmp/fcm-config-status.txt
            echo 'Android Firebase config: ABSENT - remote APK push cannot obtain an FCM token in this local Gradle build.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare Hassoun logo
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          logo_path = Path('assets/hassoun-logo.png')
          if not logo_path.exists() or logo_path.stat().st_size == 0:
              raise SystemExit('Missing assets/hassoun-logo.png')
          logo = Image.open(logo_path).convert('RGBA')
          logo.save(logo_path, format='PNG', optimize=True)
          logo.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png', format='PNG', optimize=True)
          splash = Image.new('RGBA', (1024, 1024), (0,0,0,0))
          art = logo.copy()
          art.thumbnail((820, 820), Image.Resampling.LANCZOS)
          splash.alpha_composite(art, ((1024-art.width)//2, (1024-art.height)//2))
          splash.save('assets/splash-logo.png', format='PNG', optimize=True)
          PY
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png

      - name: Verify exact-lineage fixes
        run: |
          set -euo pipefail
          npm run typecheck
          grep -q 'version: "1.0.12"' app.config.ts
          grep -q 'versionCode: 55' app.config.ts
          grep -q 'nextAccent: { width: 24' src/HomePrayerPanel.tsx
          grep -q 'systemTickerOverlay' AppWithEmail.tsx
          grep -q 'SystemMessageTicker' AppWithEmail.tsx
          grep -q 'syncServerPush' AppWithEmail.tsx
          grep -q 'setPrayerLocation(refreshed.location)' App.tsx

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUT="android/app/build/outputs/apk/release/Hassoun-v1.0.12-v55-layout-ticker-fixed.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"

      - name: Upload APK and push config status
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.12-v55-layout-ticker-fixed
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-v55-layout-ticker-fixed.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-v55-layout-ticker-fixed.apk.sha256
            /tmp/fcm-config-status.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-v55-layout-ticker-fixed.apk'
          TAG='v1.0.12-v55-layout-ticker-fixed'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target release/v1.0.12-messaging-from-v1.0.11-good \
              --title 'Hassoun v1.0.12 v55 Layout + Ticker Fix' \
              --notes 'Exact v1.0.11 golden lineage. Keeps messaging, fixes Next Prayer card responsiveness, moves the scrolling CRM message into the top header gap, and checks/injects Android Firebase configuration when a configured repository secret is available.' \
              --prerelease
          fi
