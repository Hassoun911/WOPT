name: Build Hassoun v1.0.12 v60 Quran scroll + Adhan guard

on:
  push:
    branches:
      - release/v1.0.12-messaging-from-v1.0.11-good
    paths:
      - '.github/workflows/build-v112-v55-ticker-push-check.yml'
      - 'mobile/google-services.json'
      - 'mobile/scripts/apply-v112-ticker-position-fix.mjs'
      - 'mobile/scripts/apply-v112-firebase-native-push.mjs'
      - 'mobile/scripts/apply-v112-v57-android-push-registration.mjs'
      - 'mobile/scripts/apply-v112-v60-reader-adhan-fixes.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hassoun-v112-v60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout exact v1.0.11-derived branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.12-messaging-from-v1.0.11-good

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reproduce exact v1.0.11 good source state
        run: |
          node scripts/apply-v110-location-fix.mjs
          node scripts/apply-v111-city-highlight-fix.mjs

      - name: Apply messaging system
        run: node scripts/apply-v112-messaging-fix.mjs

      - name: Fix next prayer responsive layout
        run: node scripts/apply-v112-next-prayer-layout-fix.mjs

      - name: Move scrolling ticker into top header gap
        run: node scripts/apply-v112-ticker-position-fix.mjs

      - name: Enable Firebase native Android push
        run: node scripts/apply-v112-firebase-native-push.mjs

      - name: Force Android native token registration before Expo token
        run: node scripts/apply-v112-v57-android-push-registration.mjs

      - name: Fix Quran reverse paging and stale Adhan starts
        run: node scripts/apply-v112-v60-reader-adhan-fixes.mjs

      - name: Bump install version to 60
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.config.ts')
          s=p.read_text()
          for old in ('versionCode: 57','versionCode: 58','versionCode: 59'):
              s=s.replace(old, 'versionCode: 60')
          p.write_text(s)
          PY

      - name: Prepare Hassoun launcher and notification icons
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile, ImageFilter
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          logo_path = Path('assets/hassoun-logo.png')
          if not logo_path.exists() or logo_path.stat().st_size == 0:
              raise SystemExit('Missing assets/hassoun-logo.png')

          logo = Image.open(logo_path).convert('RGBA')
          logo.save(logo_path, format='PNG', optimize=True)
          logo.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png', format='PNG', optimize=True)

          splash = Image.new('RGBA', (1024, 1024), (0,0,0,0))
          art = logo.copy()
          art.thumbnail((820, 820), Image.Resampling.LANCZOS)
          splash.alpha_composite(art, ((1024-art.width)//2, (1024-art.height)//2))
          splash.save('assets/splash-logo.png', format='PNG', optimize=True)

          rgb = logo.convert('RGB')
          gray = rgb.convert('L')
          mask = gray.point(lambda p: 255 if p >= 95 else 0)
          mask = mask.filter(ImageFilter.MedianFilter(3)).filter(ImageFilter.MaxFilter(5))
          bbox = mask.getbbox()
          if not bbox:
              raise SystemExit('Could not derive Hassoun notification silhouette')
          crop = mask.crop(bbox)
          canvas_mask = Image.new('L', (192, 192), 0)
          crop.thumbnail((148, 148), Image.Resampling.LANCZOS)
          x=(192-crop.width)//2
          y=(192-crop.height)//2
          canvas_mask.paste(crop,(x,y))
          notif = Image.new('RGBA', (192,192), (255,255,255,0))
          notif.putalpha(canvas_mask)
          notif.save('assets/notification-icon.png', format='PNG', optimize=True)
          PY
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png
          pngcheck -q assets/notification-icon.png

      - name: Verify exact-lineage fixes
        run: |
          set -euo pipefail
          npm run typecheck
          grep -q 'version: "1.0.12"' app.config.ts
          grep -q 'versionCode: 60' app.config.ts
          grep -q 'googleServicesFile: "./google-services.json"' app.config.ts
          grep -q 'notification-icon.png' app.config.ts
          grep -q 'nextAccent: { width: 24' src/HomePrayerPanel.tsx
          grep -q 'systemTickerOverlay' AppWithEmail.tsx
          grep -q 'SystemMessageTicker' AppWithEmail.tsx
          grep -q 'syncServerPush' AppWithEmail.tsx
          grep -q 'getDevicePushTokenAsync' src/push.ts
          grep -q 'getExpoPushTokenAsync' src/push.ts
          grep -q 'nativeTokenPresent' src/push.ts
          grep -q 'readerLastScrollY.current <= 48' src/quran/QuranV3.tsx
          grep -q 'readerAtTop.current = y <= 48' src/quran/QuranV3.tsx
          grep -q 'Only a current validated prayer-alarm broadcast may play' modules/prayer-audio/android/src/main/java/ca/wopt/prayeraudio/PrayerAudioService.kt
          grep -q 'putExtra("scheduledAtMs", scheduledAtMs)' modules/prayer-audio/android/src/main/java/ca/wopt/prayeraudio/PrayerAlarmReceiver.kt
          test -s assets/notification-icon.png
          python3 - <<'PY'
          import json
          from PIL import Image
          data=json.load(open('google-services.json'))
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in data.get('client',[])]
          assert 'ca.wopt.windsorprayertimes' in packages
          im=Image.open('assets/notification-icon.png').convert('RGBA')
          assert im.getchannel('A').getbbox(), 'notification icon is empty'
          PY

      - name: Generate Android project with Firebase
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Firebase and notification icon wiring
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q 'ca.wopt.windsorprayertimes' android/app/google-services.json
          grep -R -q 'com.google.gms.google-services' android || { echo 'Google services Gradle plugin missing'; exit 1; }
          find android/app/src/main/res -type f | grep -E 'notification|expo_notification' || true

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUT="android/app/build/outputs/apk/release/Hassoun-v1.0.12-v60-quran-scroll-adhan-guard.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.12-v60-quran-scroll-adhan-guard
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-v60-quran-scroll-adhan-guard.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-v60-quran-scroll-adhan-guard.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-v60-quran-scroll-adhan-guard.apk'
          TAG='v1.0.12-v60-quran-scroll-adhan-guard'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target release/v1.0.12-messaging-from-v1.0.11-good \
              --title 'Hassoun v1.0.12 v60 Quran Scroll + Adhan Guard' \
              --notes 'Exact v1.0.11 golden lineage with native Android push, scrolling message placement fix, Next Prayer layout fix, Hassoun notification icon, easier bidirectional Quran page scrolling, and a native stale-alarm guard preventing accidental Adhan playback after install/update.' \
              --prerelease
          fi
