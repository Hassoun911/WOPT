name: Apply Quran Reader Polish

on:
  push:
    paths:
      - ".github/workflows/quran-reader-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin

      - name: Apply Quran reader fixes
        run: python .github/scripts/quran-reader-polish.py

      - name: Render safe-area app icons
        run: |
          rsvg-convert -w 1024 -h 1024 mobile/assets/hassoun-app-icon.svg -o mobile/assets/icon.png
          rsvg-convert -w 1024 -h 1024 mobile/assets/hassoun-app-icon.svg -o mobile/assets/adaptive-icon.png

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit Quran polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx mobile/src/quran/quranRendering.tsx mobile/app.config.ts mobile/assets/hassoun-app-icon.svg mobile/assets/icon.png mobile/assets/adaptive-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Polish Quran reader navigation player and icon"
          git push origin HEAD:main
