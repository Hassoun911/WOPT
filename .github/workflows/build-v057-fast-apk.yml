name: Build Hassoun v0.5.7 Verified APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v057-fast-apk-trigger.txt"

permissions:
  contents: write

concurrency:
  group: hassoun-v057-verified-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    steps:
      - name: Checkout v0.5.7
        uses: actions/checkout@v4

      - name: Verify release source
        run: |
          grep -q 'version: "0.5.7"' mobile/app.config.ts
          grep -q 'versionCode: 29' mobile/app.config.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: mobile
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Use validated Hassoun logo in widget
        run: |
          mkdir -p mobile/modules/hassoun-widget/android/src/main/res/drawable
          cp mobile/assets/icon.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Generate Android project
        working-directory: mobile
        timeout-minutes: 4
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK with embedded JS
        working-directory: mobile/android
        timeout-minutes: 18
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify release APK and embedded JS bundle
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-contents.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/apk-contents.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.7.apk
          echo "Verified standalone release APK contains the embedded JavaScript bundle."

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.5.7-verified-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.7.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record verified APK success
        run: |
          cat > .github/v057-fast-apk-status.txt <<EOF
          status=success
          standalone=true
          js_bundle_verified=true
          build_type=release
          version=0.5.7
          versionCode=29
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          artifact=hassoun-v0.5.7-verified-${{ github.run_number }}
          source_commit=$(git rev-parse HEAD)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v057-fast-apk-status.txt
          git commit -m "Record Hassoun v0.5.7 verified APK success" || true
          git push origin HEAD:main || true
