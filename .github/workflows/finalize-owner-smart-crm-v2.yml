name: Finalize Owner Smart CRM V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-owner-smart-crm-v2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/all-crm-email-20260821
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            push-server/package-lock.json
            pwa/package-lock.json

      - name: Apply all CRM and email fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main work/hassoun-1.0-store-admin
          git show origin/main:push-server/src/legacyResendImport.ts > push-server/src/legacyResendImport.ts
          python - <<'PY'
          from pathlib import Path

          def replace_file(path, pairs):
              p=Path(path); s=p.read_text()
              for a,b in pairs: s=s.replace(a,b)
              p.write_text(s)

          replace_file('push-server/wrangler.jsonc', [
            ('    "EMAIL_FROM": "Hassoun <notifications@hassoun.app>",\n',''),
            ('https://hassoun911.github.io/WOPT/','https://hassoun.app/')
          ])
          replace_file('push-server/src/subscribers.ts', [('https://hassoun911.github.io/WOPT/','https://hassoun.app/')])

          p=Path('push-server/src/entry.ts'); s=p.read_text()
          if 'importLegacyResendUsersOnce' not in s:
              s=s.replace('import { getLocationPrayerTimes } from "./locationPrayer";\n','import { getLocationPrayerTimes } from "./locationPrayer";\nimport { importLegacyResendUsersOnce } from "./legacyResendImport";\n')
          s=s.replace('const BACKEND_VERSION = "gps-prayer-email-audit-2026-08-21-1";','const BACKEND_VERSION = "owner-crm-smart-email-2026-08-21-2";')
          old='  async scheduled(controller: ScheduledController, env: Env, ctx: ExecutionContext) {\n    return worker.scheduled(controller, env, ctx);\n  }'
          new='  async scheduled(controller: ScheduledController, env: Env, ctx: ExecutionContext) {\n    ctx.waitUntil(importLegacyResendUsersOnce(env));\n    return worker.scheduled(controller, env, ctx);\n  }'
          s=s.replace(old,new)
          p.write_text(s)

          replace_file('push-server/src/prayerEmailTemplate.ts', [
            ('const ICONS: Record<PrayerKey, string> = { fajr: "☀", dhuhr: "◉", asr: "☼", maghrib: "◐", isha: "☾" };','const ICONS: Record<PrayerKey, string> = { fajr: "🌅", dhuhr: "☀️", asr: "🌤️", maghrib: "🌇", isha: "🌙" };'),
            ('`بقي ٢٠ دقيقة على صلاة ${prayer}`','`🕌⏳ بقي ٢٠ دقيقة على صلاة ${prayer} 🤲🌙`'),
            ('`بقي ١٠ دقائق على صلاة ${prayer}`','`🕌⏰ بقي ١٠ دقائق على صلاة ${prayer} 🤲✨`'),
            ('`حان وقت صلاة ${prayer}`','`🕌🔔 حان وقت صلاة ${prayer} 🤲🌙`'),
            ('`${prayer} in 20 minutes`','`🕌⏳ ${prayer} in 20 minutes 🤲🌙`'),
            ('`${prayer} in 10 minutes`','`🕌⏰ ${prayer} in 10 minutes 🤲✨`'),
            ('`It is time for ${prayer}`','`🕌🔔 It is time for ${prayer} 🤲🌙`'),
            ('UPCOMING ISLAMIC EVENT','🌙✨ UPCOMING ISLAMIC EVENT ✨🌙'),
            ('المناسبة الإسلامية القادمة','🌙✨ المناسبة الإسلامية القادمة ✨🌙'),
            ('Manage prayer alerts','⚙️ Manage prayer alerts 🔔'),
            ('إدارة تنبيهات الصلاة','⚙️ إدارة تنبيهات الصلاة 🔔'),
            ('Prayer • Qur’an • Knowledge','🕌 Prayer • 📖 Qur’an • 🤲 Knowledge ✨'),
            ('الصلاة • القرآن • المعرفة','🕌 الصلاة • 📖 القرآن • 🤲 المعرفة ✨'),
            ('Today’s prayer schedule','🕋 Today’s prayer schedule 🕌'),
            ('جدول صلوات اليوم','🕋 جدول صلوات اليوم 🕌'),
            ('DAILY REMINDER','📖✨ DAILY ISLAMIC REMINDER 🤲'),
            ('تذكير اليوم','📖✨ تذكير اليوم 🤲'),
            ('Hearts find comfort in the remembrance of Allah.','🤲💚 Hearts find comfort in the remembrance of Allah. 🌙✨'),
            ('ألا بذكر الله تطمئن القلوب.','🤲💚 ألا بذكر الله تطمئن القلوب. 🌙✨'),
            ('Stay connected to prayer','🕌 Stay connected to prayer • 🤲 Sadaqah Jariyah 🌙✨'),
            ('ابقَ متصلاً بالصلاة','🕌 ابقَ متصلاً بالصلاة • 🤲 صدقة جارية 🌙✨'),
            ('https://raw.githubusercontent.com/Hassoun911/WOPT/main/pwa/public/assets/hassoun-logo.png','https://hassoun.app/assets/hassoun-logo.png')
          ])

          p=Path('push-server/src/emailDelivery.ts'); s=p.read_text()
          for a,b in [
            ('https://raw.githubusercontent.com/Hassoun911/WOPT/main/pwa/public/assets/hassoun-logo.png','https://hassoun.app/assets/hassoun-logo.png'),
            ('Prayer • Qur’an • Knowledge','🕌 Prayer • 📖 Qur’an • 🤲 Knowledge ✨'),
            ('>HASSOUN</div>','>🕌 HASSOUN 🌙</div>'),
            ('>Hassoun</div>','>🕌 Hassoun • 🤲 Sadaqah Jariyah 🌙✨</div>'),
            ('Hassoun is a Sadaqah Jariyah for Abdul Jalil Hassoun and Salwa Hassoun.','🤲🌙 Hassoun is a Sadaqah Jariyah for Abdul Jalil Hassoun and Salwa Hassoun. 🕌✨'),
            ('Support this Sadaqah Jariyah and help keep Hassoun available and growing.','🤝🌙 Support this Sadaqah Jariyah and help keep Hassoun available and growing. 🤲✨'),
            ('  if (row.kind === "prayer" && profile) data.upcomingEvent = null;\n','')
          ]: s=s.replace(a,b)
          if 'function decorateSubject(' not in s:
              marker='function templateValues(rendered: RenderedEmail, data: Record<string, unknown>)'
              s=s.replace(marker,'function decorateSubject(subject: string) {\n  return /[🕌🌙🤲📖✨🔔⏰⏳]/u.test(subject) ? subject : `🕌🌙 ${subject} 🤲✨`;\n}\n\n'+marker)
          old='  if (!profile || profile.enabled !== 1) return builtIn;\n  const extra = enhancementHtml(profile, content, rawData, row.locale);\n  return appendEnhancements(builtIn, extra, profile, content, row.locale);'
          new='  if (!profile || profile.enabled !== 1) return { ...builtIn, subject: decorateSubject(builtIn.subject) };\n  const extra = enhancementHtml(profile, content, rawData, row.locale);\n  const enhanced = appendEnhancements(builtIn, extra, profile, content, row.locale);\n  return { ...enhanced, subject: decorateSubject(enhanced.subject) };'
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('pwa/app/admin/CrmDashboard.tsx'); s=p.read_text()
          hook='''\n  useEffect(() => {\n    if (!error && !notice) return;\n    const timer = window.setTimeout(() => { setError(\"\"); setNotice(\"\"); }, 6500);\n    return () => window.clearTimeout(timer);\n  }, [error, notice]);\n'''
          anchor='  const signIn = async (event: FormEvent) => {'
          if hook.strip() not in s: s=s.replace(anchor,hook+'\n'+anchor)
          s=s.replace('errorBanner:{maxWidth:1250,margin:"14px auto 0",padding:"12px 16px",background:"#fdecec",color:"#9c2626",borderRadius:12}','errorBanner:{position:"relative",zIndex:1,maxWidth:1218,boxSizing:"border-box",margin:"16px auto 0",padding:"12px 16px",background:"#fff3f1",color:"#9c2626",border:"1px solid #f3c9c4",borderRadius:12}')
          p.write_text(s)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-server pwa/app/admin
          git commit -m "Fix all Owner CRM and Islamic email issues" || true
          git push origin HEAD:fix/all-crm-email-20260821

      - name: Validate and migrate Worker
        working-directory: push-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler d1 migrations apply wopt-prayer-push --remote

      - name: Deploy production Worker
        working-directory: push-server
        run: npx wrangler deploy

      - name: Build Owner CRM
        working-directory: pwa
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Verify production API and data
        working-directory: push-server
        run: |
          sleep 10
          curl -fsS https://wopt-prayer-push.wopt-windsor.workers.dev/health > /tmp/health.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT status, COUNT(*) AS n FROM email_subscribers GROUP BY status ORDER BY status;" > /tmp/counts.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT COUNT(*) AS profiles FROM email_template_profiles; SELECT COUNT(*) AS content_items FROM email_content_library;" > /tmp/templates.json
          jq . /tmp/health.json
          cat /tmp/counts.json
          cat /tmp/templates.json

      - name: Save result
        run: |
          {
            echo "owner_smart_crm=deployed"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "worker_validation=passed"
            echo "owner_crm_build=passed"
            echo "worker_deploy=passed"
            jq -r '.[0].results[] | "crm_"+.status+"="+(.n|tostring)' /tmp/counts.json
            jq -r '.[]?.results[]? | to_entries[] | .key+"="+(.value|tostring)' /tmp/templates.json
          } > .github/owner-smart-crm-final-result.txt
          git add .github/owner-smart-crm-final-result.txt
          git commit -m "Record Owner smart CRM production repair" || true
          git push origin HEAD:fix/all-crm-email-20260821
