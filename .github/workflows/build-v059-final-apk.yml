name: Build Hassoun v0.5.9 Final APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v059-final-trigger.txt"

permissions:
  contents: write

concurrency:
  group: hassoun-v059-final-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.5.9 fixes
        run: python .github/scripts/fix-v059-reader-widget.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate corrected source
        id: validate
        shell: bash
        run: |
          set +e
          (
            grep -q 'version: "0.5.9"' mobile/app.config.ts
            grep -q 'versionCode: 31' mobile/app.config.ts
            grep -q 'readerViewportHeight' mobile/src/quran/QuranV3.tsx
            grep -q 'Keep the exact verified page-font sequence intact' mobile/src/quran/quranRendering.tsx
            grep -q 'updateWidget(context, manager, appWidgetId, false)' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
            cd mobile
            npm ci --ignore-scripts --no-audit --no-fund
            npx tsc --noEmit
          ) > /tmp/v059-validate.log 2>&1
          code=$?
          cat /tmp/v059-validate.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Commit fixed v0.5.9 source before build
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile
          git commit -m "Hassoun v0.5.9 fix Quran paging text and widgets" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Prepare native widget logo
        if: success()
        run: |
          mkdir -p mobile/modules/hassoun-widget/android/src/main/res/drawable
          cp mobile/assets/icon.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Generate Android project
        id: prebuild
        if: success()
        shell: bash
        run: |
          set +e
          (
            cd mobile
            npx expo prebuild --platform android --clean --no-install
          ) > /tmp/v059-prebuild.log 2>&1
          code=$?
          cat /tmp/v059-prebuild.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Build standalone release APK
        id: gradle
        if: success()
        shell: bash
        timeout-minutes: 21
        run: |
          set +e
          (
            cd mobile/android
            ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace
          ) > /tmp/v059-gradle.log 2>&1
          code=$?
          tail -n 280 /tmp/v059-gradle.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Verify standalone APK
        if: success()
        shell: bash
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/v059-apk-contents.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/v059-apk-contents.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.9.apk
          echo "Standalone v0.5.9 APK verified."

      - name: Upload v0.5.9 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.5.9-final-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.9.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record APK success
        if: success()
        run: |
          cat > .github/v059-apk-status.txt <<EOF
          status=success
          standalone=true
          js_bundle_verified=true
          quran_page_navigation_fixed=true
          quran_qcf_text_fixed=true
          quran_visible_page_playback=true
          widget_home_theme_fixed=true
          widget_countdown_centered=true
          widget_lockscreen_transparent=true
          multiplayer_backend=ready
          version=0.5.9
          versionCode=31
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          artifact=hassoun-v0.5.9-final-${{ github.run_number }}
          source_commit=$(git rev-parse HEAD)
          EOF
          rm -f .github/v059-last-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/v059-apk-status.txt .github/v059-last-build-error.log 2>/dev/null || true
          git commit -m "Record Hassoun v0.5.9 APK success" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Save exact build failure
        if: failure()
        shell: bash
        run: |
          {
            echo "Hassoun v0.5.9 final APK build failed"
            echo "run_id=${{ github.run_id }}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo
            for f in /tmp/v059-validate.log /tmp/v059-prebuild.log /tmp/v059-gradle.log; do
              echo "===== $f ====="
              if [ -f "$f" ]; then tail -n 240 "$f"; else echo "not reached"; fi
              echo
            done
          } > .github/v059-last-build-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v059-last-build-error.log
          git commit -m "Record Hassoun v0.5.9 APK build failure" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
