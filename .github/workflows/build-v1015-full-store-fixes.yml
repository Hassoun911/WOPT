name: Build Hassoun v1.0.16 Arabic Mushaf Reader

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.0.15-full-store-fixes
    paths:
      - 'mobile/**'
      - 'scripts/apply-v1015-full-store-fixes.py'
      - '.github/logo-official/**'
      - '.github/workflows/build-v1015-full-store-fixes.yml'

permissions:
  contents: write

concurrency:
  group: hassoun-v1016-arabic-reader
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout full feature release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.15-full-store-fixes

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install expo-image-picker expo-file-system expo-battery expo-brightness expo-document-picker expo-screen-orientation expo-video --npm

      - name: Apply full Masjid TV feature stack
        run: |
          set -euo pipefail
          node scripts/apply-wall-shell-for-masjid.mjs
          node scripts/apply-masjid-tv.mjs
          node scripts/apply-masjid-remote.mjs
          node scripts/apply-masjid-typefix.mjs
          node scripts/apply-masjid-tv-fixes.mjs
          node scripts/apply-masjid-clock-click-branding.mjs

      - name: Apply Quran, Google Play and display fixes
        working-directory: .
        run: python3 scripts/apply-v1015-full-store-fixes.py

      - name: Generate Hassoun logo icon and splash assets
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          tr -d '\n\r ' < ../.github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-official.jpg
          echo 'a233f3a8e323499df9643a29280d5f53d2c18468414107b034863f6d82517e75  /tmp/hassoun-official.jpg' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open('/tmp/hassoun-official.jpg').convert('RGB')

          # Full in-app artwork: keep every edge visible.
          art = ImageOps.contain(source, (900, 900), Image.Resampling.LANCZOS).convert('RGBA')
          transparent = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          transparent.alpha_composite(art, ((1024-art.width)//2, (1024-art.height)//2))

          # Launcher/adaptive icon: extra safe margin for Android masks.
          launcher = Image.new('RGBA', (1024, 1024), (7, 43, 37, 255))
          icon_art = ImageOps.contain(source, (720, 720), Image.Resampling.LANCZOS).convert('RGBA')
          launcher.alpha_composite(icon_art, ((1024-icon_art.width)//2, (1024-icon_art.height)//2))

          # Splash: larger than launcher icon but still never cropped.
          splash = Image.new('RGBA', (1024, 1024), (7, 43, 37, 255))
          splash_art = ImageOps.contain(source, (840, 840), Image.Resampling.LANCZOS).convert('RGBA')
          splash.alpha_composite(splash_art, ((1024-splash_art.width)//2, (1024-splash_art.height)//2))

          for target in ['assets/hassoun-logo.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              transparent.save(target, 'PNG', optimize=True)
          for target in ['assets/icon.png', 'assets/adaptive-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              launcher.save(target, 'PNG', optimize=True)
          for target in ['assets/splash-logo.png', 'assets/splash-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              splash.save(target, 'PNG', optimize=True)
          widget = Path('modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png')
          widget.parent.mkdir(parents=True, exist_ok=True)
          transparent.resize((512,512), Image.Resampling.LANCZOS).save(widget, 'PNG', optimize=True)
          PY

      - name: Verify full feature baseline reader branding and store fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            'v1.0.16 version': ('app.config.ts', 'version: "1.0.16"'),
            'Android code 56': ('app.config.ts', 'versionCode: 56'),
            'splash asset config': ('app.config.ts', 'image: "./assets/splash-logo.png"'),
            'TV routing': ('App.tsx', 'MasjidTvDisplay'),
            'Masjid display component': ('src/MasjidTvDisplay.tsx', 'orientationMode'),
            'Masjid video background': ('src/MasjidTvDisplay.tsx', 'backgroundVideoUrl'),
            'landscape TV layout': ('src/MasjidTvDisplay.tsx', 'landscapeLayout'),
            'portrait TV layout': ('src/MasjidTvDisplay.tsx', 'portraitLayout'),
            'remote Masjid controller': ('src/WallRemoteController.tsx', 'Masjid administration'),
            'tablet wall display': ('src/TabletWallPrayerDisplay.tsx', 'Ramadan'),
            'exact bookmark resume': ('src/quran/QuranV3.tsx', 'setSelectedAyah(from === "bookmarks" ? target : null)'),
            'responsive Quran audio': ('src/quran/QuranV3.tsx', 'Preparing Qur’an audio'),
            'no vertical auto-turn': ('src/quran/QuranV3.tsx', 'const handleVerticalTouchEnd = (_event'),
            'Arabic horizontal paging': ('src/quran/QuranV3.tsx', 'gestureState.dx < 0 ? 1 : -1'),
            'tap player visibility': ('src/quran/QuranV3.tsx', 'setPlayerVisible((visible) => !visible)'),
            'Connect Display settings': ('src/SettingsHub.tsx', 'ConnectDisplayPage'),
            'six digit display pairing': ('src/ConnectDisplayPage.tsx', '/masjid-displays/pair'),
          }
          for label, (path, marker) in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              if marker not in text:
                  raise SystemExit(f'Missing required feature: {label} ({path})')
              print(f'OK: {label}')
          quran = Path('src/quran/QuranV3.tsx').read_text(encoding='utf-8')
          if 'styles.readerPageNav' in quran:
              raise SystemExit('Large Previous/Next reader navigation is still present')
          for asset in ['assets/hassoun-logo.png','assets/icon.png','assets/adaptive-icon.png','assets/splash-logo.png']:
              p = Path(asset)
              if not p.exists() or p.stat().st_size < 10000:
                  raise SystemExit(f'Missing/invalid branding asset: {asset}')
              print(f'OK: {asset} ({p.stat().st_size} bytes)')
          PY
          npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Enable Android TV launcher and flexible orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          tree = ET.parse(manifest)
          root = tree.getroot()
          def has_feature(name):
              return any(el.tag == 'uses-feature' and el.attrib.get(f'{{{android}}}name') == name for el in root)
          if not has_feature('android.software.leanback'):
              ET.SubElement(root, 'uses-feature', {f'{{{android}}}name':'android.software.leanback', f'{{{android}}}required':'false'})
          if not has_feature('android.hardware.touchscreen'):
              ET.SubElement(root, 'uses-feature', {f'{{{android}}}name':'android.hardware.touchscreen', f'{{{android}}}required':'false'})
          app = root.find('application')
          if app is None: raise SystemExit('application not found')
          app.set(f'{{{android}}}banner', '@drawable/hassoun_widget_logo')
          main = next((a for a in app.findall('activity') if a.attrib.get(f'{{{android}}}name', '').endswith('MainActivity')), None)
          if main is None: raise SystemExit('MainActivity not found')
          main.set(f'{{{android}}}screenOrientation', 'unspecified')
          if not any('android.intent.category.LEANBACK_LAUNCHER' in [x.attrib.get(f'{{{android}}}name') for x in filt.findall('category')] for filt in main.findall('intent-filter')):
              filt = ET.SubElement(main, 'intent-filter')
              ET.SubElement(filt, 'action', {f'{{{android}}}name':'android.intent.action.MAIN'})
              ET.SubElement(filt, 'category', {f'{{{android}}}name':'android.intent.category.LEANBACK_LAUNCHER'})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY
          grep -q 'LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml

      - name: Build release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew clean assembleRelease bundleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and name release files
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.16-arabic-reader.apk
          cp "$AAB" android/app/build/outputs/bundle/release/Hassoun-v1.0.16-arabic-reader.aab
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.16-arabic-reader.apk | tee android/app/build/outputs/apk/release/Hassoun-v1.0.16-arabic-reader.apk.sha256
          sha256sum android/app/build/outputs/bundle/release/Hassoun-v1.0.16-arabic-reader.aab | tee android/app/build/outputs/bundle/release/Hassoun-v1.0.16-arabic-reader.aab.sha256
          ls -lh android/app/build/outputs/apk/release/Hassoun-v1.0.16-arabic-reader.apk android/app/build/outputs/bundle/release/Hassoun-v1.0.16-arabic-reader.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.16-Arabic-Reader
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.16-arabic-reader.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.16-arabic-reader.apk.sha256
            mobile/android/app/build/outputs/bundle/release/Hassoun-v1.0.16-arabic-reader.aab
            mobile/android/app/build/outputs/bundle/release/Hassoun-v1.0.16-arabic-reader.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease APK and AAB
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.16-arabic-reader.apk'
          AAB='mobile/android/app/build/outputs/bundle/release/Hassoun-v1.0.16-arabic-reader.aab'
          TAG='v1.0.16-arabic-reader'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --target release/v1.0.15-full-store-fixes --title 'Hassoun v1.0.16 Arabic Mushaf Reader' --notes 'Full v1.0.14+ Masjid/TV feature line with Google Play fixes. Qur’an pages now change only by Arabic-book horizontal swipe: left for next, right for previous. Vertical scrolling never changes pages. Large Previous/Next controls removed. Reader player is hidden by default and toggled by tapping the page. Hassoun logo is regenerated with safe margins for in-app branding, Android launcher/adaptive icon, splash screen and widget. Exact ayah bookmark resume and six-digit Connect Display are preserved.' --prerelease
          fi
