name: Wire game history once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'Add multiplayer finish and history API'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch game backend
        shell: python
        run: |
          from pathlib import Path
          p = Path('push-server/src/games.ts')
          s = p.read_text()
          marker = 'async function action(request: Request, env: Env, code: string) {\n'
          helpers = r'''async function saveGameHistory(env: Env, room: RoomRow, players: PlayerRow[]) {
  const winningScore = players.reduce((max, player) => Math.max(max, player.score), 0);
  const winners = players.filter((player) => player.score === winningScore);
  const winnerNames = winners.map((player) => player.name);
  const participants = players.map((player) => ({ id: player.player_id, name: player.name, score: player.score }));
  const sessionId = `${room.code}:${room.created_at}`;
  const statements = players.map((player) => {
    const result = winners.length > 1 && winners.some((winner) => winner.player_id === player.player_id)
      ? "tie"
      : winners.some((winner) => winner.player_id === player.player_id) ? "win" : "loss";
    return env.DB.prepare(
      `INSERT OR IGNORE INTO game_session_history (
         session_id, room_code, player_id, player_name, game_type, category, result,
         player_score, winning_score, winner_names_json, participants_json, started_at, finished_at
       ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, CURRENT_TIMESTAMP)`
    ).bind(
      sessionId, room.code, player.player_id, player.name, room.game_type, room.category, result,
      player.score, winningScore, JSON.stringify(winnerNames), JSON.stringify(participants), room.created_at
    );
  });
  if (statements.length) await env.DB.batch(statements);
}

async function gameHistory(env: Env, playerId: string) {
  if (!validPlayerId(playerId)) return json({ error: "Invalid player" }, 400);
  const { results } = await env.DB.prepare(
    `SELECT session_id, room_code, player_name, game_type, category, result, player_score,
            winning_score, winner_names_json, participants_json, started_at, finished_at
     FROM game_session_history WHERE player_id = ?
     ORDER BY finished_at DESC, id DESC LIMIT 100`
  ).bind(playerId).all<Record<string, unknown>>();
  return json({
    history: results.map((row) => ({
      sessionId: row.session_id,
      roomCode: row.room_code,
      playerName: row.player_name,
      gameType: row.game_type,
      category: row.category,
      result: row.result,
      playerScore: row.player_score,
      winningScore: row.winning_score,
      winnerNames: typeof row.winner_names_json === "string" ? JSON.parse(row.winner_names_json) : [],
      participants: typeof row.participants_json === "string" ? JSON.parse(row.participants_json) : [],
      startedAt: row.started_at,
      finishedAt: row.finished_at
    }))
  });
}

'''
          if 'async function saveGameHistory' not in s:
              if marker not in s: raise SystemExit('action marker missing')
              s = s.replace(marker, helpers + marker, 1)

          old = '  } else if ((actionType === "clue_correct" || actionType === "clue_skip") && room.game_type === "clue") {\n'
          finish = r'''  } else if (actionType === "finish") {
    if (!isHost) return json({ error: "Only the host can end the game" }, 403);
    if (room.status === "finished") return json(publicRoom(room, players, body.playerId));
    state.phase = "results";
    await saveState(env, code, "finished", state);
    players = await playersFor(env, code);
    const finishedRoom = (await roomByCode(env, code))!;
    await saveGameHistory(env, finishedRoom, players);
  } else if ((actionType === "clue_correct" || actionType === "clue_skip") && room.game_type === "clue") {
'''
          if 'actionType === "finish"' not in s:
              if old not in s: raise SystemExit('finish insertion anchor missing')
              s = s.replace(old, finish, 1)

          route_anchor = 'export async function handleGames(request: Request, env: Env, url: URL): Promise<Response | null> {\n'
          history_line = '  if (request.method === "GET" && url.pathname === "/games/history") return gameHistory(env, url.searchParams.get("playerId") ?? "");\n'
          if history_line not in s:
              if route_anchor not in s: raise SystemExit('route marker missing')
              s = s.replace(route_anchor, route_anchor + history_line, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- push-server/src/games.ts; then exit 0; fi
          git add push-server/src/games.ts
          git commit -m "Add multiplayer finish and history API"
          git push origin HEAD:work/hassoun-1.0-store-admin
