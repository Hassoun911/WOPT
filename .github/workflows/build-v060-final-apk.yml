name: Build Hassoun v0.6.0 Clean APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v060-final-trigger.txt"

permissions:
  contents: write

concurrency:
  group: hassoun-v060-clean-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply remaining v0.6.0 source once
        id: finish
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/finish-v060-remaining.py 2>&1 | tee /tmp/v060-finish.log

      - name: Commit finished v0.6.0 source before validation
        id: source_commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile push-server
          git commit -m "Apply remaining Hassoun v0.6.0 source fixes" || true
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((attempt * 3))
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            push-server/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate required v0.6.0 source markers
        id: markers
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            grep -q 'version: "0.6.0"' mobile/app.config.ts
            grep -q 'versionCode: 32' mobile/app.config.ts
            test -f mobile/src/BrandMark.tsx
            test -f mobile/src/islamicEvents.ts
            test -f mobile/src/IslamicEventsPage.tsx
            grep -q 'IslamicEventsPage' mobile/App.tsx
            grep -q 'upcomingIslamicDays <= 15' mobile/App.tsx
            grep -q 'scheduleIslamicEventReminders' mobile/src/notifications.ts
            test -f push-server/src/prayerEmailTemplate.ts
            grep -q 'prayerDashboardEmail' push-server/src/emailDelivery.ts
            grep -q 'prayerTimes:' push-server/src/globalPrayerEmail.ts
            grep -q 'upcomingEvent' push-server/src/globalPrayerEmail.ts
            grep -q 'UPCOMING ISLAMIC EVENT' push-server/src/prayerEmailTemplate.ts
            grep -q 'readerViewportHeight' mobile/src/quran/QuranV3.tsx
            grep -q 'playVisibleReaderPages' mobile/src/quran/QuranV3.tsx
            grep -q 'Do not build thousands of JS objects' mobile/src/quran/QuranV3.tsx
            grep -q 'QuranAudio.playRange' mobile/src/quran/QuranV3.tsx
            grep -q 'playRange' mobile/modules/quran-audio/index.ts
            grep -q 'ACTION_PLAY_RANGE' mobile/modules/quran-audio/android/src/main/java/ca/wopt/quranaudio/QuranAudioService.kt
            grep -q 'widgetCategory="keyguard"' mobile/modules/hassoun-widget/android/src/main/res/xml/hassoun_lock_widget_info.xml
            grep -q 'countdownStyleV060Migrated' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
            grep -q 'layout_width="92dp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml
            grep -q 'BrandMark size={42}' mobile/src/quran/QuranV3.tsx
            grep -q 'BrandMark size={44}' mobile/src/QuizGamesHub.tsx
            grep -q 'BrandMark size={46}' mobile/src/IslamicQuiz.tsx
            grep -q 'notification-icon.png' mobile/app.config.ts
          ) 2>&1 | tee /tmp/v060-markers.log

      - name: Validate mobile TypeScript
        id: mobile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            cd mobile
            npm ci --ignore-scripts --no-audit --no-fund
            npx tsc --noEmit
          ) 2>&1 | tee /tmp/v060-mobile.log

      - name: Validate Worker TypeScript and tests
        id: worker
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            cd push-server
            npm ci --ignore-scripts --no-audit --no-fund
            npm run typecheck
            npm test
          ) 2>&1 | tee /tmp/v060-worker.log

      - name: Generate clean Android project
        id: prebuild
        if: steps.markers.outcome == 'success' && steps.mobile.outcome == 'success' && steps.worker.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            cd mobile
            rm -rf android
            npx expo prebuild --platform android --clean --no-install
          ) 2>&1 | tee /tmp/v060-prebuild.log

      - name: Ensure Hassoun widget logo after prebuild
        if: steps.prebuild.outcome == 'success'
        shell: bash
        run: |
          mkdir -p mobile/modules/hassoun-widget/android/src/main/res/drawable
          cp mobile/assets/hassoun-logo.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Build clean standalone release APK
        id: gradle
        if: steps.prebuild.outcome == 'success'
        continue-on-error: true
        shell: bash
        timeout-minutes: 28
        run: |
          set -o pipefail
          (
            cd mobile/android
            ./gradlew clean assembleRelease --no-daemon --max-workers=2 --stacktrace
          ) 2>&1 | tee /tmp/v060-gradle.log

      - name: Verify standalone APK
        id: verify_apk
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/v060-apk-contents.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/v060-apk-contents.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v0.6.0.apk

      - name: Upload clean v0.6.0 APK
        id: upload
        if: steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.6.0-clean-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.6.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record exact build result
        if: always()
        shell: bash
        run: |
          {
            echo "version=0.6.0"
            echo "versionCode=32"
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "source_commit=${{ steps.source_commit.outputs.sha }}"
            echo "finish=${{ steps.finish.outcome }}"
            echo "markers=${{ steps.markers.outcome }}"
            echo "mobile=${{ steps.mobile.outcome }}"
            echo "worker=${{ steps.worker.outcome }}"
            echo "prebuild=${{ steps.prebuild.outcome }}"
            echo "gradle=${{ steps.gradle.outcome }}"
            echo "verify_apk=${{ steps.verify_apk.outcome }}"
            echo "upload=${{ steps.upload.outcome }}"
            echo "artifact=hassoun-v0.6.0-clean-${{ github.run_number }}"
            echo
            for f in /tmp/v060-finish.log /tmp/v060-markers.log /tmp/v060-mobile.log /tmp/v060-worker.log /tmp/v060-prebuild.log /tmp/v060-gradle.log; do
              echo "===== $f ====="
              if [ -f "$f" ]; then tail -n 180 "$f"; else echo "not reached"; fi
              echo
            done
          } > .github/v060-build-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v060-build-result.txt
          git commit -m "Record Hassoun v0.6.0 build result" || true
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep $((attempt * 3))
          done

      - name: Fail job when APK was not uploaded
        if: always() && steps.upload.outcome != 'success'
        run: exit 1
