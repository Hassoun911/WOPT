name: Apply mobile location context once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

concurrency:
  group: hassoun-mobile-location-context-once
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply GPS timezone across mobile scheduling helpers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Apply scheduling helper changes
        shell: python
        run: |
          from pathlib import Path

          def edit(path, pairs):
              p = Path(path)
              text = p.read_text()
              original = text
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                  else:
                      print(f"SKIP {path}: {old[:90]!r}")
              p.write_text(text)
              print(path, "changed" if text != original else "unchanged")

          edit("mobile/src/time.ts", [
            ('export function windsorDateKey(date = new Date()) {\n  const parts = partsInZone(date);',
             'export function windsorDateKey(date = new Date(), timeZone = WINDSOR_TIME_ZONE) {\n  const parts = partsInZone(date, timeZone);'),
            ('export function windsorSecondsSinceMidnight(date = new Date()) {\n  const parts = partsInZone(date);',
             'export function windsorSecondsSinceMidnight(date = new Date(), timeZone = WINDSOR_TIME_ZONE) {\n  const parts = partsInZone(date, timeZone);'),
            ('export function windsorLocalToDate(dateKey: string, time: string) {',
             'export function windsorLocalToDate(dateKey: string, time: string, timeZone = WINDSOR_TIME_ZONE) {'),
            ('    const actual = partsInZone(new Date(instantMs));',
             '    const actual = partsInZone(new Date(instantMs), timeZone);')
          ])

          edit("mobile/src/events.ts", [
            ('import { addDateDays, windsorDateKey, windsorLocalToDate } from "./time";',
             'import { WINDSOR_TIME_ZONE } from "./config";\nimport { addDateDays, windsorDateKey, windsorLocalToDate } from "./time";'),
            ('export function buildPrayerEvents(prayerTimes: PrayerTimes, days: number, now = new Date()) {\n  const events: PrayerEvent[] = [];\n  const today = windsorDateKey(now);',
             'export function buildPrayerEvents(prayerTimes: PrayerTimes, days: number, now = new Date(), timeZone = WINDSOR_TIME_ZONE) {\n  const events: PrayerEvent[] = [];\n  const today = windsorDateKey(now, timeZone);'),
            ('      const prayerDate = windsorLocalToDate(dateKey, prayerTime);',
             '      const prayerDate = windsorLocalToDate(dateKey, prayerTime, timeZone);')
          ])

          edit("mobile/src/prayerAudio.ts", [
            ('import type { PrayerKey, PrayerTimes } from "./types";',
             'import { WINDSOR_TIME_ZONE } from "./config";\nimport type { PrayerKey, PrayerTimes } from "./types";'),
            ('  suppliedPreferences?: PrayerAlertPreferences\n): Promise<AndroidPrayerAudioResult> {',
             '  suppliedPreferences?: PrayerAlertPreferences,\n  timeZone = WINDSOR_TIME_ZONE\n): Promise<AndroidPrayerAudioResult> {'),
            ('  const events = buildPrayerEvents(prayerTimes, 30)',
             '  const events = buildPrayerEvents(prayerTimes, 30, new Date(), timeZone)')
          ])

          edit("mobile/src/notifications.ts", [
            ('  STORAGE_KEYS\n} from "./config";',
             '  STORAGE_KEYS,\n  WINDSOR_TIME_ZONE\n} from "./config";'),
            ('const ISLAMIC_EVENT_MARKER_KEY = "hassoun:islamic-event:last-scheduled:v1";',
             'const ISLAMIC_EVENT_MARKER_KEY = "hassoun:islamic-event:last-scheduled:v1";\n\nexport type PrayerScheduleContext = { timeZone?: string; locationLabel?: string };'),
            ('export async function scheduleIslamicEventReminders(todayKey: string, locale: "en" | "ar") {',
             'export async function scheduleIslamicEventReminders(todayKey: string, locale: "en" | "ar", timeZone = WINDSOR_TIME_ZONE) {'),
            ('    const reminderDate = windsorLocalToDate(reminderDateKey, "09:00");',
             '    const reminderDate = windsorLocalToDate(reminderDateKey, "09:00", timeZone);'),
            ('function notificationContent(event: PrayerEvent, locale: "en" | "ar") {',
             'function notificationContent(event: PrayerEvent, locale: "en" | "ar", locationLabel = CITY_LABEL) {'),
            ('body: `${time} • ${CITY_LABEL}`',
             'body: `${time} • ${locationLabel}`'),
            ('  suppliedPreferences?: PrayerAlertPreferences\n) {',
             '  suppliedPreferences?: PrayerAlertPreferences,\n  context: PrayerScheduleContext = {}\n) {'),
            ('  const events = buildPrayerEvents(prayerTimes, days)\n',
             '  const timeZone = context.timeZone || WINDSOR_TIME_ZONE;\n  const locationLabel = context.locationLabel || CITY_LABEL;\n  const events = buildPrayerEvents(prayerTimes, days, new Date(), timeZone)\n'),
            ('      content: notificationContent(event, locale),',
             '      content: notificationContent(event, locale, locationLabel),'),
            ('  const androidAudio = await scheduleAndroidPrayerAudio(prayerTimes, preferences);',
             '  const androidAudio = await scheduleAndroidPrayerAudio(prayerTimes, preferences, timeZone);'),
            ('  preferences?: PrayerAlertPreferences\n) {\n  return withNotificationScheduleLock(() => schedulePrayerNotificationsUnlocked(prayerTimes, locale, preferences));',
             '  preferences?: PrayerAlertPreferences,\n  context: PrayerScheduleContext = {}\n) {\n  return withNotificationScheduleLock(() => schedulePrayerNotificationsUnlocked(prayerTimes, locale, preferences, context));')
          ])

      - name: Commit scheduling helpers
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- mobile/src/time.ts mobile/src/events.ts mobile/src/notifications.ts mobile/src/prayerAudio.ts; then
            echo "No helper changes to commit."
            exit 0
          fi
          git add mobile/src/time.ts mobile/src/events.ts mobile/src/notifications.ts mobile/src/prayerAudio.ts
          git commit -m "Apply GPS timezone across mobile scheduling helpers"
          git push origin HEAD:work/hassoun-1.0-store-admin
