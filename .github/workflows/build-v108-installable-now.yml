name: Build installable Hassoun v1.0.8 APK now

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-v108-installable-now.yml"

permissions:
  contents: write

concurrency:
  group: hassoun-v108-installable
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout validated Hassoun source
        uses: actions/checkout@v4
        with:
          ref: 728c5f0ed9132408405668153bc0f318c9cdceca
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install exact dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate known-good Android image assets
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin pngcrush
          rsvg-convert -w 1024 -h 1024 assets/hassoun-app-icon.svg -o /tmp/icon.png
          rsvg-convert -w 1024 -h 1024 assets/hassoun-app-icon.svg -o /tmp/adaptive-icon.png
          rsvg-convert -w 512 -h 512 assets/hassoun-notification.svg -o /tmp/notification-icon.png
          rsvg-convert -w 512 -h 512 assets/hassoun-brand.svg -o /tmp/hassoun-logo.png
          rsvg-convert -w 512 -h 512 assets/hassoun-brand.svg -o /tmp/splash-logo.png
          pngcrush -q -ow /tmp/icon.png
          pngcrush -q -ow /tmp/adaptive-icon.png
          pngcrush -q -ow /tmp/notification-icon.png
          pngcrush -q -ow /tmp/hassoun-logo.png
          pngcrush -q -ow /tmp/splash-logo.png
          cp /tmp/icon.png assets/icon.png
          cp /tmp/adaptive-icon.png assets/adaptive-icon.png
          cp /tmp/notification-icon.png assets/notification-icon.png
          cp /tmp/hassoun-logo.png assets/hassoun-logo.png
          cp /tmp/splash-logo.png assets/splash-logo.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp /tmp/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Set Android version to v1.0.8 code 49
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.config.ts')
          t = p.read_text()
          t = t.replace('version: "0.6.17"', 'version: "1.0.8"')
          t = t.replace('versionCode: 40', 'versionCode: 49')
          p.write_text(t)
          PY
          grep -q 'version: "1.0.8"' app.config.ts
          grep -q 'versionCode: 49' app.config.ts
          grep -q 'HomePrayerPanel' App.tsx
          grep -q 'QiblaDirectionScreen' App.tsx

      - name: Generate Android project
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build directly installable signed debug APK
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 --stacktrace
        working-directory: mobile/android

      - name: Verify and rename APK
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          cp "$APK" android/app/build/outputs/apk/debug/Hassoun-v1.0.8-installable.apk
          ls -lh android/app/build/outputs/apk/debug/Hassoun-v1.0.8-installable.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.8-installable
          path: mobile/android/app/build/outputs/apk/debug/Hassoun-v1.0.8-installable.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/debug/Hassoun-v1.0.8-installable.apk'
          TAG='v1.0.8-installable'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target 728c5f0ed9132408405668153bc0f318c9cdceca \
              --title 'Hassoun v1.0.8 Installable APK' \
              --notes 'Direct-install signed Android test APK built from the validated Hassoun prayer-home and smart-Qibla source.' \
              --prerelease
          fi
