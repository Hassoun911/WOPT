name: Build WOPT Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check Expo push configuration
        run: |
          test -n "${EXPO_PUBLIC_EAS_PROJECT_ID}"
          echo "Expo project ID is configured for native server push registration."

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android

      - name: Rename native Quran APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/WOPT-native-quran-v0.3.1.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: wopt-native-quran-v0.3.1-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/WOPT-native-quran-v0.3.1.apk
          if-no-files-found: error
          retention-days: 14
