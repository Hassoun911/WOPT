name: Build Hassoun Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - ".github/android-verify.trigger"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Connect Ask the Sheikh to the mobile app
        run: node scripts/apply-ask-sheikh-ui.mjs

      - name: Repair and verify approved Hassoun branding assets
        run: |
          test -s assets/hassoun-logo.png
          test -s assets/icon.png
          test -s assets/adaptive-icon.png
          test -s assets/splash-logo.png
          test -s assets/notification-icon.png
          cmp -s assets/hassoun-logo.png assets/icon.png
          cmp -s assets/hassoun-logo.png assets/adaptive-icon.png
          cmp -s assets/hassoun-logo.png assets/splash-logo.png
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src = Image.open('assets/hassoun-logo.png').convert('RGBA')
          src.save('/tmp/hassoun-clean.png', format='PNG', optimize=True)
          PY
          pngcheck -q /tmp/hassoun-clean.png
          cp /tmp/hassoun-clean.png assets/hassoun-logo.png
          cp /tmp/hassoun-clean.png assets/icon.png
          cp /tmp/hassoun-clean.png assets/adaptive-icon.png
          cp /tmp/hassoun-clean.png assets/splash-logo.png
          cmp -s assets/hassoun-logo.png assets/icon.png
          cmp -s assets/hassoun-logo.png assets/adaptive-icon.png
          cmp -s assets/hassoun-logo.png assets/splash-logo.png
          sha256sum assets/hassoun-logo.png assets/icon.png assets/adaptive-icon.png assets/splash-logo.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp assets/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png
          echo "Approved Hassoun pixels were losslessly re-encoded to a standards-valid PNG for Expo/Jimp."

      - name: Check Expo push configuration
        run: |
          test -n "${EXPO_PUBLIC_EAS_PROJECT_ID}"
          echo "Expo project ID is configured for native server push registration."

      - name: Typecheck mobile app
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android

      - name: Rename Hassoun APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Hassoun-v1.0.4.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v1.0.4-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.4.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record successful APK build
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          cat > .github/android-latest-build.txt <<EOF
          status=ready
          app=Hassoun
          version=1.0.4
          android_version_code=45
          artifact=hassoun-v1.0.4-${{ github.run_number }}
          apk_filename=Hassoun-v1.0.4.apk
          source_commit=${{ github.sha }}
          workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          logo_source=approved-hassoun-png-lossless-reencode
          ask_the_sheikh=enabled
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/android-latest-build.txt
          git commit -m "Record Hassoun v1.0.4 APK build" || true
          git push origin HEAD:work/hassoun-1.0-store-admin
