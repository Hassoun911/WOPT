name: Build Hassoun v1.0.12 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "scripts/apply-quran-resume-bookmark.py"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

concurrency:
  group: hassoun-v1012-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      EXPO_PUBLIC_PUSH_API_URL: https://wopt-prayer-push.wopt-windsor.workers.dev
      NODE_ENV: production
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund
          npm install --no-save --no-package-lock @typescript/typescript-linux-x64@7.0.2 expo-font

      - name: Apply Qur'an resume bookmark behavior
        working-directory: .
        run: python3 scripts/apply-quran-resume-bookmark.py

      - name: Verify messaging-enabled source
        run: |
          set -euo pipefail
          grep -q 'version: process.env.EXPO_APP_VERSION || "1.0.12"' app.config.ts
          grep -q 'versionCode: 53' app.config.ts
          grep -q 'registerDeviceForServerPush' AppWithEmail.tsx
          grep -q 'SystemMessageTicker' AppWithEmail.tsx
          grep -q 'setSelectedAyah(from === "bookmarks" ? target : null)' src/quran/QuranV3.tsx
          test -f src/SystemMessageTicker.tsx
          npx tsc --noEmit

      - name: Generate Android project
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and rename APK
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -l "$APK" > /tmp/hassoun-v1012.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/hassoun-v1012.txt
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging.apk
          ls -lh android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.12-messaging-APK
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging.apk'
          TAG='v1.0.12-messaging'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target main \
              --title 'Hassoun v1.0.12 Messaging' \
              --notes 'Android build with automatic server push registration, CRM-controlled scrolling system messages, and exact-ayah Qur’an resume bookmarks.' \
              --prerelease
          fi
