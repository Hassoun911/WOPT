name: Build Hassoun Android APK
# Widget layout refresh: trigger a fresh APK artifact after the native widget update.

on:
  workflow_dispatch:
  push:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: hassoun-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply clean Home layout
        run: node scripts/apply-v106-clean-home.mjs

      - name: Open Al-Hafiz from Memorize tile
        run: node scripts/fix-memorize-entry.mjs

      - name: Apply Al-Hafiz motivation and AI coach
        run: node scripts/apply-alhafiz-motivation.mjs

      - name: Build full-size Hassoun launcher icon
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          logo_path = Path('assets/hassoun-logo.png')
          if not logo_path.exists() or logo_path.stat().st_size == 0:
              raise SystemExit('Missing assets/hassoun-logo.png')

          logo = Image.open(logo_path).convert('RGBA')
          logo.save(logo_path, format='PNG', optimize=True)

          # Use the complete approved Hassoun artwork as the Android icon.
          # Do not wrap the full square logo inside Android's adaptive foreground layer,
          # because launchers inset that foreground and make the artwork look tiny.
          full_icon = logo.resize((1024, 1024), Image.Resampling.LANCZOS)
          full_icon.save('assets/icon.png', format='PNG', optimize=True)

          # Keep a clean source for the in-app fade splash.
          splash = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          art = logo.copy()
          art.thumbnail((820, 820), Image.Resampling.LANCZOS)
          splash.alpha_composite(art, ((1024-art.width)//2, (1024-art.height)//2))
          splash.save('assets/splash-logo.png', format='PNG', optimize=True)

          notification = Path('assets/notification-icon.png')
          if notification.exists() and notification.stat().st_size:
              Image.open(notification).convert('RGBA').save(notification, format='PNG', optimize=True)
          PY
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png
          pngcheck -q assets/notification-icon.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp assets/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Check Expo push configuration
        run: |
          test -n "${EXPO_PUBLIC_EAS_PROJECT_ID}"
          echo "Expo project ID configured."

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Verify Home, Al-Hafiz, icon, and startup fixes
        run: |
          grep -q 'v106Hero' App.tsx
          grep -q 'Explore Hassoun' App.tsx
          grep -q 'activeTab === "sheikh"' App.tsx
          grep -q 'onPress={() => setScreen("memorize")}' src/quran/QuranV3.tsx
          grep -q 'AI MEMORIZATION COACH' src/quran/AlHafizClassroom.tsx
          grep -q 'KEEP LEARNING' src/quran/AlHafizClassroom.tsx
          grep -q 'StartupSplash' AppRoot.tsx
          grep -q 'hassoun-logo.png' AppRoot.tsx
          grep -q 'icon: "./assets/icon.png"' app.config.ts
          ! grep -q 'adaptiveIcon' app.config.ts
          ! grep -q 'styles.fab' AppExperience.tsx
          ! grep -q 'Qur’an + Hadith' AppExperience.tsx

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android

      - name: Rename Hassoun APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Hassoun-v1.0.7.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v1.0.7-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.7.apk
          if-no-files-found: error
          retention-days: 14
