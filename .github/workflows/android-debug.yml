# Build integrated Hassoun v0.5.3 single-player Quran audio + premium widget release
name: Build Hassoun Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate Expo image assets
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin pngcrush
          rsvg-convert -w 1024 -h 1024 assets/hassoun-app-icon.svg -o /tmp/icon.png
          rsvg-convert -w 1024 -h 1024 assets/hassoun-app-icon.svg -o /tmp/adaptive-icon.png
          rsvg-convert -w 512 -h 512 assets/hassoun-notification.svg -o /tmp/notification-icon.png
          rsvg-convert -w 512 -h 512 assets/hassoun-brand.svg -o /tmp/hassoun-logo.png
          rsvg-convert -w 512 -h 512 assets/hassoun-brand.svg -o /tmp/splash-logo.png
          pngcrush -q -ow /tmp/icon.png
          pngcrush -q -ow /tmp/adaptive-icon.png
          pngcrush -q -ow /tmp/notification-icon.png
          pngcrush -q -ow /tmp/hassoun-logo.png
          pngcrush -q -ow /tmp/splash-logo.png
          cp /tmp/icon.png assets/icon.png
          cp /tmp/adaptive-icon.png assets/adaptive-icon.png
          cp /tmp/notification-icon.png assets/notification-icon.png
          cp /tmp/hassoun-logo.png assets/hassoun-logo.png
          cp /tmp/splash-logo.png assets/splash-logo.png

      - name: Check Expo push configuration
        run: |
          test -n "${EXPO_PUBLIC_EAS_PROJECT_ID}"
          echo "Expo project ID is configured for native server push registration."

      - name: Typecheck mobile app
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        run: ./gradlew assembleRelease
        working-directory: mobile/android

      - name: Rename Hassoun APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Hassoun-v0.5.3.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.5.3-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.3.apk
          if-no-files-found: error
          retention-days: 14
