name: Build and Submit Hassoun iOS v1.0.38 Feature Parity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-testflight-v1038-parity.yml"
      - ".github/ios-testflight-v1038-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-ios-testflight-v1038-parity
  cancel-in-progress: true

jobs:
  build-ios-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      EXPO_PUBLIC_PUSH_API_URL: ${{ vars.EXPO_PUBLIC_PUSH_API_URL || 'https://wopt-prayer-push.wopt-windsor.workers.dev' }}
      IOS_APP_VERSION: "1.0.38"
      IOS_BUILD_NUMBER: "2026092502"
      NODE_ENV: production

    steps:
      - name: Checkout synchronized dedicated iOS source
        uses: actions/checkout@v4
        with:
          ref: release/ios-current
          fetch-depth: 0

      - name: Apply proven iOS alert toggle fix
        working-directory: ios
        run: node scripts/apply-ios-alert-toggle-fix.mjs

      - name: Apply global GPS and iOS Athan fixes
        working-directory: ios
        run: python3 scripts/apply-ios-location-athan-fix.py

      - name: Apply GPS prayer source and permission controls
        working-directory: ios
        run: |
          python3 scripts/apply-ios-v1037-prayer-permissions.py
          python3 scripts/fix-ios-v1037-subscription.py

      - name: Apply shared Android/iOS feature parity layer
        working-directory: ios
        run: python3 scripts/apply-ios-v1038-parity.py

      - name: Restore iOS version and native configuration
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('app.config.ts')
          s=p.read_text()
          s=re.sub(r'version:\s*"[^"]+"',f'version: "{os.environ["IOS_APP_VERSION"]}"',s,count=1)
          s=re.sub(r'buildNumber:\s*"[^"]+"',f'buildNumber: "{os.environ["IOS_BUILD_NUMBER"]}"',s,count=1)
          s=s.replace('    "expo-audio",\n','')
          p.write_text(s)
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Verify Expo credentials
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx --yes eas-cli@latest whoami

      - name: Pin iOS dependencies and parity modules
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          npm install expo-audio@~57.0.5 --save --package-lock-only --ignore-scripts --no-audit --no-fund
          npx expo install expo-camera expo-linear-gradient expo-screen-orientation --npm

      - name: Install exact dependencies
        working-directory: ios
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate assets and install audio tooling
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y python3-pil pngcheck ffmpeg >/dev/null
          while IFS= read -r -d '' file; do
            if ! pngcheck -q "$file"; then
              python3 - "$file" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          path=Path(sys.argv[1])
          with Image.open(path) as src:
              src.load(); img=src.convert('RGBA')
          tmp=path.with_suffix('.ios-fixed.png')
          img.save(tmp,format='PNG',optimize=True); tmp.replace(path)
          PY
              pngcheck -q "$file"
            fi
          done < <(find assets -type f -name '*.png' -print0)

      - name: Generate Apple-compliant Athan notification sounds
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-ios-athan-sounds.sh
          test -s assets/hassoun_fajr_athan.wav
          test -s assets/hassoun_athan.wav

      - name: Verify iOS v1.0.38 parity source
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.38"' app.config.ts
          grep -q 'buildNumber: "2026092502"' app.config.ts
          grep -q 'supportsTablet: true' app.config.ts
          grep -q 'NSCameraUsageDescription' app.config.ts
          grep -q 'https://api.aladhan.com/v1/calendar/' src/prayerData.ts
          grep -q 'shouldUseOfficialWindsor' src/prayerData.ts
          grep -q 'locationRequiredFallback' src/prayerData.ts
          grep -q 'Nearby Mosques / Prayer Location' src/PrayerCalculationSettingsPage.tsx
          grep -q 'syncCalculationToPairedDisplays' src/prayerCalculationSettings.ts
          grep -q 'VoiceAssistantsPage' src/SettingsHub.tsx
          grep -q 'title={t("Displays"' src/SettingsHub.tsx
          grep -q 'ConnectDisplayPage' src/SettingsHub.tsx
          grep -q 'MasjidDisplayPage' src/SettingsHub.tsx
          grep -q 'useCameraPermissions' src/ConnectDisplayPage.tsx
          grep -q 'Hassoun iPhone / iPad' src/ConnectDisplayPage.tsx
          grep -q '/masjid-displays/register' src/MasjidDisplayPage.tsx
          grep -q 'DailyIslamicCards' App.tsx
          grep -q 'RefreshControl' App.tsx
          grep -q 'hassoun:last-active-tab:v2' App.tsx
          grep -q 'Enable camera' src/PermissionsStatusPage.tsx
          grep -q 'getRecordingPermissionsAsync' src/PermissionsStatusPage.tsx
          grep -q 'Notifications.getPermissionsAsync' src/PermissionsStatusPage.tsx
          grep -q 'scheduleIosTestAdhan' App.tsx
          grep -q 'hassoun_fajr_athan.wav' src/notifications.ts
          grep -q 'hassoun_athan.wav' src/notifications.ts
          grep -q '6804563934' eas.json
          if grep -q 'function windsorFallback' src/prayerData.ts; then exit 1; fi
          echo HASSOUN_IOS_V1038_PARITY_SOURCE_VERIFIED

      - name: Type-check patched iOS source
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @typescript/typescript-linux-x64@7.0.2 expo-font
          npm run typecheck

      - name: Validate Expo iOS bundle
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          npx expo config --type public > /tmp/hassoun-ios-v1038-config.json
          grep -q 'hassoun_fajr_athan.wav' /tmp/hassoun-ios-v1038-config.json
          grep -q 'hassoun_athan.wav' /tmp/hassoun-ios-v1038-config.json
          grep -q 'Hassoun uses the camera only' /tmp/hassoun-ios-v1038-config.json
          npx expo export --platform ios --output-dir /tmp/hassoun-ios-v1038-export
          test -d /tmp/hassoun-ios-v1038-export

      - name: Validate iOS native generation before EAS
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          npx expo prebuild --platform ios --clean --no-install
          test -f ios/Podfile
          grep -R -q 'NSCameraUsageDescription' ios || true
          find ios -type f \( -name 'hassoun_fajr_athan.wav' -o -name 'hassoun_athan.wav' \) -print | tee /tmp/ios-athan-assets.txt
          grep -q 'hassoun_fajr_athan.wav' /tmp/ios-athan-assets.txt
          grep -q 'hassoun_athan.wav' /tmp/ios-athan-assets.txt
          rm -rf ios

      - name: Build signed iOS v1.0.38 and submit to TestFlight
        working-directory: ios
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit-with-profile production \
            --non-interactive \
            --message "Hassoun iOS v1.0.38 build 2026092502 shared feature parity + GPS prayer source + displays + permissions" \
            --wait
