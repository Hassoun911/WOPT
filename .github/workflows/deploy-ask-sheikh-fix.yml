name: Deploy Ask the Sheikh Fix

on:
  workflow_dispatch:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths:
      - "push-server/src/askSheikh.ts"
      - "push-server/scripts/enable-ask-sheikh.mjs"
      - ".github/workflows/deploy-ask-sheikh-fix.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PUSH_WORKER_URL: https://wopt-prayer-push.wopt-windsor.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enable Ask the Sheikh API routes
        run: node scripts/enable-ask-sheikh.mjs
      - name: Validate worker
        run: npm run typecheck
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Install optional AI key
        if: env.OPENAI_API_KEY != ''
        run: printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
      - name: Verify Ask the Sheikh returns hadith
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            code=$(curl -sS -o /tmp/ask.json -w '%{http_code}' -X POST "${PUSH_WORKER_URL}/ask-sheikh/questions" -H 'Content-Type: application/json' --data '{"question":"What does Islam say about dogs?","locale":"en","quranRefs":[]}')
            if [ "$code" = "200" ] && jq -e '.ok == true and (.hadith | length >= 2) and ([.hadith[].source_text] | any(. == "Sahih al-Bukhari 2363"))' /tmp/ask.json >/dev/null; then
              cat /tmp/ask.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ask.json || true
          exit 1
