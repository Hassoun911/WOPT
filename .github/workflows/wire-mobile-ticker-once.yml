name: Wire mobile ticker once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'Wire scrolling ticker into mobile shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch App.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()
          imp = 'import ScrollingTicker from "./src/ScrollingTicker";\n'
          anchor = 'import SettingsHub from "./src/SettingsHub";\n'
          if imp not in s:
              s = s.replace(anchor, anchor + imp)
          old = '      <StatusBar style="dark" /><View style={styles.flex}>{body}</View>\n'
          new = '      <StatusBar style="dark" /><ScrollingTicker /><View style={styles.flex}>{body}</View>\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif '<ScrollingTicker />' not in s:
              raise SystemExit('App shell anchor not found')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- mobile/App.tsx; then exit 0; fi
          git add mobile/App.tsx
          git commit -m "Wire scrolling ticker into mobile shell"
          git push origin HEAD:work/hassoun-1.0-store-admin
