name: Diagnose Android build once

on:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths:
      - "mobile/**"
      - ".github/workflows/android-diagnose-once.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Diagnose mobile
        shell: bash
        run: |
          set +e
          cd mobile
          npm ci --ignore-scripts --no-audit --no-fund > /tmp/android-diagnose.log 2>&1
          code=$?
          if [ $code -eq 0 ]; then npm run typecheck >> /tmp/android-diagnose.log 2>&1; code=$?; fi
          echo "exit_code=$code" > ../.github/android-diagnose-result.txt
          echo "source_commit=$(git rev-parse HEAD)" >> ../.github/android-diagnose-result.txt
          echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ../.github/android-diagnose-result.txt
          echo "" >> ../.github/android-diagnose-result.txt
          tail -n 160 /tmp/android-diagnose.log >> ../.github/android-diagnose-result.txt
          exit 0
      - name: Commit diagnostic result
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add .github/android-diagnose-result.txt
          git commit -m "Record Android diagnosis" || true
          git pull --rebase origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
