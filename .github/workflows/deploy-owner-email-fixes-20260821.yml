name: Deploy Owner Email Fixes 2026-08-21

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-owner-email-fixes-20260821.yml"

permissions:
  contents: write

# Final trigger: sponsor logo compression + exact template test delivery.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Validate Worker
        working-directory: push-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Apply D1 migrations
        working-directory: push-server
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote

      - name: Deploy Worker
        working-directory: push-server
        run: npx wrangler deploy

      - name: Validate production Admin CRM
        working-directory: admin-crm
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Smoke test Worker
        run: |
          sleep 8
          curl -fsS https://wopt-prayer-push.wopt-windsor.workers.dev/health | tee /tmp/health.json

      - name: Record verified backend deployment on main
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git checkout main
          printf 'deployed_at=%s\nsource_branch=work/hassoun-1.0-store-admin\nsource_commit=%s\nworker_typecheck=passed\nworker_tests=passed\nd1_migrations=passed\ncloudflare_worker=deployed\nadmin_crm_build=passed\nworker_smoke_test=passed\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SOURCE_SHA" > .github/final-email-backend-result.txt
          git add .github/final-email-backend-result.txt
          git commit -m "Record verified owner email backend deployment"
          git push origin main
