name: Apply Ask the Sheikh Mobile UI

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - "mobile/scripts/apply-ask-sheikh-ui.mjs"
      - ".github/workflows/apply-ask-sheikh-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Ask the Sheikh navigation
        run: node mobile/scripts/apply-ask-sheikh-ui.mjs
      - name: Typecheck mobile
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit generated mobile source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          git commit -m "Connect Ask the Sheikh to mobile app" || true
          git push origin HEAD:work/hassoun-1.0-store-admin
