name: Apply Hassoun v0.6.12 Premium Canvas Widgets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/apply-widget-premium-structure-v0611.py"
      - ".github/workflows/apply-widget-premium-structure-v0611.yml"

permissions:
  contents: write

concurrency:
  group: hassoun-v0612-premium-canvas-widget
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply premium canvas widget renderer
        run: python .github/scripts/apply-widget-premium-structure-v0611.py

      - name: Validate premium canvas widget sources
        run: |
          set -euo pipefail
          test -f mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounWidgetBitmapRenderer.kt
          grep -q 'HassounWidgetBitmapRenderer.render' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'widget_canvas' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml
          grep -q 'widget_canvas' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml
          grep -q 'widget_canvas' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml
          grep -q 'widget_canvas' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml
          git diff --check

      - name: Commit premium canvas widgets and trigger APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'trigger=%s\nreason=v0.6.12-premium-canvas-widgets\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/v067-build-trigger.txt
          git add mobile/modules/hassoun-widget .github/v067-build-trigger.txt
          git commit -m "Render Hassoun widgets with premium design canvas" || true
          git pull --rebase origin main
          git push origin HEAD:main
