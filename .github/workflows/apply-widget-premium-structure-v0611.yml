name: Apply Hassoun v0.6.11 Premium Widget Structure

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/apply-widget-premium-structure-v0611.py"
      - ".github/scripts/fix-widget-premium-newlines-v0611.py"
      - ".github/workflows/apply-widget-premium-structure-v0611.yml"

permissions:
  contents: write

concurrency:
  group: hassoun-v0611-premium-widget-structure
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair premium widget Kotlin strings
        run: python .github/scripts/fix-widget-premium-newlines-v0611.py

      - name: Validate premium widget structure
        run: |
          set -euo pipefail
          grep -q 'widget_next_suffix' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml
          grep -q 'widget_next_suffix' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml
          grep -q 'widget_next_suffix' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml
          grep -q 'widget_next_suffix' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml
          grep -q 'setTextViewCompoundDrawables' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'formatClockMain' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q '\\n\$time' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          test -f mobile/modules/hassoun-widget/android/src/main/res/drawable/ic_widget_fajr.xml
          test -f mobile/modules/hassoun-widget/android/src/main/res/drawable/ic_widget_isha.xml
          git diff --check

      - name: Commit Kotlin repair and trigger APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'trigger=%s\nreason=v0.6.11-premium-widget-structure-kotlin-fix\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/v067-build-trigger.txt
          git add mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt .github/v067-build-trigger.txt
          git commit -m "Fix premium widget Kotlin multiline strings" || true
          git pull --rebase origin main
          git push origin HEAD:main
