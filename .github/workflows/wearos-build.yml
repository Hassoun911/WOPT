name: Wear OS Build

on:
  push:
    branches: [main]
    paths:
      - 'wearos/**'
      - '.github/workflows/wearos-build.yml'
  pull_request:
    paths:
      - 'wearos/**'
      - '.github/workflows/wearos-build.yml'

jobs:
  build-wearos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build Hassoun Wear OS modules
        run: gradle -p wearos :watchface:assembleDebug :datasource:assembleDebug --stacktrace
