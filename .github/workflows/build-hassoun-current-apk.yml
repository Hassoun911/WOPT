name: Build Hassoun current APK stable

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - '.github/workflows/build-hassoun-current-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-current-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout current Android branch
        uses: actions/checkout@v6
        with:
          ref: work/hassoun-1.0-store-admin

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply current committed release transforms
        run: |
          node scripts/apply-v106-clean-home.mjs
          node scripts/fix-memorize-entry.mjs
          node scripts/apply-alhafiz-motivation.mjs

      - name: Prepare launcher and widget logo with system Python
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          logo_path = Path('assets/hassoun-logo.png')
          if not logo_path.exists() or logo_path.stat().st_size == 0:
              raise SystemExit('Missing assets/hassoun-logo.png')
          logo = Image.open(logo_path).convert('RGBA')
          logo.save(logo_path, format='PNG', optimize=True)
          logo.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png', format='PNG', optimize=True)
          splash = Image.new('RGBA', (1024, 1024), (0,0,0,0))
          art = logo.copy()
          art.thumbnail((820, 820), Image.Resampling.LANCZOS)
          splash.alpha_composite(art, ((1024-art.width)//2, (1024-art.height)//2))
          splash.save('assets/splash-logo.png', format='PNG', optimize=True)
          n = Path('assets/notification-icon.png')
          if n.exists() and n.stat().st_size:
              Image.open(n).convert('RGBA').save(n, format='PNG', optimize=True)
          PY
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp assets/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Validate current fixes
        run: |
          npm run typecheck
          grep -q 'AI MEMORIZATION COACH' src/quran/AlHafizClassroom.tsx
          grep -q 'onPress={() => setScreen("memorize")}' src/quran/QuranV3.tsx
          grep -q 'widget_following_countdown' modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'val countdownTextColor =' modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'widget_following_icon' modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-current.apk
          ls -lh android/app/build/outputs/apk/release/Hassoun-current.apk

      - name: Upload Hassoun APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-current-android-apk
          path: mobile/android/app/build/outputs/apk/release/Hassoun-current.apk
          if-no-files-found: error
          retention-days: 14
