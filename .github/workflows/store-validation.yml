name: Hassoun 1.0 Store Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - work/store-crm-2026-08-19

permissions:
  contents: write

concurrency:
  group: hassoun-store-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-current-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-crm-2026-08-19
          fetch-depth: 0
      - name: Apply current Hassoun fixes
        run: |
          if grep -q 'Sadaqah Jariyah & donations' mobile/src/SettingsHub.tsx; then
            echo "Current Hassoun fixes already applied"
            exit 0
          fi
          python .github/scripts/fix-hassoun-sadaqah-admin-alerts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mobile/src/SettingsHub.tsx mobile/App.tsx mobile/src/prayerData.ts mobile/src/notifications.ts mobile/app.config.ts mobile/package.json mobile/package-lock.json pwa/app/admin/AdminControlCenter.tsx push-server/src/adminEmail.ts push-server/src/index.ts push-server/src/emailDelivery.ts
          git add -f -- mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          git diff --cached --quiet && exit 0
          git commit -m "Finish Hassoun Sadaqah admin alerts and widget fixes"
          git push origin HEAD:work/store-crm-2026-08-19
