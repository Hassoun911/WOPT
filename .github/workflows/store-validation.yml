name: Hassoun 1.0 Store Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - work/store-crm-2026-08-19
    paths:
      - "mobile/**"
      - "push-server/**"
      - ".github/workflows/store-validation.yml"

permissions:
  contents: read

concurrency:
  group: hassoun-store-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      EXPO_PUBLIC_PUSH_API_URL: ${{ vars.EXPO_PUBLIC_PUSH_API_URL || 'https://wopt-prayer-push.wopt-windsor.workers.dev' }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and type-check mobile app
        working-directory: mobile
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run quran:data
          npx tsc --noEmit

      - name: Validate Expo store configuration
        working-directory: mobile
        run: |
          npx expo config --type public --json > /tmp/hassoun-expo.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/hassoun-expo.json', 'utf8'));
          const fail = (message) => { console.error(message); process.exit(1); };
          if (config.name !== 'Hassoun') fail('Unexpected app name');
          if (config.version !== '1.0.0') fail(`Expected version 1.0.0, found ${config.version}`);
          if (config.android?.package !== 'ca.wopt.windsorprayertimes') fail('Unexpected Android package');
          if (config.ios?.bundleIdentifier !== 'ca.wopt.windsorprayertimes') fail('Unexpected iOS bundle id');
          const permissions = new Set(config.android?.permissions || []);
          if (!permissions.has('android.permission.SCHEDULE_EXACT_ALARM')) fail('SCHEDULE_EXACT_ALARM is required');
          if (permissions.has('android.permission.USE_EXACT_ALARM')) fail('USE_EXACT_ALARM must not be present in store build');
          NODE

      - name: Clean Android prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Validate Android API and permissions
        run: |
          ! grep -R "android.permission.USE_EXACT_ALARM" mobile/android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.SCHEDULE_EXACT_ALARM" mobile/android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" mobile/android/app/src/main/AndroidManifest.xml
          grep -R -E "targetSdk(Version)?[^0-9]*36|targetSdkVersion[^0-9]*36" mobile/android mobile/node_modules/expo mobile/node_modules/react-native | head -n 1

      - name: Build release APK and AAB for validation
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify validation artifacts
        run: |
          test -s mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s mobile/android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: hassoun-1.0-validation-android-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json
      - name: Install backend
        working-directory: push-server
        run: npm ci --include=dev --no-audit --no-fund
      - name: Type-check backend
        working-directory: push-server
        run: npx tsc --noEmit
      - name: Run backend tests
        working-directory: push-server
        run: npm test
