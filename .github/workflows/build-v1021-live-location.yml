name: Build Hassoun v1.0.21 Live Location APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v1021-trigger.txt"

permissions:
  contents: write

concurrency:
  group: hassoun-v1021-live-location
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.0.21 location-only patch
        run: |
          set -euo pipefail
          python .github/scripts/fix-v1021-live-location.py

      - name: Verify protected baseline and location changes
        run: |
          set -euo pipefail
          grep -q 'version: process.env.EXPO_APP_VERSION || "1.0.21"' mobile/app.config.ts
          grep -q 'versionCode: 55' mobile/app.config.ts
          grep -q 'loadLocationPrayerContext' mobile/App.tsx
          grep -q 'locationLabel' mobile/App.tsx
          grep -q 'Local Adhan calculation' mobile/src/localPrayerTimes.ts
          grep -q 'Windsor Islamic Association • official Adhan time' mobile/src/localPrayerTimes.ts
          grep -q 'hassoun-logo.png' mobile/App.tsx
          grep -q 'A continuing Sadaqah Jariyah' mobile/src/SettingsHub.tsx

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate TypeScript
        run: |
          cd mobile
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit validated source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile
          git commit -m "Hassoun v1.0.21 live GPS prayer location" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Clean Android prebuild
        run: |
          cd mobile
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        timeout-minutes: 28
        env:
          NODE_ENV: production
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/v1021-apk.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/v1021-apk.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-live-location.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v1.0.21-live-location-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-live-location.apk
          if-no-files-found: error
          retention-days: 14
