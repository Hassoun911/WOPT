name: Build Hassoun v1.0.21 Live Location APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v1021-trigger.txt"
      - ".github/workflows/build-v1021-live-location.yml"
      - ".github/scripts/fix-v1021-minimal-from-v1020.py"

permissions:
  contents: read

concurrency:
  group: hassoun-v1021-live-location
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact known-good v1.0.20 mobile baseline
        run: |
          set -euo pipefail
          BASELINE=d5e0ec5510079ef08a525a6a67d2f0dbbbe6d19a
          git checkout "$BASELINE" -- mobile
          grep -q 'version: "1.0.20"' mobile/app.config.ts
          grep -q 'AboutHassounPage' mobile/src/SettingsHub.tsx
          grep -q 'hassoun-logo.png' mobile/src/SettingsHub.tsx
          echo "Exact v1.0.20 mobile baseline restored from $BASELINE"

      - name: Apply minimal live-location fix
        run: |
          set -euo pipefail
          python .github/scripts/fix-v1021-minimal-from-v1020.py

      - name: Verify protected UI and location changes
        run: |
          set -euo pipefail
          grep -q 'version: process.env.EXPO_APP_VERSION || "1.0.21"' mobile/app.config.ts
          grep -q 'versionCode: 65' mobile/app.config.ts
          grep -q 'AboutHassounPage' mobile/src/SettingsHub.tsx
          grep -q 'hassoun-logo.png' mobile/src/SettingsHub.tsx
          grep -q '📍 {prayerLocation.label}' mobile/App.tsx
          grep -q 'loadPrayerTimes().then(async (refreshed)' mobile/App.tsx
          grep -q 'Local Adhan calculation • device location' mobile/App.tsx
          grep -q 'locationLabel: refreshed.location.label' mobile/App.tsx

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install exact v1.0.20 dependencies and native modules
        run: |
          set -euo pipefail
          cd mobile
          npm ci --no-audit --no-fund
          npx expo install expo-splash-screen expo-screen-orientation expo-document-picker expo-video expo-brightness expo-battery expo-image-picker

      - name: Repair legacy configured PNG CRCs without changing artwork
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcrush pngcheck
          for f in mobile/assets/icon.png mobile/assets/adaptive-icon.png mobile/assets/splash-logo.png mobile/assets/notification-icon.png; do
            test -s "$f"
            if ! pngcheck -q "$f"; then
              echo "Repairing PNG CRC metadata: $f"
              pngcrush -q -fix -ow "$f" >/dev/null 2>&1 || true
            fi
            pngcheck -q "$f" || { echo "PNG remains invalid: $f"; exit 1; }
          done

      - name: Clean Android prebuild
        run: |
          cd mobile
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        timeout-minutes: 30
        env:
          NODE_ENV: production
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/v1021-apk.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/v1021-apk.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-v1020-baseline-live-location.apk
          sha256sum mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-v1020-baseline-live-location.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v1.0.21-v1020-baseline-live-location-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-v1020-baseline-live-location.apk
          if-no-files-found: error
          retention-days: 14
