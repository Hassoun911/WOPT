name: Build Hassoun v1.0.21 Exact v1.0.20 + Live Location

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v1021-trigger.txt"
      - ".github/workflows/build-v1021-live-location.yml"
      - ".github/scripts/fix-v1021-no-resume-reload.py"
      - ".github/scripts/fix-v1021-native-masjid-display.py"
      - ".github/scripts/fix-v1021-unified-display-menu.py"
      - ".github/scripts/fix-v1021-pull-to-refresh.py"
      - ".github/scripts/fix-v1021-install-camera.py"
      - ".github/scripts/fix-v1021-display-pairing-admin.py"

permissions:
  contents: read

concurrency:
  group: hassoun-v1021-exact-v1020
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NODE_ENV: production
      EXPO_PUBLIC_EAS_PROJECT_ID: 69276452-f6f2-4d13-80e8-399ab32746ff
      EXPO_PUBLIC_PUSH_API_URL: https://wopt-prayer-push.wopt-windsor.workers.dev
    steps:
      - name: Checkout current build tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact source inputs used by the good v1.0.20/store build
        run: |
          set -euo pipefail
          GOOD=ae1efdf4ac082e6f4bf64d3b08d3bdccb23e8166
          git checkout "$GOOD" -- mobile scripts .github/logo-official
          grep -q 'AboutHassounPage' mobile/src/SettingsHub.tsx
          grep -q 'Abdul Jalil Hassoun' mobile/src/AboutHassounPage.tsx
          grep -q 'Salwa Hassoun' mobile/src/AboutHassounPage.tsx
          echo "Restored exact v1.0.20/store source inputs from $GOOD"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the exact v1.0.20 dependencies plus camera
        run: |
          set -euo pipefail
          cd mobile
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install expo-image-picker expo-file-system expo-battery expo-brightness expo-document-picker expo-screen-orientation expo-video expo-splash-screen expo-camera --npm
          npm install --no-save --include=optional @typescript/typescript-linux-x64@7.0.2
          test -d node_modules/@typescript/typescript-linux-x64

      - name: Reconstruct the exact good v1.0.20 feature stack
        run: |
          set -euo pipefail
          cd mobile
          node scripts/apply-wall-shell-for-masjid.mjs
          node scripts/apply-masjid-tv.mjs
          node scripts/apply-masjid-remote.mjs
          node scripts/apply-masjid-typefix.mjs
          node scripts/apply-masjid-tv-fixes.mjs
          node scripts/apply-masjid-clock-click-branding.mjs
          cd ..
          python3 scripts/apply-v1015-full-store-fixes.py
          python3 scripts/apply-v1017-quran-word-swipe-fixes.py
          python3 scripts/fix-v1017-quran-word-styles.py
          python3 scripts/apply-v1018-reader-gesture-hardfix.py
          python3 scripts/apply-v1018-quran-session-restore.py
          python3 scripts/apply-v1019-splash-animation.py
          python3 scripts/apply-v1020-fast-location-startup.py

      - name: Generate the approved Hassoun branding used by v1.0.20
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          tr -d '\n\r ' < .github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-approved.jpg
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source=Image.open('/tmp/hassoun-approved.jpg').convert('RGB')
          full=source.resize((1024,1024),Image.Resampling.LANCZOS).convert('RGBA')
          full.save('mobile/assets/hassoun-logo.png','PNG',optimize=True)
          full.save('mobile/assets/splash-logo.png','PNG',optimize=True)
          bg=(7,43,37,255)
          legacy=Image.new('RGBA',(1024,1024),bg)
          art=ImageOps.contain(source,(770,770),Image.Resampling.LANCZOS).convert('RGBA')
          legacy.alpha_composite(art,((1024-art.width)//2,(1024-art.height)//2))
          legacy.save('mobile/assets/icon.png','PNG',optimize=True)
          adaptive=Image.new('RGBA',(1024,1024),(0,0,0,0))
          art2=ImageOps.contain(source,(700,700),Image.Resampling.LANCZOS).convert('RGBA')
          adaptive.alpha_composite(art2,((1024-art2.width)//2,(1024-art2.height)//2))
          adaptive.save('mobile/assets/adaptive-icon.png','PNG',optimize=True)
          widget=Path('mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png')
          widget.parent.mkdir(parents=True,exist_ok=True)
          full.resize((512,512),Image.Resampling.LANCZOS).save(widget,'PNG',optimize=True)
          PY

      - name: Apply v1.0.21 fixes without changing the v1.0.20 UI
        run: |
          set -euo pipefail
          python3 .github/scripts/fix-v1021-no-resume-reload.py
          python3 .github/scripts/fix-v1021-native-masjid-display.py
          python3 .github/scripts/fix-v1021-unified-display-menu.py
          python3 .github/scripts/fix-v1021-pull-to-refresh.py

      - name: Verify exact UI is preserved and new issues are fixed
        run: |
          set -euo pipefail
          grep -q 'version: process.env.EXPO_APP_VERSION || "1.0.21"' mobile/app.config.ts
          grep -q 'versionCode: 65' mobile/app.config.ts
          grep -q 'AboutHassounPage' mobile/src/SettingsHub.tsx
          grep -q 'Abdul Jalil Hassoun' mobile/src/AboutHassounPage.tsx
          grep -q 'Salwa Hassoun' mobile/src/AboutHassounPage.tsx
          grep -q 'A continuing Sadaqah Jariyah' mobile/src/AboutHassounPage.tsx
          grep -q '📍 {prayerLocation.label}' mobile/App.tsx
          grep -q 'Location.reverseGeocodeAsync' mobile/src/prayerData.ts
          grep -q 'loadInitialPrayerTimes' mobile/App.tsx
          grep -q 'void loadPrayerTimes().then(async (refreshed)' mobile/App.tsx
          grep -q 'Resume in-place' mobile/App.tsx

          # Exactly one Displays menu; both display actions lead to the pairing/admin controller.
          test "$(grep -o 'title={t("Connect Display", "ربط شاشة")}' mobile/src/SettingsHub.tsx | wc -l)" -eq 1
          test "$(grep -o 'title={t("Wall & Masjid Display", "شاشة الحائط والمسجد")}' mobile/src/SettingsHub.tsx | wc -l)" -eq 1
          grep -q 'title={t("Displays", "الشاشات")}' mobile/src/SettingsHub.tsx
          grep -q 'ConnectDisplayPage locale={locale}' mobile/src/SettingsHub.tsx
          test "$(grep -o 'setPage("connectDisplay")' mobile/src/SettingsHub.tsx | wc -l)" -ge 2
          ! grep -q 'setPage("masjidDisplay")' mobile/src/SettingsHub.tsx
          ! grep -q 'MasjidDisplayPage locale={locale}' mobile/src/SettingsHub.tsx

          # Pairing screen must support QR scanning, manual six-digit code, saved devices and admin.
          grep -q 'CameraView' mobile/src/ConnectDisplayPage.tsx
          grep -q 'useCameraPermissions' mobile/src/ConnectDisplayPage.tsx
          grep -q 'Scan QR code' mobile/src/ConnectDisplayPage.tsx
          grep -q '6-DIGIT PAIRING CODE' mobile/src/ConnectDisplayPage.tsx
          grep -q 'SAVED DISPLAYS' mobile/src/ConnectDisplayPage.tsx
          grep -q 'openAdmin' mobile/src/ConnectDisplayPage.tsx
          grep -q 'mosqueLocation' mobile/src/ConnectDisplayPage.tsx
          grep -q 'DISPLAY ADMIN' mobile/src/ConnectDisplayPage.tsx
          grep -q 'expo-camera' mobile/package.json

          # Android pull-to-refresh must be wired on the actual Home ScrollView and force fresh location.
          grep -q 'const refreshHome = useCallback' mobile/App.tsx
          grep -q 'refreshing={refreshingHome}' mobile/App.tsx
          grep -q 'onRefresh={refreshHome}' mobile/App.tsx
          grep -q 'overScrollMode="always"' mobile/App.tsx
          grep -q 'progressViewOffset={8}' mobile/App.tsx
          grep -q 'HassounWidget.refresh()' mobile/App.tsx
          grep -q 'loadPrayerTimes({ forceLocation: true })' mobile/App.tsx

          # Guard against the exact run #42 failure.
          test -d mobile/node_modules/@typescript/typescript-linux-x64
          cd mobile
          npm run typecheck

      - name: Generate Android project
        run: |
          set -euo pipefail
          cd mobile
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Enable TV launcher exactly as the v1.0.20 build did
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('mobile/android/app/src/main/AndroidManifest.xml')
          ns='http://schemas.android.com/apk/res/android'
          ET.register_namespace('android',ns)
          tree=ET.parse(p); root=tree.getroot(); app=root.find('application')
          if app is None: raise SystemExit('application missing')
          app.set(f'{{{ns}}}banner','@drawable/hassoun_widget_logo')
          main=next((a for a in app.findall('activity') if a.attrib.get(f'{{{ns}}}name','').endswith('MainActivity')),None)
          if main is None: raise SystemExit('MainActivity missing')
          main.set(f'{{{ns}}}screenOrientation','unspecified')
          tree.write(p,encoding='utf-8',xml_declaration=True)
          PY

      - name: Build release APK
        timeout-minutes: 35
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -s "$APK"
          OUT="mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-exact-v1.0.20-display-pairing-admin-force-location-refresh.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.21-Display-Pairing-Admin-Force-Location-Refresh
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-exact-v1.0.20-display-pairing-admin-force-location-refresh.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-exact-v1.0.20-display-pairing-admin-force-location-refresh.apk.sha256
          if-no-files-found: error
          retention-days: 30
