name: Build Hassoun v1.0.21 Live Location APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v1021-trigger.txt"
      - ".github/workflows/build-v1021-live-location.yml"

permissions:
  contents: read

concurrency:
  group: hassoun-v1021-live-location
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact known-good v1.0.20 mobile baseline
        run: |
          set -euo pipefail
          BASELINE=d5e0ec5510079ef08a525a6a67d2f0dbbbe6d19a
          git checkout "$BASELINE" -- mobile
          grep -q 'version: "1.0.20"' mobile/app.config.ts
          grep -q 'AboutHassounPage' mobile/src/SettingsHub.tsx
          grep -q 'hassoun-logo.png' mobile/src/SettingsHub.tsx
          echo "Exact v1.0.20 mobile baseline restored from $BASELINE"

      - name: Apply location-only fix to exact v1.0.20 baseline
        run: |
          set -euo pipefail
          python .github/scripts/fix-v1021-live-location.py
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('mobile/app.config.ts')
          s = p.read_text()
          s = re.sub(r'version:\s*(?:process\.env\.EXPO_APP_VERSION\s*\|\|\s*)?"[^"]+"', 'version: process.env.EXPO_APP_VERSION || "1.0.21"', s, count=1)
          s = re.sub(r'versionCode:\s*\d+', 'versionCode: 65', s, count=1)
          p.write_text(s)
          PY

      - name: Verify protected UI and location changes
        run: |
          set -euo pipefail
          grep -q 'version: process.env.EXPO_APP_VERSION || "1.0.21"' mobile/app.config.ts
          grep -q 'versionCode: 65' mobile/app.config.ts
          grep -q 'AboutHassounPage' mobile/src/SettingsHub.tsx
          grep -q 'hassoun-logo.png' mobile/src/SettingsHub.tsx
          grep -q 'loadLocationPrayerContext' mobile/App.tsx
          grep -q 'locationLabel' mobile/App.tsx
          grep -q 'Local Adhan calculation' mobile/src/localPrayerTimes.ts
          grep -q 'Windsor Islamic Association' mobile/src/localPrayerTimes.ts

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate TypeScript
        run: |
          cd mobile
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Clean Android prebuild
        run: |
          cd mobile
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        timeout-minutes: 28
        env:
          NODE_ENV: production
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and name APK
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/v1021-apk.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/v1021-apk.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-v1020-baseline-live-location.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v1.0.21-v1020-baseline-live-location-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.21-v1020-baseline-live-location.apk
          if-no-files-found: error
          retention-days: 14
