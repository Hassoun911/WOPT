name: Wire final game finish client once
on:
  push:
    branches: [work/hassoun-1.0-store-admin]
permissions:
  contents: write
jobs:
  wire:
    if: github.event.head_commit.message != 'Connect Games save button to persistent history endpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch multiplayer client
        shell: python
        run: |
          from pathlib import Path
          p = Path('mobile/src/MultiplayerGames.tsx')
          s = p.read_text()
          old = '''  const act = async (type: string, extra: Record<string, unknown> = {}) => {
    if (!room || !playerId) return;
    await withBusy(() => api(`/games/rooms/${room.code}/action`, { method: "POST", body: JSON.stringify({ playerId, type, ...extra }) }));
  };
'''
          new = '''  const act = async (type: string, extra: Record<string, unknown> = {}) => {
    if (!room || !playerId) return;
    if (type === "finish") {
      await withBusy(async () => {
        const response = await fetch(`${API_BASE}/games/rooms/${room.code}/finish`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ playerId })
        });
        const payload = await response.json() as { room?: Room; error?: string };
        if (!response.ok || !payload.room) throw new Error(payload.error || `Request failed (${response.status})`);
        return payload.room;
      });
      return;
    }
    await withBusy(() => api(`/games/rooms/${room.code}/action`, { method: "POST", body: JSON.stringify({ playerId, type, ...extra }) }));
  };
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '/finish`' not in s:
              raise SystemExit('act function anchor missing')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- mobile/src/MultiplayerGames.tsx; then exit 0; fi
          git add mobile/src/MultiplayerGames.tsx
          git commit -m "Connect Games save button to persistent history endpoint"
          git pull --rebase origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
