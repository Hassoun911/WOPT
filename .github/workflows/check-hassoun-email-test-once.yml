name: Check Hassoun Production Email Test Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-hassoun-email-test-once.yml"

permissions:
  contents: write

jobs:
  check-email-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Install dependencies
        working-directory: push-server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Read live D1 email test status
        working-directory: push-server
        run: |
          set -euo pipefail
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT status, attempts, last_error, sent_at, created_at, updated_at FROM email_outbox WHERE idempotency_key = 'production-test-20260821-windsor-hassoun-v1' LIMIT 1;" > /tmp/email-test.json
          cat /tmp/email-test.json
          status="$(jq -r '.[0].results[0].status // "missing"' /tmp/email-test.json)"
          attempts="$(jq -r '.[0].results[0].attempts // ""' /tmp/email-test.json)"
          last_error="$(jq -r '.[0].results[0].last_error // ""' /tmp/email-test.json | tr '\n' ' ' | cut -c1-500)"
          sent_at="$(jq -r '.[0].results[0].sent_at // ""' /tmp/email-test.json)"
          created_at="$(jq -r '.[0].results[0].created_at // ""' /tmp/email-test.json)"
          updated_at="$(jq -r '.[0].results[0].updated_at // ""' /tmp/email-test.json)"
          cat > ../.github/email-test-status.txt <<EOF
          email_test_recipient=windsor.hassoun@gmail.com
          email_test_status=${status}
          attempts=${attempts}
          sent_at=${sent_at}
          created_at=${created_at}
          updated_at=${updated_at}
          last_error=${last_error}
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Record status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/email-test-status.txt
          git commit -m "Record Hassoun email test status" || true
          git push origin HEAD:main
