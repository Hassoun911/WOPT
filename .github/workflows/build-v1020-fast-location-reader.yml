name: Build Hassoun v1.0.20 Play Signed

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0.15-full-store-fixes]
    paths:
      - 'mobile/app.config.ts'
      - 'mobile/src/HassounSplashAnimation.tsx'
      - 'scripts/apply-v1018-reader-gesture-hardfix.py'
      - 'scripts/apply-v1020-fast-location-startup.py'
      - '.github/workflows/build-v1020-fast-location-reader.yml'

permissions:
  contents: write

concurrency:
  group: hassoun-v1020-play-signed
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      EXPO_PUBLIC_PUSH_API_URL: ${{ vars.EXPO_PUBLIC_PUSH_API_URL || 'https://wopt-prayer-push.wopt-windsor.workers.dev' }}
      NODE_ENV: production
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout full feature v1.0.20 branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.15-full-store-fixes

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install expo-image-picker expo-file-system expo-battery expo-brightness expo-document-picker expo-screen-orientation expo-video expo-splash-screen --npm

      - name: Verify trusted EAS credentials access
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx --yes eas-cli@latest whoami

      - name: Apply full feature stack
        run: |
          set -euo pipefail
          node scripts/apply-wall-shell-for-masjid.mjs
          node scripts/apply-masjid-tv.mjs
          node scripts/apply-masjid-remote.mjs
          node scripts/apply-masjid-typefix.mjs
          node scripts/apply-masjid-tv-fixes.mjs
          node scripts/apply-masjid-clock-click-branding.mjs

      - name: Apply Quran splash and fast-start fixes
        working-directory: .
        run: |
          set -euo pipefail
          python3 scripts/apply-v1015-full-store-fixes.py
          python3 scripts/apply-v1017-quran-word-swipe-fixes.py
          python3 scripts/fix-v1017-quran-word-styles.py
          python3 scripts/apply-v1018-reader-gesture-hardfix.py
          python3 scripts/apply-v1018-quran-session-restore.py
          python3 scripts/apply-v1019-splash-animation.py
          python3 scripts/apply-v1020-fast-location-startup.py

      - name: Set Google Play versionCode 64 and production AAB profile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p=Path('app.config.ts')
          s=p.read_text()
          s=re.sub(r'version:\s*"[^"]+"','version: "1.0.20"',s,count=1)
          s=re.sub(r'versionCode:\s*\d+','versionCode: 64',s,count=1)
          p.write_text(s)
          e=Path('eas.json')
          data=json.loads(e.read_text())
          prod=data.setdefault('build',{}).setdefault('production',{})
          prod.pop('autoIncrement',None)
          prod.setdefault('android',{})['buildType']='app-bundle'
          e.write_text(json.dumps(data,indent=2)+'\n')
          PY

      - name: Generate approved Hassoun branding
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          tr -d '\n\r ' < ../.github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-approved.jpg
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source=Image.open('/tmp/hassoun-approved.jpg').convert('RGB')
          full=source.resize((1024,1024),Image.Resampling.LANCZOS).convert('RGBA')
          full.save('assets/hassoun-logo.png','PNG',optimize=True)
          full.save('assets/splash-logo.png','PNG',optimize=True)
          bg=(7,43,37,255)
          legacy=Image.new('RGBA',(1024,1024),bg)
          art=ImageOps.contain(source,(770,770),Image.Resampling.LANCZOS).convert('RGBA')
          legacy.alpha_composite(art,((1024-art.width)//2,(1024-art.height)//2)); legacy.save('assets/icon.png','PNG',optimize=True)
          adaptive=Image.new('RGBA',(1024,1024),(0,0,0,0))
          art2=ImageOps.contain(source,(700,700),Image.Resampling.LANCZOS).convert('RGBA')
          adaptive.alpha_composite(art2,((1024-art2.width)//2,(1024-art2.height)//2)); adaptive.save('assets/adaptive-icon.png','PNG',optimize=True)
          widget=Path('modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png'); widget.parent.mkdir(parents=True,exist_ok=True)
          full.resize((512,512),Image.Resampling.LANCZOS).save(widget,'PNG',optimize=True)
          PY

      - name: Verify v1.0.20 store guarantees
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.20"' app.config.ts
          grep -q 'versionCode: 64' app.config.ts
          grep -q 'loadInitialPrayerTimes' App.tsx
          grep -q 'setPrayerLocation(initial.location)' App.tsx
          grep -q 'void loadPrayerTimes().then(async (refreshed)' App.tsx
          grep -q 'gestureState.dx >= 42) turnReaderPage(1)' src/quran/QuranV3.tsx
          grep -q 'gestureState.dx <= -42) turnReaderPage(-1)' src/quran/QuranV3.tsx
          grep -q 'Tap a word to hear only that word' src/quran/QuranV3.tsx
          npm run typecheck

      - name: Build Play AAB with trusted EAS production upload key
        run: |
          set -euo pipefail
          test -s google-services.json
          npx --yes eas-cli@latest build --platform android --profile production --local --non-interactive --output ./Hassoun-v1.0.20-play-signed.aab
          test -s Hassoun-v1.0.20-play-signed.aab
          ls -lh Hassoun-v1.0.20-play-signed.aab
          sha256sum Hassoun-v1.0.20-play-signed.aab | tee Hassoun-v1.0.20-play-signed.aab.sha256

      - name: Upload Google Play signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.20-Play-Signed-v64
          path: |
            mobile/Hassoun-v1.0.20-play-signed.aab
            mobile/Hassoun-v1.0.20-play-signed.aab.sha256
          if-no-files-found: error
          retention-days: 30
