name: Build Hassoun v1.0.20 Fast Start + Quran Direction

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0.15-full-store-fixes]
    paths:
      - 'mobile/app.config.ts'
      - 'mobile/src/HassounSplashAnimation.tsx'
      - 'scripts/apply-v1018-reader-gesture-hardfix.py'
      - 'scripts/apply-v1020-fast-location-startup.py'
      - '.github/workflows/build-v1020-fast-location-reader.yml'

permissions:
  contents: write

concurrency:
  group: hassoun-v1020-fast-location-reader
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.15-full-store-fixes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install expo-image-picker expo-file-system expo-battery expo-brightness expo-document-picker expo-screen-orientation expo-video expo-splash-screen --npm

      - name: Apply full feature stack
        run: |
          set -euo pipefail
          node scripts/apply-wall-shell-for-masjid.mjs
          node scripts/apply-masjid-tv.mjs
          node scripts/apply-masjid-remote.mjs
          node scripts/apply-masjid-typefix.mjs
          node scripts/apply-masjid-tv-fixes.mjs
          node scripts/apply-masjid-clock-click-branding.mjs

      - name: Apply Quran, splash and fast-start fixes
        working-directory: .
        run: |
          set -euo pipefail
          python3 scripts/apply-v1015-full-store-fixes.py
          python3 scripts/apply-v1017-quran-word-swipe-fixes.py
          python3 scripts/fix-v1017-quran-word-styles.py
          python3 scripts/apply-v1018-reader-gesture-hardfix.py
          python3 scripts/apply-v1018-quran-session-restore.py
          python3 scripts/apply-v1019-splash-animation.py
          python3 scripts/apply-v1020-fast-location-startup.py

      - name: Generate approved Hassoun branding
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          tr -d '\n\r ' < ../.github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-approved.jpg
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source=Image.open('/tmp/hassoun-approved.jpg').convert('RGB')
          full=source.resize((1024,1024),Image.Resampling.LANCZOS).convert('RGBA')
          full.save('assets/hassoun-logo.png','PNG',optimize=True)
          full.save('assets/splash-logo.png','PNG',optimize=True)
          bg=(7,43,37,255)
          legacy=Image.new('RGBA',(1024,1024),bg)
          art=ImageOps.contain(source,(770,770),Image.Resampling.LANCZOS).convert('RGBA')
          legacy.alpha_composite(art,((1024-art.width)//2,(1024-art.height)//2)); legacy.save('assets/icon.png','PNG',optimize=True)
          adaptive=Image.new('RGBA',(1024,1024),(0,0,0,0))
          art2=ImageOps.contain(source,(700,700),Image.Resampling.LANCZOS).convert('RGBA')
          adaptive.alpha_composite(art2,((1024-art2.width)//2,(1024-art2.height)//2)); adaptive.save('assets/adaptive-icon.png','PNG',optimize=True)
          widget=Path('modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png'); widget.parent.mkdir(parents=True,exist_ok=True)
          full.resize((512,512),Image.Resampling.LANCZOS).save(widget,'PNG',optimize=True)
          PY

      - name: Verify v1.0.20 guarantees
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          appcfg=Path('app.config.ts').read_text()
          app=Path('App.tsx').read_text()
          q=Path('src/quran/QuranV3.tsx').read_text()
          splash=Path('src/HassounSplashAnimation.tsx').read_text()
          rendering=Path('src/quran/quranRendering.tsx').read_text()
          required=[
            ('version: "1.0.20"',appcfg),('versionCode: 60',appcfg),
            ('gestureState.dx >= 42) turnReaderPage(1)',q),
            ('gestureState.dx <= -42) turnReaderPage(-1)',q),
            ('const handleVerticalTouchEnd = (_event',q),
            ('loadInitialPrayerTimes',app),('setPrayerLocation(initial.location)',app),
            ('void loadPrayerTimes().then(async (refreshed)',app),('📍 {prayerLocation.label}',app),
            ('setTimeout(() => onFinishedRef.current(), 2050)',splash),
            ('session: "wopt:quran:session:v1"',q),('Tap a word to hear only that word',q)
          ]
          for marker,text in required:
            if marker not in text: raise SystemExit('Missing: '+marker)
          forbidden=[
            'gestureState.dx <= -42) turnReaderPage(1)',
            'gestureState.dx >= 42) turnReaderPage(-1)',
            'Loading Windsor prayer times…',
            '["vertical", "↕"',
            'Scroll up/down. At the page edge, keep swiping to turn the page.'
          ]
          combined=app+'\n'+q+'\n'+rendering
          for marker in forbidden:
            if marker in combined: raise SystemExit('Forbidden: '+marker)
          PY
          npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Enable TV launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('android/app/src/main/AndroidManifest.xml'); ns='http://schemas.android.com/apk/res/android'; ET.register_namespace('android',ns)
          tree=ET.parse(p); root=tree.getroot(); app=root.find('application')
          if app is None: raise SystemExit('application missing')
          app.set(f'{{{ns}}}banner','@drawable/hassoun_widget_logo')
          main=next((a for a in app.findall('activity') if a.attrib.get(f'{{{ns}}}name','').endswith('MainActivity')),None)
          if main is None: raise SystemExit('MainActivity missing')
          main.set(f'{{{ns}}}screenOrientation','unspecified')
          tree.write(p,encoding='utf-8',xml_declaration=True)
          PY

      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew clean assembleRelease bundleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Name and verify files
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n1)"
          test -s "$APK"; test -s "$AAB"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.20-fast-location-reader.apk
          cp "$AAB" android/app/build/outputs/bundle/release/Hassoun-v1.0.20-fast-location-reader.aab
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.20-fast-location-reader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.20-Fast-Location-Reader
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.20-fast-location-reader.apk
            mobile/android/app/build/outputs/bundle/release/Hassoun-v1.0.20-fast-location-reader.aab
          if-no-files-found: error
          retention-days: 30
