name: Remove Quran Radio Duplicate Menu

on:
  push:
    paths:
      - ".github/workflows/remove-radio-quran-dock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate lower Quran menu
        run: python .github/scripts/remove-radio-quran-dock.py

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate Quran Radio menu dock"
          git push origin HEAD:main
