name: One-time Xcode error summary patch

on:
  push:
    branches:
      - work/store-crm-2026-08-19
    paths:
      - ".github/workflows/one-time-xcode-error-summary.yml"
      - ".github/scripts/one-time-xcode-error-summary.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-crm-2026-08-19
          fetch-depth: 0
      - run: python3 .github/scripts/one-time-xcode-error-summary.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Print concise Xcode compiler errors in store validation"
          git push origin HEAD:work/store-crm-2026-08-19
