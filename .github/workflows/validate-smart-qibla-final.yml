name: Validate Smart Qibla Final

on:
  push:
    paths:
      - '.github/workflows/validate-smart-qibla-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee /tmp/smart-qibla.log

      - name: Save exact validation result
        if: always()
        run: |
          cd ..
          printf '%s\n' "${{ steps.typecheck.outcome }}" > .github/smart-qibla-final-validation.txt
          printf 'validated_commit=%s\n' "$(git rev-parse HEAD)" >> .github/smart-qibla-final-validation.txt
          tail -40 /tmp/smart-qibla.log >> .github/smart-qibla-final-validation.txt || true

      - name: Commit result
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/smart-qibla-final-validation.txt
          git commit -m "Record smart Qibla final validation" || exit 0
          git push origin main
