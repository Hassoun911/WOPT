name: Build + TestFlight Hassoun iOS v1.0.8 Current

on:
  workflow_dispatch:
  push:
    branches:
      - release/ios-current
    paths:
      - '.github/workflows/build-ios-2026-08-23.yml'
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: hassoun-ios-current
  cancel-in-progress: true

env:
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
  EXPO_PUBLIC_PUSH_API_URL: ${{ vars.EXPO_PUBLIC_PUSH_API_URL || 'https://wopt-prayer-push.wopt-windsor.workers.dev' }}

jobs:
  build-ios-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout current iOS release branch
        uses: actions/checkout@v4
        with:
          ref: release/ios-current
          fetch-depth: 0

      - name: Prepare exact current Android app source plus iOS-only overlay
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/hassoun-ios-overlay/modules/quran-audio/ios
          cp ios/app.config.ts /tmp/hassoun-ios-overlay/app.config.ts
          cp ios/eas.json /tmp/hassoun-ios-overlay/eas.json
          cp ios/modules/quran-audio/expo-module.config.json /tmp/hassoun-ios-overlay/modules/quran-audio/expo-module.config.json
          cp ios/modules/quran-audio/ios/QuranAudioModule.swift /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudioModule.swift
          cp ios/modules/quran-audio/ios/QuranAudio.podspec /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudio.podspec

          rm -rf /tmp/hassoun-android-mobile
          mkdir -p /tmp/hassoun-android-mobile
          git archive origin/work/hassoun-1.0-store-admin:mobile | tar -x -C /tmp/hassoun-android-mobile

          find ios -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/hassoun-android-mobile/. ios/

          cp /tmp/hassoun-ios-overlay/app.config.ts ios/app.config.ts
          cp /tmp/hassoun-ios-overlay/eas.json ios/eas.json
          mkdir -p ios/modules/quran-audio/ios
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/expo-module.config.json ios/modules/quran-audio/expo-module.config.json
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudioModule.swift ios/modules/quran-audio/ios/QuranAudioModule.swift
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudio.podspec ios/modules/quran-audio/ios/QuranAudio.podspec

          echo "Prepared iOS from exact Android production source: work/hassoun-1.0-store-admin/mobile"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Verify Expo credentials
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx --yes eas-cli@latest whoami

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply exact same release transforms as current Android APK
        run: |
          set -euo pipefail
          node scripts/apply-v106-clean-home.mjs
          node scripts/fix-memorize-entry.mjs
          node scripts/apply-alhafiz-motivation.mjs

      - name: Verify Android parity and iOS Quran audio
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.8"' app.config.ts
          grep -q 'ITSAppUsesNonExemptEncryption: false' app.config.ts
          grep -q 'ca.wopt.windsorprayertimes' app.config.ts
          grep -q 'AI MEMORIZATION COACH' src/quran/AlHafizClassroom.tsx
          grep -q 'onPress={() => setScreen("memorize")}' src/quran/QuranV3.tsx
          grep -q 'AskSheikh' App.tsx
          grep -q '"platforms": \["android", "ios"\]' modules/quran-audio/expo-module.config.json
          grep -q 'QuranAudioModule' modules/quran-audio/expo-module.config.json
          test -s modules/quran-audio/ios/QuranAudioModule.swift
          test -s modules/quran-audio/ios/QuranAudio.podspec
          grep -q '6804563934' eas.json
          npm run typecheck

      - name: Validate iOS native generation and QuranAudio autolinking
        run: |
          set -euo pipefail
          rm -rf ios
          npx expo prebuild --platform ios --clean --no-install
          test -f ios/Podfile
          npx expo-modules-autolinking resolve --platform ios > /tmp/ios-autolinking.json
          grep -q 'QuranAudio' /tmp/ios-autolinking.json
          rm -rf ios

      - name: Build signed iOS 1.0.8 and submit to Hassoun TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit-with-profile production \
            --what-to-test 'Hassoun iOS v1.0.8 — exact current Android production app code plus native iOS Qur’an audio playback. Test ayah playback, pause/resume, next/previous, continuous Surah playback, background playback, lock-screen controls, Al-Hafiz, Ask the Sheikh, prayer countdown and navigation.' \
            --non-interactive \
            --wait
