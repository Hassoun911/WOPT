name: Build + TestFlight Hassoun iOS v1.0.8 2026-08-23

on:
  workflow_dispatch:
  push:
    branches:
      - release/ios-2026-08-23
    paths:
      - '.github/workflows/build-ios-2026-08-23.yml'
      - 'mobile/**'

permissions:
  contents: read

env:
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
  EXPO_PUBLIC_PUSH_API_URL: ${{ vars.EXPO_PUBLIC_PUSH_API_URL || 'https://wopt-prayer-push.wopt-windsor.workers.dev' }}

jobs:
  build-ios-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ios-2026-08-23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify Expo credentials
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'ERROR: Missing repository Actions secret EXPO_TOKEN.'
            echo 'Create an Expo access token and save it in GitHub > Settings > Secrets and variables > Actions > New repository secret > EXPO_TOKEN.'
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply current Hassoun feature set
        run: |
          set -euo pipefail
          node scripts/apply-smart-hafiz-picker.mjs
          node scripts/apply-interactive-hafiz-study.mjs
          node scripts/apply-hafiz-study-polish.mjs
          node scripts/apply-fast-widget-launch.mjs
          node scripts/fix-prayer-warning-build.mjs
          node scripts/apply-navigation-guide-next-prayer.mjs
          node scripts/apply-islamic-events-year-summary.mjs
          node scripts/restore-ask-sheikh.mjs

      - name: Verify matched app features and TypeScript
        run: |
          set -euo pipefail
          grep -q 'LESS THAN 5 MINUTES' src/HomePrayerPanel.tsx
          grep -q 'playingWordKey' src/quran/AlHafizClassroom.tsx
          grep -q 'Fill the blank' src/quran/AlHafizClassroom.tsx
          grep -q 'ABC question' src/quran/AlHafizClassroom.tsx
          grep -q 'Split card' src/quran/AlHafizClassroom.tsx
          grep -q 'hardwareBackPress' App.tsx
          grep -q 'remainingThisHijriYear' src/IslamicEventsPage.tsx
          grep -q 'AskSheikh' App.tsx
          npx tsc --noEmit
          npx expo config --type public >/tmp/hassoun-ios-expo-config.txt
          grep -q 'ca.wopt.windsorprayertimes' /tmp/hassoun-ios-expo-config.txt

      - name: Normalize iOS PNG assets
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y python3-pil pngcheck >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          assets = Path('assets')
          pngs = sorted(assets.rglob('*.png'))
          if not pngs:
              raise SystemExit('No PNG assets found')

          repaired = []
          failed = []
          for path in pngs:
              try:
                  with Image.open(path) as source:
                      source.load()
                      image = source.convert('RGBA')
                  tmp = path.with_suffix('.ios-fixed.png')
                  image.save(tmp, format='PNG', optimize=True)
                  tmp.replace(path)
                  repaired.append(str(path))
              except Exception as exc:
                  failed.append((str(path), str(exc)))

          print('Normalized PNG assets:')
          for path in repaired:
              print(' -', path)
          if failed:
              print('Unable to normalize:')
              for path, error in failed:
                  print(' -', path, error)
              raise SystemExit(1)
          PY
          while IFS= read -r -d '' file; do pngcheck -q "$file"; done < <(find assets -type f -name '*.png' -print0)

      - name: Validate iOS native generation
        run: |
          set -euo pipefail
          rm -rf ios
          npx expo prebuild --platform ios --clean --no-install
          test -f ios/Podfile
          test -d ios/Hassoun.xcodeproj || test -d ios/WOPT.xcodeproj || find ios -maxdepth 1 -name '*.xcodeproj' -print -quit | grep -q .
          rm -rf ios

      - name: Build signed iOS production app and auto-submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit-with-profile production \
            --what-to-test 'Hassoun iOS v1.0.8 • 2026-08-23 — Test current Android-parity layout, prayer countdown/warnings, Qur’an, Al-Hafiz, Ask the Sheikh, Islamic Events, alerts and navigation.' \
            --non-interactive \
            --wait \
            --json > /tmp/eas-ios-build.json
          cat /tmp/eas-ios-build.json

      - name: Download dated IPA
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const raw = fs.readFileSync('/tmp/eas-ios-build.json','utf8').trim();
          const start = raw.indexOf('[');
          const objStart = raw.indexOf('{');
          const jsonStart = start >= 0 && (objStart < 0 || start < objStart) ? start : objStart;
          if (jsonStart < 0) throw new Error('Could not find EAS build JSON');
          const parsed = JSON.parse(raw.slice(jsonStart));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.artifacts?.applicationArchiveURL;
          if (!url) throw new Error('EAS build completed but no IPA artifact URL was returned');
          cp.execFileSync('curl', ['-fL', url, '-o', 'Hassoun-iOS-v1.0.8-2026-08-23.ipa'], {stdio:'inherit'});
          if (!fs.existsSync('Hassoun-iOS-v1.0.8-2026-08-23.ipa') || fs.statSync('Hassoun-iOS-v1.0.8-2026-08-23.ipa').size < 100000) {
            throw new Error('Downloaded IPA is missing or unexpectedly small');
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: Hassoun-iOS-v1.0.8-2026-08-23
          path: mobile/Hassoun-iOS-v1.0.8-2026-08-23.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Confirm TestFlight submission status
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit:status --platform ios --profile production --json --non-interactive | tee /tmp/eas-testflight-status.json
