name: Build Hassoun v0.5.8 Complete Fixes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/fix-quran-visible-page-playback-v058.py"
      - ".github/workflows/apply-quran-visible-page-playback-v058.yml"

permissions:
  contents: write

concurrency:
  group: hassoun-v058-complete
  cancel-in-progress: true

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply all v0.5.8 fixes
        run: python .github/scripts/fix-quran-visible-page-playback-v058.py

      - name: Verify expected source changes
        run: |
          grep -q 'version: "0.5.8"' mobile/app.config.ts
          grep -q 'versionCode: 30' mobile/app.config.ts
          grep -q 'playVisibleReaderPages' mobile/src/quran/QuranV3.tsx
          grep -q 'android:widgetCategory="keyguard"' mobile/modules/hassoun-widget/android/src/main/res/xml/hassoun_lock_widget_info.xml
          grep -q 'hassoun_prayer_widget_slim' mobile/modules/hassoun-widget/android/src/main/res/xml/hassoun_prayer_widget_info.xml
          grep -q 'resolvedLayout' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies and typecheck
        working-directory: mobile
        timeout-minutes: 6
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit

      - name: Commit complete v0.5.8 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx mobile/app.config.ts mobile/modules/hassoun-widget
          git commit -m "Hassoun v0.5.8 Quran page playback and widget fixes" || true
          git push origin HEAD:main

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Use validated Hassoun logo in widget
        run: |
          mkdir -p mobile/modules/hassoun-widget/android/src/main/res/drawable
          cp mobile/assets/icon.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Generate Android project
        working-directory: mobile
        timeout-minutes: 5
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: mobile/android
        timeout-minutes: 20
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify APK is standalone and contains fixes
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-contents.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/apk-contents.txt
          test -f mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml
          test -f mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml
          test -f mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.8.apk
          echo "Standalone v0.5.8 verified."

      - name: Upload Hassoun v0.5.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.5.8-complete-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.8.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record v0.5.8 success
        run: |
          cat > .github/v058-apk-status.txt <<EOF
          status=success
          standalone=true
          js_bundle_verified=true
          quran_visible_page_playback=true
          widget_home_theme_fixed=true
          widget_keyguard_transparent=true
          widget_samsung_add_safe=true
          multiplayer_backend=ready
          version=0.5.8
          versionCode=30
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          artifact=hassoun-v0.5.8-complete-${{ github.run_number }}
          source_commit=$(git rev-parse HEAD)
          EOF
          git add .github/v058-apk-status.txt
          git commit -m "Record Hassoun v0.5.8 complete APK success" || true
          git push origin HEAD:main || true
