name: Apply Quran highlight fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Simplify Quran highlight maintenance workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/patch_quran_highlight.py
      - name: Commit migration
        run: |
          rm .github/workflows/quran-highlight-fix.yml
          rm scripts/patch_quran_highlight.py
          git config user.name "WOPT Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix visible Quran ayah highlighting"
          git push
