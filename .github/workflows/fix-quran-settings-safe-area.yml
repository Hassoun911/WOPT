name: Fix Quran Appearance Safe Area

on:
  push:
    paths:
      - ".github/workflows/fix-quran-settings-safe-area.yml"
      - ".github/scripts/fix-quran-settings-safe-area.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-safe-area:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe-area fix
        run: python .github/scripts/fix-quran-settings-safe-area.py

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Commit safe-area fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/quranRendering.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Quran appearance bottom safe area"
            git push origin HEAD:main
          fi
