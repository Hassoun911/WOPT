name: Wire CRM ticker once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'Add Ticker tab beside Push in CRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch CRM dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin-crm/app/CrmDashboard.tsx')
          s = p.read_text()
          imp = 'import TickerControl from "./TickerControl";\n'
          anchor = 'import { FormEvent, useCallback, useEffect, useMemo, useState } from "react";\n'
          if imp not in s:
              s = s.replace(anchor, anchor + imp)
          s = s.replace('type View = "dashboard" | "subscribers" | "content" | "control" | "push" | "team" | "audit";', 'type View = "dashboard" | "subscribers" | "content" | "control" | "push" | "ticker" | "team" | "audit";')
          old_tabs = '{ key: "control", label: "App Control" }, { key: "push", label: "Push" }, { key: "team", label: "Admins" }, { key: "audit", label: "Audit" }'
          new_tabs = '{ key: "control", label: "App Control" }, { key: "push", label: "Push" }, { key: "ticker", label: "Ticker" }, { key: "team", label: "Admins" }, { key: "audit", label: "Audit" }'
          if old_tabs in s:
              s = s.replace(old_tabs, new_tabs, 1)
          render_anchor = '    {view === "team" ? <section>'
          if '{view === "ticker" ? <TickerControl /> : null}' not in s:
              if render_anchor not in s: raise SystemExit('ticker render anchor missing')
              s = s.replace(render_anchor, '    {view === "ticker" ? <TickerControl /> : null}\n\n' + render_anchor, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- admin-crm/app/CrmDashboard.tsx; then exit 0; fi
          git add admin-crm/app/CrmDashboard.tsx
          git commit -m "Add Ticker tab beside Push in CRM"
          git push origin HEAD:work/hassoun-1.0-store-admin
