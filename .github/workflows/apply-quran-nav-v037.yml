name: Apply Quran Navigation v0.3.7

on:
  push:
    paths:
      - ".github/workflows/apply-quran-nav-v037.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply navigation patch
        run: node .github/scripts/quran-nav-v037.mjs

      - name: Commit navigation behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx mobile/App.tsx mobile/app.config.ts
          git diff --cached --quiet && exit 0
          git commit -m "Refine Quran app navigation visibility"
          git push origin HEAD:main
