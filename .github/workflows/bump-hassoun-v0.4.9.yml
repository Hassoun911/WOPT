name: Bump Hassoun v0.4.9

on:
  push:
    paths:
      - ".github/workflows/bump-hassoun-v0.4.9.yml"
      - ".github/scripts/bump-to-v0.4.9.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply version bump
        run: python .github/scripts/bump-to-v0.4.9.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.config.ts .github/workflows/android-debug.yml
          git commit -m "Build Hassoun v0.4.9 with safe-area fix"
          git push origin HEAD:main
