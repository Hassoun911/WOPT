# Retry after build workflow version was updated directly
name: Unify Quran audio UI and polish widget

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/unify-audio-widget-polish.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply single-player and widget polish
        run: python .github/scripts/unify-audio-widget-polish.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate mobile TypeScript without network refresh
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Commit Hassoun v0.5.3 polish
        run: |
          git config user.name "Hassoun911"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add mobile/App.tsx mobile/src/quran/QuranV3.tsx mobile/modules/hassoun-widget mobile/app.config.ts .github/workflows/android-debug.yml
          git diff --cached --quiet && exit 0
          git commit -m "Unify Quran player UI and redesign prayer widget"
          git push origin main
