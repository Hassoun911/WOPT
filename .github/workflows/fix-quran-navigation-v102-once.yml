name: Fix Quran navigation v1.0.2 once

on:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths:
      - ".github/workflows/fix-quran-navigation-v102-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Fix Quran browsing persistence and backward page gestures
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          rendering = Path('mobile/src/quran/quranRendering.tsx')
          s = rendering.read_text()
          old = 'setAppearanceState({ ...DEFAULT_QURAN_APPEARANCE, ...parsed, browseMode: "vertical" });'
          new = 'setAppearanceState({ ...DEFAULT_QURAN_APPEARANCE, ...parsed });'
          if old not in s:
              raise SystemExit('appearance browseMode force anchor not found')
          s = s.replace(old, new, 1)
          rendering.write_text(s)

          quran = Path('mobile/src/quran/QuranV3.tsx')
          s = quran.read_text()
          forced = '''  useEffect(() => {\n    if (screen === "reader" && appearance.browseMode !== "vertical") {\n      setAppearance((current) => ({ ...current, browseMode: "vertical" }));\n    }\n  }, [screen, appearance.browseMode]);\n\n'''
          if forced not in s:
              raise SystemExit('reader vertical-force effect not found')
          s = s.replace(forced, '', 1)

          old_view = '''        <View style={styles.readerBody} onTouchStart={handleReaderSurfaceTouchStart} onTouchEnd={handleReaderSurfaceTouchEnd} {...readerPanResponder.panHandlers}>'''
          new_view = '''        <View\n          style={styles.readerBody}\n          onTouchStart={(event) => { handleReaderSurfaceTouchStart(event); handleVerticalTouchStart(event); }}\n          onTouchEnd={(event) => { handleReaderSurfaceTouchEnd(event); handleVerticalTouchEnd(event); }}\n          {...readerPanResponder.panHandlers}\n        >'''
          if old_view not in s:
              raise SystemExit('reader body touch anchor not found')
          s = s.replace(old_view, new_view, 1)

          s = s.replace('''            onTouchStart={handleVerticalTouchStart}\n            onTouchEnd={handleVerticalTouchEnd}\n''', '', 1)

          # Make the edge responder capture a downward pull at the top immediately.
          old_capture = '''        if (appearance.browseMode !== "vertical") return false;\n        if (vertical < 20 || vertical <= horizontal * 1.15) return false;\n\n        const contentFits = readerContentHeight.current <= readerViewportHeight.current + 12;\n        if (gestureState.dy < 0) return readerAtBottom.current || contentFits;\n        if (gestureState.dy > 0) return readerAtTop.current || contentFits;'''
          new_capture = '''        if (appearance.browseMode !== "vertical") return false;\n        if (vertical < 12 || vertical <= horizontal * 1.05) return false;\n\n        const contentFits = readerContentHeight.current <= readerViewportHeight.current + 12;\n        if (gestureState.dy < 0) return readerAtBottom.current || contentFits;\n        if (gestureState.dy > 0) return readerAtTop.current || readerLastScrollY.current <= 8 || contentFits;'''
          if old_capture not in s:
              raise SystemExit('vertical responder capture anchor not found')
          s = s.replace(old_capture, new_capture, 1)

          old_release = '''        if (appearance.browseMode !== "vertical" || Math.abs(gestureState.dy) < 32) return;\n        const contentFits = readerContentHeight.current <= readerViewportHeight.current + 12;\n        if (gestureState.dy < 0 && (readerAtBottom.current || contentFits)) {\n          turnReaderPage(1);\n        } else if (gestureState.dy > 0 && (readerAtTop.current || contentFits)) {\n          turnReaderPage(-1);\n        }'''
          new_release = '''        if (appearance.browseMode !== "vertical" || Math.abs(gestureState.dy) < 26) return;\n        const contentFits = readerContentHeight.current <= readerViewportHeight.current + 12;\n        if (gestureState.dy < 0 && (readerAtBottom.current || contentFits)) {\n          turnReaderPage(1);\n        } else if (gestureState.dy > 0 && (readerAtTop.current || readerLastScrollY.current <= 8 || contentFits)) {\n          turnReaderPage(-1);\n        }'''
          if old_release not in s:
              raise SystemExit('vertical responder release anchor not found')
          s = s.replace(old_release, new_release, 1)
          quran.write_text(s)

          # Bump test build so it is clearly newer than 1.0.1.
          pkg = Path('mobile/package.json')
          data = json.loads(pkg.read_text())
          data['version'] = '1.0.2'
          pkg.write_text(json.dumps(data, indent=2) + '\n')

          lock = Path('mobile/package-lock.json')
          data = json.loads(lock.read_text())
          data['version'] = '1.0.2'
          data['packages']['']['version'] = '1.0.2'
          lock.write_text(json.dumps(data, indent=2) + '\n')

          cfg = Path('mobile/app.config.ts')
          s = cfg.read_text().replace('version: "1.0.1"', 'version: "1.0.2"', 1).replace('versionCode: 42', 'versionCode: 43', 1)
          cfg.write_text(s)
          PY

          cd mobile
          npm ci
          npm run typecheck
          cd ..

          git restore mobile/src/quran/quranData.generated.json mobile/src/quran/quranMeta.generated.json 2>/dev/null || true
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx mobile/src/quran/quranRendering.tsx mobile/package.json mobile/package-lock.json mobile/app.config.ts
          git commit -m "Fix Quran backward scrolling and horizontal browsing"
          git pull --rebase --autostash origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
