name: One-time Hassoun store cleanup

on:
  push:
    branches:
      - work/store-crm-2026-08-19
    paths:
      - ".github/workflows/one-time-store-cleanup.yml"
      - ".github/scripts/one-time-store-cleanup.py"

permissions:
  contents: write

concurrency:
  group: hassoun-one-time-store-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-crm-2026-08-19
          fetch-depth: 0
      - name: Apply isolated cleanup patch
        run: python3 .github/scripts/one-time-store-cleanup.py
      - name: Commit cleanup and remove one-time runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix store branch type and metadata cleanup"
          git push origin HEAD:work/store-crm-2026-08-19
