name: Fix Hassoun Hijri Date

on:
  push:
    paths:
      - ".github/workflows/fix-hijri-date.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hijri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Hijri date correction
        run: python .github/scripts/fix-hijri-date.py

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit Hijri correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Hassoun Hijri date offset"
          git push origin HEAD:main
