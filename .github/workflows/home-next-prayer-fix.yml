name: Apply Home Next Prayer Fix

on:
  push:
    paths:
      - ".github/workflows/home-next-prayer-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply home prayer fixes
        run: python .github/scripts/home-next-prayer-fix.py

      - name: Validate mobile TypeScript
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Commit home fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx mobile/app.config.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix next prayer countdown highlight and Hijri date"
          git push origin HEAD:main
