name: Hassoun Mobile Forward-Only Guard

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/LATEST_GOOD.md"
      - ".github/workflows/mobile-forward-only-guard.yml"
  push:
    branches:
      - main
      - latest-good
      - "work/**"
    paths:
      - "mobile/**"
      - ".github/LATEST_GOOD.md"
      - ".github/workflows/mobile-forward-only-guard.yml"

permissions:
  contents: read

jobs:
  prevent-mobile-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify latest-good minimums
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const configPath = 'mobile/app.config.ts';
          const quranPath = 'mobile/src/quran/QuranV3.tsx';
          const config = fs.readFileSync(configPath, 'utf8');
          const quran = fs.readFileSync(quranPath, 'utf8');

          const version = config.match(/\bversion:\s*"([^"]+)"/)?.[1];
          const versionCode = Number(config.match(/\bversionCode:\s*(\d+)/)?.[1] || 0);

          const parse = (value) => String(value || '0.0.0').split('.').map((part) => Number(part) || 0);
          const compare = (a, b) => {
            const aa = parse(a);
            const bb = parse(b);
            for (let i = 0; i < Math.max(aa.length, bb.length); i += 1) {
              const diff = (aa[i] || 0) - (bb[i] || 0);
              if (diff) return diff;
            }
            return 0;
          };

          const failures = [];
          if (!version || compare(version, '1.0.7') < 0) failures.push(`App version regressed: ${version || 'missing'} < 1.0.7`);
          if (versionCode < 48) failures.push(`Android versionCode regressed: ${versionCode} < 48`);
          if (!quran.includes('SmartMemorize')) failures.push('Smart Memorize / Tahfiz integration is missing from QuranV3.tsx');
          if (!config.includes('android.permission.SCHEDULE_EXACT_ALARM')) failures.push('Expected current exact-alarm permission is missing');
          if (!config.includes('supportsTablet: false')) failures.push('Expected current iOS phone-only configuration is missing');

          if (failures.length) {
            console.error('\nHASSOUN FORWARD-ONLY GUARD FAILED\n');
            for (const failure of failures) console.error(`- ${failure}`);
            console.error('\nStart from the latest-good branch instead of an older mobile source.');
            process.exit(1);
          }

          console.log(`Forward-only baseline OK: Hassoun ${version}, Android code ${versionCode}, Smart Memorize present.`);
          NODE

  build-v108-apk:
    if: github.event_name == 'pull_request' && github.head_ref == 'work/forward-from-latest-good'
    needs: prevent-mobile-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      NODE_ENV: production
    steps:
      - name: Checkout v1.0.8 forward branch
        uses: actions/checkout@v4
        with:
          ref: work/forward-from-latest-good
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies like last successful Android build
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund
          npm install --no-save --no-package-lock @typescript/typescript-linux-x64@7.0.2 expo-font

      - name: Reproduce verified v1.0.7 release transforms
        run: |
          set -euo pipefail
          node scripts/apply-v106-clean-home.mjs
          node scripts/fix-memorize-entry.mjs
          node scripts/apply-alhafiz-motivation.mjs

      - name: Overlay redesigned prayer home and smart Qibla
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Hassoun911/WOPT/728c5f0ed9132408405668153bc0f318c9cdceca/mobile/src/HomePrayerPanel.tsx -o src/HomePrayerPanel.tsx
          curl -fsSL https://raw.githubusercontent.com/Hassoun911/WOPT/728c5f0ed9132408405668153bc0f318c9cdceca/mobile/src/QiblaDirectionScreen.tsx -o src/QiblaDirectionScreen.tsx
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('App.tsx')
          text = path.read_text()

          if 'import HomePrayerPanel from "./src/HomePrayerPanel";' not in text:
              text = text.replace(
                  'import SettingsHub from "./src/SettingsHub";\n',
                  'import SettingsHub from "./src/SettingsHub";\nimport HomePrayerPanel from "./src/HomePrayerPanel";\nimport QiblaDirectionScreen from "./src/QiblaDirectionScreen";\n',
                  1,
              )

          text = text.replace(
              'type AppTab = "home" | "quran" | "quiz" | "alerts" | "events" | "more";',
              'type AppTab = "home" | "quran" | "quiz" | "alerts" | "events" | "qibla" | "more";',
              1,
          )

          home_pattern = re.compile(
              r'\n\s*\{next \? <View style=\{styles\.nextCard\}>.*?\n\s*<Pressable onPress=\{\(\) => setActiveTab\("quiz"\)\}',
              re.S,
          )
          home_replacement = '''\n\n      <HomePrayerPanel
        locale={locale}
        today={today}
        next={next}
        preferences={phoneAlertPreferences}
        onTogglePrayer={(prayer) => void togglePrayerAudio(prayer)}
        onOpenQibla={() => setActiveTab("qibla")}
      />

      <Pressable onPress={() => setActiveTab("quiz")}'''
          text, home_count = home_pattern.subn(home_replacement, text, count=1)
          if home_count != 1 and '<HomePrayerPanel' not in text:
              raise SystemExit('Could not replace legacy home prayer block')

          body_pattern = re.compile(
              r': activeTab === "events"\s*\n\s*\? <IslamicEventsPage locale=\{locale\} todayKey=\{todayKey\} onBack=\{\(\) => setActiveTab\("home"\)\} />\s*\n\s*: activeTab === "more"',
              re.S,
          )
          body_replacement = ''': activeTab === "events"
          ? <IslamicEventsPage locale={locale} todayKey={todayKey} onBack={() => setActiveTab("home")} />
          : activeTab === "qibla"
            ? <QiblaDirectionScreen locale={locale} onBack={() => setActiveTab("home")} />
            : activeTab === "more"'''
          text, body_count = body_pattern.subn(body_replacement, text, count=1)
          if body_count != 1 and 'activeTab === "qibla"' not in text:
              raise SystemExit('Could not wire Qibla screen')

          path.write_text(text)
          PY

      - name: Prepare exact Hassoun logo assets
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          logo_path = Path('assets/hassoun-logo.png')
          if not logo_path.exists() or logo_path.stat().st_size == 0:
              raise SystemExit('Missing assets/hassoun-logo.png')
          logo = Image.open(logo_path).convert('RGBA')
          logo.save(logo_path, format='PNG', optimize=True)
          logo.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png', format='PNG', optimize=True)
          splash = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          art = logo.copy()
          art.thumbnail((820, 820), Image.Resampling.LANCZOS)
          splash.alpha_composite(art, ((1024-art.width)//2, (1024-art.height)//2))
          splash.save('assets/splash-logo.png', format='PNG', optimize=True)
          PY
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp assets/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Validate v1.0.8 features without network pretypecheck
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.8"' app.config.ts
          grep -q 'versionCode: 49' app.config.ts
          grep -q 'SmartMemorize' src/quran/QuranV3.tsx
          grep -q 'AI MEMORIZATION COACH' src/quran/AlHafizClassroom.tsx
          grep -q 'HomePrayerPanel' App.tsx
          grep -q 'QiblaDirectionScreen' App.tsx
          grep -q 'Vibration.vibrate' src/QiblaDirectionScreen.tsx
          grep -q 'alignmentFlash' src/QiblaDirectionScreen.tsx
          npx tsc --noEmit

      - name: Clean Expo Android prebuild
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and package v1.0.8 APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/hassoun-v108.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/hassoun-v108.txt
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.8.apk
          ls -lh android/app/build/outputs/apk/release/Hassoun-v1.0.8.apk

      - name: Upload v1.0.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v1.0.8-forward-apk
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.8.apk
          if-no-files-found: error
          retention-days: 14
