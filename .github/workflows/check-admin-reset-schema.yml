name: Check Admin Reset Schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-admin-reset-schema.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply any pending migrations
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote
      - name: Verify reset schema
        run: |
          set -euo pipefail
          npx wrangler d1 execute wopt-prayer-push --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('admin_users','admin_sessions','admin_password_resets') ORDER BY name;"
          npx wrangler d1 execute wopt-prayer-push --remote --command "SELECT COUNT(*) AS admin_user_columns FROM pragma_table_info('admin_users') WHERE name IN ('password_hash','password_salt','password_iterations','must_change_password','updated_at');"
          npx wrangler d1 execute wopt-prayer-push --remote --command "SELECT COUNT(*) AS admin_session_columns FROM pragma_table_info('admin_sessions') WHERE name IN ('admin_user_id','revoked_at','expires_at');"
          npx wrangler d1 execute wopt-prayer-push --remote --command "SELECT COUNT(*) AS reset_columns FROM pragma_table_info('admin_password_resets') WHERE name IN ('id','admin_user_id','token_hash','expires_at','consumed_at');"
          npx wrangler d1 execute wopt-prayer-push --remote --command "SELECT COUNT(*) AS total_reset_rows FROM admin_password_resets;"
