name: Build and Submit Hassoun iOS to TestFlight

on:
  push:
    paths:
      - ".github/ios-testflight-trigger.txt"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hassoun-ios-testflight
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APP_VERSION: "1.0.1"
      NODE_ENV: production

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate iOS Quran audio wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"platforms": \["android", "ios"\]' mobile/modules/quran-audio/expo-module.config.json
          grep -q '"QuranAudioModule"' mobile/modules/quran-audio/expo-module.config.json
          test -s mobile/modules/quran-audio/ios/QuranAudioModule.swift
          test -s mobile/modules/quran-audio/ios/QuranAudio.podspec
          grep -q 'UIBackgroundModes: \["remote-notification", "audio"\]' mobile/app.config.ts
          cd mobile
          npx tsc --noEmit

      - name: Queue production iOS build and TestFlight submit
        id: eas
        working-directory: mobile
        shell: bash
        run: |
          set +e
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets." | tee /tmp/eas-ios.log
            EXIT_CODE=86
          else
            npx eas-cli@latest build \
              --platform ios \
              --profile production \
              --auto-submit \
              --non-interactive \
              --no-wait \
              --message "Hassoun iOS Quran audio fix" \
              2>&1 | tee /tmp/eas-ios.log
            EXIT_CODE=${PIPESTATUS[0]}
          fi
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record queue result
        if: always()
        shell: bash
        run: |
          TOKEN_PRESENT=false
          if [ -n "${EXPO_TOKEN:-}" ]; then TOKEN_PRESENT=true; fi
          {
            echo "queued_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "head_sha=${GITHUB_SHA}"
            echo "expo_token_present=${TOKEN_PRESENT}"
            echo "eas_exit_code=${{ steps.eas.outputs.exit_code }}"
            echo "ios_marketing_version=${EXPO_APP_VERSION}"
            echo
            echo "---- eas output ----"
            tail -n 120 /tmp/eas-ios.log 2>/dev/null || true
          } > .github/ios-testflight-build-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ios-testflight-build-result.txt
          git commit -m "Record iOS TestFlight build queue result" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Fail if EAS queue failed
        if: steps.eas.outputs.exit_code != '0'
        run: |
          echo "EAS queue failed with code ${{ steps.eas.outputs.exit_code }}"
          exit 1
