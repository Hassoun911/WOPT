name: Build and Submit Hassoun iOS v1.0.36 Global Location + Athan

on:
  push:
    paths:
      - ".github/ios-testflight-trigger.txt"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-ios-testflight-v1036-global-athan
  cancel-in-progress: true

jobs:
  build-ios-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      EXPO_PUBLIC_PUSH_API_URL: ${{ vars.EXPO_PUBLIC_PUSH_API_URL || 'https://wopt-prayer-push.wopt-windsor.workers.dev' }}
      IOS_APP_VERSION: "1.0.36"
      IOS_BUILD_NUMBER: "2026092401"
      NODE_ENV: production

    steps:
      - name: Checkout synchronized dedicated iOS source
        uses: actions/checkout@v4
        with:
          ref: release/ios-current
          fetch-depth: 0

      - name: Apply proven iOS alert toggle fix
        working-directory: ios
        run: node scripts/apply-ios-alert-toggle-fix.mjs

      - name: Apply global GPS and iOS Athan fixes
        working-directory: ios
        run: python3 scripts/apply-ios-location-athan-fix.py

      - name: Restore proven iOS native configuration
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app.config.ts')
          s = p.read_text()
          s = re.sub(r'version:\s*"[^"]+"', f'version: "{os.environ["IOS_APP_VERSION"]}"', s, count=1)
          s = re.sub(r'buildNumber:\s*"[^"]+"', f'buildNumber: "{os.environ["IOS_BUILD_NUMBER"]}"', s, count=1)
          s = s.replace('    "expo-audio",\n', '')
          p.write_text(s)
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Verify Expo credentials
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx --yes eas-cli@latest whoami

      - name: Pin proven Expo Audio dependency
        working-directory: ios
        run: npm install expo-audio@~57.0.3 --save --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        working-directory: ios
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate assets and install audio tooling
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y python3-pil pngcheck ffmpeg >/dev/null

          damaged=0
          while IFS= read -r -d '' file; do
            if ! pngcheck -q "$file"; then
              echo "Repairing damaged PNG: $file"
              python3 - "$file" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          path = Path(sys.argv[1])
          with Image.open(path) as src:
              src.load()
              img = src.convert('RGBA')
          tmp = path.with_suffix('.ios-fixed.png')
          img.save(tmp, format='PNG', optimize=True)
          tmp.replace(path)
          PY
              pngcheck -q "$file"
              damaged=$((damaged+1))
            fi
          done < <(find assets -type f -name '*.png' -print0)

          echo "PNG files repaired: ${damaged}"
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png
          pngcheck -q assets/notification-icon.png
          pngcheck -q assets/hassoun-logo.png

      - name: Generate Apple-compliant Athan notification sounds
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-ios-athan-sounds.sh
          test -s assets/hassoun_fajr_athan.wav
          test -s assets/hassoun_athan.wav

      - name: Verify iOS 1.0.36 global location and Athan fixes
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.36"' app.config.ts
          grep -q 'buildNumber: "2026092401"' app.config.ts
          grep -q 'HomePrayerPanel' App.tsx
          grep -q 'QiblaDirectionScreen' App.tsx
          grep -q 'SystemMessageTicker' AppWithEmail.tsx
          grep -q 'registerDeviceForServerPush' AppWithEmail.tsx
          grep -q 'masterAlertBusy' App.tsx
          grep -q 'Linking.openSettings' App.tsx
          grep -q 'accessibilityRole="switch"' App.tsx
          grep -q 'loadPrayerTimes({ forceLocation: true })' App.tsx
          grep -q 'scheduleIosTestAdhan' App.tsx
          grep -q 'https://api.aladhan.com/v1/calendar/' src/prayerData.ts
          grep -q 'Location.Accuracy.High' src/prayerData.ts
          grep -q 'source: "local_calculation"' src/prayerData.ts
          grep -q 'hassoun_fajr_athan.wav' src/notifications.ts
          grep -q 'hassoun_athan.wav' src/notifications.ts
          grep -q 'shouldPlaySound: true' src/notifications.ts
          grep -q 'hassoun_fajr_athan.wav' app.config.ts
          grep -q 'hassoun_athan.wav' app.config.ts
          grep -q 'createAudioPlaylist' modules/quran-audio/index.ts
          grep -q 'setAudioModeAsync' modules/quran-audio/index.ts
          grep -q 'playsInSilentMode: true' modules/quran-audio/index.ts
          grep -q 'shouldPlayInBackground: true' modules/quran-audio/index.ts
          if grep -q 'requireOptionalNativeModule' modules/quran-audio/index.ts; then
            echo 'ERROR: direct iOS Quran audio route is not active'
            exit 1
          fi
          grep -q 'expo-audio' package.json
          if grep -q '^    "expo-audio",' app.config.ts; then
            echo 'ERROR: expo-audio config plugin must remain disabled on proven iOS path'
            exit 1
          fi
          grep -q '6804563934' eas.json

      - name: Type-check patched iOS source
        working-directory: ios
        run: npm run typecheck

      - name: Validate Expo iOS bundle
        working-directory: ios
        run: |
          set -euo pipefail
          npx expo config --type public > /tmp/hassoun-ios-config.json
          grep -q 'hassoun_fajr_athan.wav' /tmp/hassoun-ios-config.json
          grep -q 'hassoun_athan.wav' /tmp/hassoun-ios-config.json
          npx expo export --platform ios --output-dir /tmp/hassoun-ios-export
          test -d /tmp/hassoun-ios-export

      - name: Validate iOS native generation before EAS
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf ios
          npx expo prebuild --platform ios --clean --no-install
          test -f ios/Podfile
          find ios -type f \( -name 'hassoun_fajr_athan.wav' -o -name 'hassoun_athan.wav' \) -print | tee /tmp/ios-athan-assets.txt
          grep -q 'hassoun_fajr_athan.wav' /tmp/ios-athan-assets.txt
          grep -q 'hassoun_athan.wav' /tmp/ios-athan-assets.txt
          rm -rf ios

      - name: Build signed iOS 1.0.36 and submit to TestFlight
        working-directory: ios
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit-with-profile production \
            --non-interactive \
            --message "Hassoun iOS v1.0.36 build 2026092401 global GPS + Lebanon location + iOS Athan sound" \
            --wait
