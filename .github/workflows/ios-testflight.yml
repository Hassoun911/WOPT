name: Build and Submit Hassoun iOS v1.0.2 to TestFlight

on:
  push:
    paths:
      - ".github/ios-testflight-trigger.txt"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-ios-testflight-v102
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APP_VERSION: "1.0.2"
      IOS_BUILD_NUMBER: "16"
      NODE_ENV: production

    steps:
      - name: Checkout latest accepted Hassoun mobile source
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.12-messaging-from-v1.0.11-good
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --include=dev --no-audit --no-fund

      - name: Apply all cross-platform accepted v1.0.12 fixes
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-v110-location-fix.mjs
          node scripts/apply-v111-city-highlight-fix.mjs
          node scripts/apply-v112-messaging-fix.mjs
          node scripts/apply-v112-next-prayer-layout-fix.mjs
          node scripts/apply-v112-ticker-position-fix.mjs
          node scripts/apply-v112-v60-reader-adhan-fixes.mjs
          node scripts/apply-v112-v61-exclusive-quran-browse.mjs

      - name: Set iOS version and build number
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app.config.ts')
          s = p.read_text()
          version = os.environ['EXPO_APP_VERSION']
          build = os.environ['IOS_BUILD_NUMBER']
          s = re.sub(r'version:\s*"[^"]+"', f'version: "{version}"', s, count=1)
          s = re.sub(r'buildNumber:\s*"[^"]+"', f'buildNumber: "{build}"', s, count=1)
          p.write_text(s)
          PY

      - name: Validate latest iOS feature set
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.2"' mobile/app.config.ts
          grep -q 'buildNumber: "16"' mobile/app.config.ts
          grep -q 'UIBackgroundModes: \["remote-notification", "audio"\]' mobile/app.config.ts
          grep -q '"platforms": \["android", "ios"\]' mobile/modules/quran-audio/expo-module.config.json
          test -s mobile/modules/quran-audio/ios/QuranAudioModule.swift
          test -s mobile/modules/quran-audio/ios/QuranAudio.podspec
          grep -q 'SystemMessageTicker' mobile/AppWithEmail.tsx
          grep -q 'wordrace' mobile/src/MultiplayerGames.tsx
          grep -q 'wordpuzzle' mobile/src/MultiplayerGames.tsx
          grep -q 'Insan • Haiwan • Shiee' mobile/src/QuizGamesHub.tsx
          grep -q 'Every game has a finish line' mobile/src/QuizGamesHub.tsx
          grep -q 'appearance.browseMode !== "vertical"' mobile/src/quran/QuranV3.tsx
          grep -q 'if (appearance.browseMode === "vertical") handleVerticalTouchStart' mobile/src/quran/QuranV3.tsx
          cd mobile
          npx tsc --noEmit

      - name: Queue production iOS build and TestFlight submit
        id: eas
        working-directory: mobile
        shell: bash
        run: |
          set +e
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets." | tee /tmp/eas-ios.log
            EXIT_CODE=86
          else
            npx eas-cli@latest build \
              --platform ios \
              --profile production \
              --auto-submit \
              --non-interactive \
              --no-wait \
              --message "Hassoun iOS v1.0.2 build 16 - Android/web feature parity" \
              2>&1 | tee /tmp/eas-ios.log
            EXIT_CODE=${PIPESTATUS[0]}
          fi
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show queue result
        if: always()
        shell: bash
        run: |
          echo "iOS marketing version: ${EXPO_APP_VERSION}"
          echo "Requested build number: ${IOS_BUILD_NUMBER}"
          echo "EAS exit code: ${{ steps.eas.outputs.exit_code }}"
          tail -n 120 /tmp/eas-ios.log 2>/dev/null || true

      - name: Fail if EAS queue failed
        if: steps.eas.outputs.exit_code != '0'
        run: |
          echo "EAS queue failed with code ${{ steps.eas.outputs.exit_code }}"
          exit 1
