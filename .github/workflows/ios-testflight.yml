name: Build and Submit Hassoun iOS v1.0.2 Android v62 Parity

on:
  push:
    paths:
      - ".github/ios-testflight-trigger.txt"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-ios-testflight-v102-parity
  cancel-in-progress: true

jobs:
  build-ios-testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      EXPO_PUBLIC_PUSH_API_URL: ${{ vars.EXPO_PUBLIC_PUSH_API_URL || 'https://wopt-prayer-push.wopt-windsor.workers.dev' }}
      ANDROID_FEATURE_REF: release/v1.0.12-messaging-from-v1.0.11-good
      IOS_APP_VERSION: "1.0.2"
      IOS_BUILD_NUMBER: "20260830"
      NODE_ENV: production

    steps:
      - name: Checkout dedicated iOS branch
        uses: actions/checkout@v4
        with:
          ref: release/ios-current
          fetch-depth: 0

      - name: Prepare Android v62 shared source plus iOS-only overlay
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${ANDROID_FEATURE_REF}:refs/remotes/origin/${ANDROID_FEATURE_REF}" --force
          git fetch origin main --force

          mkdir -p /tmp/hassoun-ios-overlay/modules/quran-audio/ios
          cp ios/app.config.ts /tmp/hassoun-ios-overlay/app.config.ts
          cp ios/eas.json /tmp/hassoun-ios-overlay/eas.json
          cp ios/modules/quran-audio/index.ts /tmp/hassoun-ios-overlay/modules/quran-audio/index.ts
          cp ios/modules/quran-audio/index.ios.ts /tmp/hassoun-ios-overlay/modules/quran-audio/index.ios.ts
          cp ios/modules/quran-audio/expo-module.config.json /tmp/hassoun-ios-overlay/modules/quran-audio/expo-module.config.json
          cp ios/modules/quran-audio/ios/QuranAudioIOSModule.swift /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudioIOSModule.swift
          cp ios/modules/quran-audio/ios/QuranAudioModule.swift /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudioModule.swift
          cp ios/modules/quran-audio/ios/QuranAudio.podspec /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudio.podspec

          rm -rf /tmp/hassoun-android-mobile
          mkdir -p /tmp/hassoun-android-mobile
          git archive "origin/${ANDROID_FEATURE_REF}:mobile" | tar -x -C /tmp/hassoun-android-mobile

          find ios -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/hassoun-android-mobile/. ios/

          cp /tmp/hassoun-ios-overlay/app.config.ts ios/app.config.ts
          cp /tmp/hassoun-ios-overlay/eas.json ios/eas.json
          mkdir -p ios/modules/quran-audio/ios
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/index.ts ios/modules/quran-audio/index.ts
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/index.ios.ts ios/modules/quran-audio/index.ios.ts
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/expo-module.config.json ios/modules/quran-audio/expo-module.config.json
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudioIOSModule.swift ios/modules/quran-audio/ios/QuranAudioIOSModule.swift
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudioModule.swift ios/modules/quran-audio/ios/QuranAudioModule.swift
          cp /tmp/hassoun-ios-overlay/modules/quran-audio/ios/QuranAudio.podspec ios/modules/quran-audio/ios/QuranAudio.podspec

          git show "origin/${ANDROID_FEATURE_REF}:mobile/src/MultiplayerGames.tsx" > ios/src/MultiplayerGames.tsx
          git show "origin/${ANDROID_FEATURE_REF}:mobile/src/QuizGamesHub.tsx" > ios/src/QuizGamesHub.tsx
          git show "origin/main:mobile/src/SystemMessageTicker.tsx" > ios/src/SystemMessageTicker.tsx

      - name: Apply accepted Android v62 shared fixes to iOS source
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            apply-v110-location-fix.mjs \
            apply-v111-city-highlight-fix.mjs \
            apply-v112-messaging-fix.mjs \
            apply-v112-next-prayer-layout-fix.mjs \
            apply-v112-ticker-position-fix.mjs \
            apply-v112-v61-exclusive-quran-browse.mjs
          do
            node "scripts/$script"
          done

      - name: Restore proven iOS config and set TestFlight version
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app.config.ts')
          s = p.read_text()
          s = re.sub(r'version:\s*"[^"]+"', f'version: "{os.environ["IOS_APP_VERSION"]}"', s, count=1)
          s = re.sub(r'buildNumber:\s*"[^"]+"', f'buildNumber: "{os.environ["IOS_BUILD_NUMBER"]}"', s, count=1)
          s = s.replace('    "expo-audio",\n', '')
          p.write_text(s)
          PY

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Verify Expo credentials
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npx --yes eas-cli@latest whoami

      - name: Add proven Expo Audio dependency for iOS
        working-directory: ios
        run: npm install expo-audio@~57.0.3 --save --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        working-directory: ios
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify latest layout, games, bookmarks and push features
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.2"' app.config.ts
          grep -q 'buildNumber: "20260830"' app.config.ts
          grep -q 'ITSAppUsesNonExemptEncryption: false' app.config.ts
          grep -q 'ca.wopt.windsorprayertimes' app.config.ts
          grep -q 'HomePrayerPanel' App.tsx
          grep -q 'QiblaDirectionScreen' App.tsx
          grep -q 'SystemMessageTicker' AppWithEmail.tsx
          grep -q 'registerDeviceForServerPush' AppWithEmail.tsx
          grep -q 'wordrace' src/MultiplayerGames.tsx
          grep -q 'wordpuzzle' src/MultiplayerGames.tsx
          grep -q 'Every game has a finish line' src/QuizGamesHub.tsx
          grep -q 'bookmarks' src/quran/QuranV3.tsx
          grep -q 'pages' src/quran/QuranV3.tsx
          grep -q 'createAudioPlaylist' modules/quran-audio/index.ts
          grep -q 'setAudioModeAsync' modules/quran-audio/index.ts
          grep -q 'playsInSilentMode: true' modules/quran-audio/index.ts
          grep -q 'shouldPlayInBackground: true' modules/quran-audio/index.ts
          if grep -q 'requireOptionalNativeModule' modules/quran-audio/index.ts; then
            echo 'ERROR: iOS Quran audio route regressed to optional native module'
            exit 1
          fi
          grep -q 'expo-audio' package.json
          if grep -q '^    "expo-audio",' app.config.ts; then
            echo 'ERROR: expo-audio config plugin must remain disabled for proven iOS build path'
            exit 1
          fi
          grep -q '6804563934' eas.json

      - name: Validate Expo iOS bundle
        working-directory: ios
        run: |
          set -euo pipefail
          npx expo config --type public > /tmp/hassoun-ios-config.json
          npx expo export --platform ios --output-dir /tmp/hassoun-ios-export
          test -d /tmp/hassoun-ios-export

      - name: Validate iOS native generation before EAS
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf ios
          npx expo prebuild --platform ios --clean --no-install
          test -f ios/Podfile
          rm -rf ios

      - name: Build signed iOS 1.0.2 and submit to TestFlight
        working-directory: ios
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform ios \
            --profile production \
            --auto-submit-with-profile production \
            --non-interactive \
            --message "Hassoun iOS v1.0.2 Android v62 layout/features parity" \
            --wait
