name: Build and Submit Hassoun iOS v1.0.2 to TestFlight

on:
  push:
    paths:
      - ".github/ios-testflight-trigger.txt"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hassoun-ios-testflight-v102
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APP_VERSION: "1.0.2"
      IOS_BUILD_NUMBER: "20260829"
      NODE_ENV: production

    steps:
      - name: Checkout dedicated iOS branch
        uses: actions/checkout@v4
        with:
          ref: release/ios-current
          fetch-depth: 0

      - name: Fetch latest accepted shared feature branch
        run: git fetch origin release/v1.0.12-messaging-from-v1.0.11-good

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: Install iOS app dependencies
        working-directory: ios
        run: npm ci --include=dev --no-audit --no-fund

      - name: Import latest multiplayer games into iOS app
        shell: bash
        run: |
          set -euo pipefail
          git show origin/release/v1.0.12-messaging-from-v1.0.11-good:mobile/src/MultiplayerGames.tsx > ios/src/MultiplayerGames.tsx
          git show origin/release/v1.0.12-messaging-from-v1.0.11-good:mobile/src/QuizGamesHub.tsx > ios/src/QuizGamesHub.tsx

      - name: Apply latest accepted shared fixes to dedicated iOS source
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            apply-v110-location-fix.mjs \
            apply-v111-city-highlight-fix.mjs \
            apply-v112-messaging-fix.mjs \
            apply-v112-next-prayer-layout-fix.mjs \
            apply-v112-ticker-position-fix.mjs \
            apply-v112-v61-exclusive-quran-browse.mjs
          do
            git show origin/release/v1.0.12-messaging-from-v1.0.11-good:mobile/scripts/$script > /tmp/$script
            node /tmp/$script
          done

      - name: Set iOS marketing version and build
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('app.config.ts')
          s=p.read_text()
          s=re.sub(r'version:\s*"[^"]+"', f'version: "{os.environ["EXPO_APP_VERSION"]}"', s, count=1)
          s=re.sub(r'buildNumber:\s*"[^"]+"', f'buildNumber: "{os.environ["IOS_BUILD_NUMBER"]}"', s, count=1)
          p.write_text(s)
          PY

      - name: Validate dedicated iOS app and latest features
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.2"' ios/app.config.ts
          grep -q 'buildNumber: "20260829"' ios/app.config.ts
          grep -q 'ITSAppUsesNonExemptEncryption: false' ios/app.config.ts
          grep -q 'UIBackgroundModes: \["remote-notification", "audio"\]' ios/app.config.ts
          test -s ios/modules/quran-audio/ios/QuranAudioModule.swift
          test -s ios/modules/quran-audio/ios/QuranAudio.podspec
          grep -q '"platforms": \["android", "ios"\]' ios/modules/quran-audio/expo-module.config.json
          grep -q 'wordrace' ios/src/MultiplayerGames.tsx
          grep -q 'wordpuzzle' ios/src/MultiplayerGames.tsx
          grep -q 'Insan • Haiwan • Shiee' ios/src/QuizGamesHub.tsx
          grep -q 'Every game has a finish line' ios/src/QuizGamesHub.tsx
          grep -q 'appearance.browseMode !== "vertical"' ios/src/quran/QuranV3.tsx
          cd ios
          npm run typecheck

      - name: Save synchronized iOS source back to iOS branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          git commit -m "Sync latest Hassoun features into dedicated iOS app" || true
          git push origin HEAD:release/ios-current

      - name: Queue production iOS build and TestFlight submit
        id: eas
        working-directory: ios
        shell: bash
        run: |
          set +e
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN is not configured in GitHub Actions secrets." | tee /tmp/eas-ios.log
            EXIT_CODE=86
          else
            npx eas-cli@latest build \
              --platform ios \
              --profile production \
              --auto-submit \
              --non-interactive \
              --no-wait \
              --message "Hassoun iOS v1.0.2 - latest features from dedicated ios folder" \
              2>&1 | tee /tmp/eas-ios.log
            EXIT_CODE=${PIPESTATUS[0]}
          fi
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show queue result
        if: always()
        shell: bash
        run: |
          echo "iOS version: ${EXPO_APP_VERSION}"
          echo "iOS build: ${IOS_BUILD_NUMBER}"
          echo "EAS exit code: ${{ steps.eas.outputs.exit_code }}"
          tail -n 120 /tmp/eas-ios.log 2>/dev/null || true

      - name: Fail if EAS queue failed
        if: steps.eas.outputs.exit_code != '0'
        run: exit 1
