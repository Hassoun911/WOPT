name: Validate Complete Hassoun Admin Control Implementation

on:
  push:
    branches:
      - main
    paths:
      - "push-server/**"
      - "admin-crm/**"
      - ".github/workflows/finalize-mobile-email-layout-20260821.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-admin-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker and Admin CRM
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            push-server/package-lock.json
            admin-crm/package-lock.json

      - name: Install Worker dependencies
        working-directory: push-server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck Worker
        working-directory: push-server
        run: npm run typecheck

      - name: Test Worker
        working-directory: push-server
        run: npm test

      - name: Install Admin CRM dependencies
        working-directory: admin-crm
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Admin CRM
        working-directory: admin-crm
        run: npm run build

  deploy-worker:
    name: Apply D1 migrations and deploy Worker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Install Worker dependencies
        working-directory: push-server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply production D1 migrations
        working-directory: push-server
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote

      - name: Deploy production Worker
        working-directory: push-server
        run: npx wrangler deploy

      - name: Smoke test production Worker
        run: |
          sleep 8
          curl --fail --show-error --silent --retry 4 --retry-delay 3 https://wopt-prayer-push.wopt-windsor.workers.dev/health
