name: Apply compact vertical widget v0.6.5

on:
  push:
    paths:
      - ".github/widget-v065-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact vertical widget repair
        run: python .github/scripts/fix-widget-vertical-v065.py
      - name: Commit repaired widget source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile
          git commit -m "Fix clipped tall widget layout" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Trigger full APK validation
        run: |
          printf 'trigger=%s\nreason=compact-vertical-widget-v065\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/v063-trigger.txt
          git add .github/v063-trigger.txt
          git commit -m "Build APK with compact tall widget"
          git pull --rebase origin main
          git push origin HEAD:main
