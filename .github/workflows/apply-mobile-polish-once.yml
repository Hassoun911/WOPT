name: Apply mobile visual polish once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message != 'Polish mobile layout and fix cramped sections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Polish mobile UI
        shell: python
        run: |
          from pathlib import Path

          p = Path('mobile/App.tsx')
          s = p.read_text()
          replacements = {
            '"Saved official schedule"': '"Saved local schedule"',
            'content: { padding: 18, paddingBottom: 28 }': 'content: { paddingHorizontal: 18, paddingTop: 14, paddingBottom: 34 }',
            'header: { flexDirection: "row", alignItems: "center", gap: 11, marginBottom: 16 }': 'header: { flexDirection: "row", alignItems: "center", gap: 10, marginBottom: 14 }',
            'dateHero: { minHeight: 130,': 'dateHero: { minHeight: 116,',
            'heroLogoShell: { width: 112, height: 96,': 'heroLogoShell: { width: 90, height: 84,',
            'heroLogo: { width: 96, height: 96 }': 'heroLogo: { width: 82, height: 82 }',
            'eventCountdownText: { color: "#6f766e", fontSize: 8.5, lineHeight: 13, marginTop: 3 }': 'eventCountdownText: { color: "#66746e", fontSize: 11, lineHeight: 16, marginTop: 5 }',
            'eventCountdownEyebrow: { color: "#9d782d", fontSize: 7,': 'eventCountdownEyebrow: { color: "#9d782d", fontSize: 9,',
            'sectionHint: { color: "#7d8984", fontSize: 8, marginTop: 3, maxWidth: 260 }': 'sectionHint: { color: "#7d8984", fontSize: 10.5, lineHeight: 15, marginTop: 4, maxWidth: 255 }',
            'audioPillText: { color: "#0b654f", fontSize: 5.8,': 'audioPillText: { color: "#0b654f", fontSize: 8,',
            'prayerRow: { minHeight: 67,': 'prayerRow: { minHeight: 74,',
            'prayerName: { color: "#173f35", fontSize: 14,': 'prayerName: { color: "#173f35", fontSize: 15,',
            'prayerOtherName: { color: "#8a9691", fontSize: 11,': 'prayerOtherName: { color: "#8a9691", fontSize: 11.5,',
            'quizDescription: { color: "#78837e", fontSize: 10, lineHeight: 14, marginTop: 2 }': 'quizDescription: { color: "#78837e", fontSize: 11, lineHeight: 16, marginTop: 4 }',
            'smartText: { color: "#89938f", fontSize: 10, marginTop: 2 }': 'smartText: { color: "#7f8c87", fontSize: 11, lineHeight: 15, marginTop: 3 }',
            'eventsEntryText: { color: "#74817c", fontSize: 9, marginTop: 3 }': 'eventsEntryText: { color: "#74817c", fontSize: 10.5, lineHeight: 15, marginTop: 4 }',
            'footer: { color: "#8a928e", fontSize: 9,': 'footer: { color: "#8a928e", fontSize: 10, lineHeight: 15,',
            'alertMasterEyebrow: { color: "#9b7a39", fontSize: 7,': 'alertMasterEyebrow: { color: "#9b7a39", fontSize: 9,',
            'alertPreferenceEyebrow: { color: "#9b7a39", fontSize: 7,': 'alertPreferenceEyebrow: { color: "#9b7a39", fontSize: 9,',
            'alertPreferenceText: { color: "#748079", fontSize: 9, lineHeight: 14, marginTop: 4 }': 'alertPreferenceText: { color: "#6f7e78", fontSize: 11, lineHeight: 16, marginTop: 5 }',
            'settingText: { color: "#7c8984", fontSize: 10, lineHeight: 15, marginTop: 3 }': 'settingText: { color: "#74817c", fontSize: 11, lineHeight: 16, marginTop: 4 }',
            'emailCard: { flexDirection: "row", alignItems: "center", gap: 12, backgroundColor: "#f0ebe1",': 'emailCard: { flexDirection: "row", alignItems: "center", gap: 12, backgroundColor: "#fff",',
            'testRow: { flexDirection: "row", gap: 9, marginTop: 13 }': 'testRow: { gap: 9, marginTop: 13 }',
            'testButton: { flex: 1, minHeight: 85,': 'testButton: { minHeight: 70,',
            'testButtonTitle: { color: "#164b3e", fontSize: 11,': 'testButtonTitle: { color: "#164b3e", fontSize: 12,',
            'pageTitle: { color: "#173f35", fontSize: 29, lineHeight: 34,': 'pageTitle: { color: "#173f35", fontSize: 27, lineHeight: 32,',
            'pageSubtitle: { color: "#75827d", fontSize: 13, lineHeight: 19,': 'pageSubtitle: { color: "#6f7f79", fontSize: 13, lineHeight: 20,',
            'bottomNav: { minHeight: 68,': 'bottomNav: { minHeight: 72,',
            'navLabel: { color: "#7f8a85", fontSize: 9,': 'navLabel: { color: "#7f8a85", fontSize: 10,',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s)

          h = Path('mobile/src/SettingsHub.tsx')
          x = h.read_text()
          replacements = {
            'const PUBLIC_BASE = "https://hassoun911.github.io/WOPT";': 'const PUBLIC_BASE = "https://hassoun.app";',
            'content: { padding: 18, paddingBottom: 42 }': 'content: { paddingHorizontal: 18, paddingTop: 16, paddingBottom: 48 }',
            'title: { color: "#173f35", fontSize: 29,': 'title: { color: "#173f35", fontSize: 27,',
            'subtitle: { color: "#75827d", fontSize: 12, lineHeight: 18,': 'subtitle: { color: "#6f7f79", fontSize: 13, lineHeight: 20,',
            'sectionLabel: { color: "#9a7c42", fontSize: 9,': 'sectionLabel: { color: "#9a7c42", fontSize: 10,',
            'row: { minHeight: 72,': 'row: { minHeight: 78,',
            'rowTitle: { color: "#173f35", fontSize: 13,': 'rowTitle: { color: "#173f35", fontSize: 14,',
            'rowText: { color: "#83908b", fontSize: 9, lineHeight: 13, marginTop: 3 }': 'rowText: { color: "#798782", fontSize: 11, lineHeight: 16, marginTop: 4 }',
            'layoutChoice: { width: "48.5%", minHeight: 110,': 'layoutChoice: { width: "48.5%", minHeight: 124,',
            'layoutTitle: { color: "#173f35", fontSize: 10,': 'layoutTitle: { color: "#173f35", fontSize: 12,',
            'layoutNote: { color: "#8a948f", fontSize: 7, lineHeight: 10,': 'layoutNote: { color: "#7d8a85", fontSize: 10, lineHeight: 14,',
            'previewTiny: { fontSize: 7, fontWeight: "800" }': 'previewTiny: { fontSize: 9, fontWeight: "800" }',
            'previewCountdownLabel: { fontSize: 5.5,': 'previewCountdownLabel: { fontSize: 8,',
            'previewMeta: { fontSize: 8,': 'previewMeta: { fontSize: 10,',
            'previewPrayerChip: { flex: 1, borderWidth: 1, borderRadius: 9, paddingVertical: 6, paddingHorizontal: 4, textAlign: "center", fontSize: 7,': 'previewPrayerChip: { flex: 1, borderWidth: 1, borderRadius: 9, paddingVertical: 7, paddingHorizontal: 4, textAlign: "center", fontSize: 9,',
            'previewHint: { color: "#7e8a85", fontSize: 9, lineHeight: 14,': 'previewHint: { color: "#74817c", fontSize: 11, lineHeight: 16,',
            'lockPreviewSub: { color: "#fff", fontSize: 6,': 'lockPreviewSub: { color: "#fff", fontSize: 8,',
            'lockPrayerText: { flex: 1, color: "#fff", borderWidth: 1, borderColor: "#55FFFFFF", borderRadius: 7, paddingVertical: 5, textAlign: "center", fontSize: 5.5,': 'lockPrayerText: { flex: 1, color: "#fff", borderWidth: 1, borderColor: "#55FFFFFF", borderRadius: 7, paddingVertical: 6, textAlign: "center", fontSize: 8,',
            'optionChipText: { color: "#53645e", fontSize: 8.5,': 'optionChipText: { color: "#53645e", fontSize: 10.5,',
            'legalText: { color: "#65736e", fontSize: 11, lineHeight: 18 }': 'legalText: { color: "#65736e", fontSize: 12, lineHeight: 19 }',
          }
          for old, new in replacements.items():
              if old in x:
                  x = x.replace(old, new)
          h.write_text(x)
      - name: Commit visual polish
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- mobile/App.tsx mobile/src/SettingsHub.tsx; then
            echo "No changes to commit."
            exit 0
          fi
          git add mobile/App.tsx mobile/src/SettingsHub.tsx
          git commit -m "Polish mobile layout and fix cramped sections"
          git push origin HEAD:work/hassoun-1.0-store-admin
