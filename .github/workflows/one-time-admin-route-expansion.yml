name: One-time Admin CRM route expansion

on:
  push:
    branches:
      - work/store-crm-2026-08-19
    paths:
      - ".github/workflows/one-time-admin-route-expansion.yml"
      - ".github/scripts/one-time-admin-route-expansion.py"

permissions:
  contents: write

concurrency:
  group: hassoun-one-time-admin-route-expansion
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-crm-2026-08-19
          fetch-depth: 0
      - run: python3 .github/scripts/one-time-admin-route-expansion.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire administrator and game moderation CRM routes"
          git push origin HEAD:work/store-crm-2026-08-19
