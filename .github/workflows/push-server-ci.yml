name: Push server validation

on:
  push:
    branches: [main]
    paths:
      - "push-server/**"
      - ".github/workflows/push-server-ci.yml"
  pull_request:
    paths:
      - "push-server/**"
      - ".github/workflows/push-server-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
