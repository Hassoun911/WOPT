name: Fix Admin CRM Users Direct

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-crm-users-direct-20260825.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply CRM repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/fix_admin_crm_users_direct.py > /tmp/fix_admin_crm_users_direct.py
          python3 /tmp/fix_admin_crm_users_direct.py
          git diff --check

      - name: Typecheck push server
        working-directory: push-server
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Build admin CRM
        working-directory: admin-crm
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Commit and push CRM repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-crm push-server
          git commit -m "Fix CRM navigation and admin subscriber controls"
          git push --force-with-lease=refs/heads/work/hassoun-1.0-store-admin:687fffc65b34ed54a46255bd59edda679a3df363 origin HEAD:refs/heads/work/hassoun-1.0-store-admin
