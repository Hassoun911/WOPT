name: Restore Stable Hassoun Widgets v0.6.14

on:
  push:
    paths:
      - '.github/workflows/restore-stable-widgets-v0614.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last working native widget path
        shell: bash
        run: |
          set -euo pipefail
          STABLE=6614e29e81a58b331b77ec29ce4c5a3891521d43
          FILES=(
            "mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt"
            "mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml"
            "mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml"
            "mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml"
            "mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml"
          )
          for file in "${FILES[@]}"; do
            git show "${STABLE}:${file}" > "${file}"
          done

      - name: Commit restored widgets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml
          if git diff --cached --quiet; then
            echo "Stable widget files are already restored."
          else
            git commit -m "Restore stable Android widget rendering path"
            git push origin HEAD:main
          fi
