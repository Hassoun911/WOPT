name: Submit latest Hassoun iOS build to TestFlight 2026-08-24

on:
  workflow_dispatch:
  push:
    branches:
      - release/ios-2026-08-23
    paths:
      - '.github/workflows/submit-ios-testflight-2026-08-24.yml'

permissions:
  contents: read

jobs:
  submit-latest-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ios-2026-08-23

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest whoami

      - name: Submit latest finished iOS build to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest submit \
            --platform ios \
            --profile production \
            --latest \
            --what-to-test 'Hassoun iOS v1.0.8 • 2026-08-24 — Test prayer countdown and warnings, Qur’an, Al-Hafiz, Ask the Sheikh, Islamic Events, alerts and navigation.' \
            --non-interactive \
            --wait
