name: Build v1.0.12 From v1.0.11 Golden

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-v1012-from-v111-golden.yml

permissions:
  contents: write

concurrency:
  group: hassoun-v1012-from-v111-golden
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: 69276452-f6f2-4d13-80e8-399ab32746ff
      EXPO_PUBLIC_PUSH_API_URL: https://wopt-prayer-push.wopt-windsor.workers.dev
      NODE_ENV: production

    steps:
      - name: Checkout known-good Android lineage
        uses: actions/checkout@v4
        with:
          ref: work/forward-from-latest-good
          fetch-depth: 0

      - name: Checkout current control files separately
        uses: actions/checkout@v4
        with:
          ref: main
          path: _control
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci --include=dev --no-audit --no-fund
          npm install --no-save --no-package-lock @typescript/typescript-linux-x64@7.0.2 expo-font

      - name: Reproduce known-good transforms
        working-directory: mobile
        run: |
          set -euo pipefail
          node scripts/apply-v106-clean-home.mjs
          node scripts/fix-memorize-entry.mjs
          node scripts/apply-alhafiz-motivation.mjs

      - name: Apply v1.0.11 prayer UI and messaging overlay
        run: |
          set -euo pipefail
          cp _control/mobile/src/HomePrayerPanel.tsx mobile/src/HomePrayerPanel.tsx
          cp _control/mobile/src/QiblaDirectionScreen.tsx mobile/src/QiblaDirectionScreen.tsx
          cp _control/scripts/apply-v1012-golden-messaging.py scripts/apply-v1012-golden-messaging.py
          python3 scripts/apply-v1012-golden-messaging.py

      - name: Prepare exact Hassoun bird Quran logo
        working-directory: mobile
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 -c "from PIL import Image,ImageFile; from pathlib import Path; ImageFile.LOAD_TRUNCATED_IMAGES=True; p=Path('assets/hassoun-logo.png'); assert p.exists() and p.stat().st_size>0; logo=Image.open(p).convert('RGBA'); logo.save(p,format='PNG',optimize=True); logo.resize((1024,1024),Image.Resampling.LANCZOS).save('assets/icon.png',format='PNG',optimize=True); splash=Image.new('RGBA',(1024,1024),(0,0,0,0)); art=logo.copy(); art.thumbnail((820,820),Image.Resampling.LANCZOS); splash.alpha_composite(art,((1024-art.width)//2,(1024-art.height)//2)); splash.save('assets/splash-logo.png',format='PNG',optimize=True)"
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp assets/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Verify golden features and messaging overlay
        working-directory: mobile
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.12"' app.config.ts
          grep -q 'versionCode: 53' app.config.ts
          grep -q 'SmartMemorize' src/quran/QuranV3.tsx
          grep -q 'AI MEMORIZATION COACH' src/quran/AlHafizClassroom.tsx
          grep -q 'HomePrayerPanel' App.tsx
          grep -q 'QiblaDirectionScreen' App.tsx
          grep -q 'ScrollingTicker' App.tsx
          grep -q 'textEn' src/ScrollingTicker.tsx
          grep -q 'expiresAt' src/ScrollingTicker.tsx
          grep -q 'Notifications.requestPermissionsAsync' AppWithEmail.tsx
          grep -q 'AppState.addEventListener' AppWithEmail.tsx
          npx tsc --noEmit

      - name: Generate Android project
        working-directory: mobile
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify and rename APK
        working-directory: mobile
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT=android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging-from-v1.0.11-good.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/(index\.android\.bundle|.*\.hbc)'
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.12-from-v1.0.11-golden
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging-from-v1.0.11-good.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging-from-v1.0.11-good.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish candidate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.12-messaging-from-v1.0.11-good.apk
          SUM=$APK.sha256
          TAG=v1.0.12-from-v1.0.11-golden
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" --target work/forward-from-latest-good --title "Hassoun v1.0.12 Messaging From v1.0.11 Golden" --notes "Candidate only. v1.0.11 remains the golden baseline until user confirms this build. Adds automatic server push registration and CRM scrolling system messages." --prerelease
          fi
