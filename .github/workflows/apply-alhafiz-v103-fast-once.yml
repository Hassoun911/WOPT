name: Apply Al-Hafiz v1.0.3 fast once

on:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths:
      - ".github/workflows/apply-alhafiz-v103-fast-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Apply integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          q=Path('mobile/src/quran/QuranV3.tsx'); s=q.read_text()
          s=s.replace('import SmartMemorize from "./SmartMemorize";', 'import AlHafizClassroom from "./AlHafizClassroom";', 1)
          s=s.replace('<SmartMemorize', '<AlHafizClassroom').replace('</SmartMemorize>', '</AlHafizClassroom>')
          q.write_text(s)

          p=Path('mobile/src/IslamicEventsPage.tsx'); s=p.read_text()
          s=s.replace('import { islamicDateLabelForEvent, islamicEventCountdown, islamicEventsForGregorianYear, islamicEventTimeline, type IslamicEventOccurrence } from "./islamicEvents";', 'import { hijriPartsForDateKey, islamicDateLabelForEvent, islamicEventCountdown, islamicEventsForGregorianYear, islamicEventTimeline, type IslamicEventOccurrence } from "./islamicEvents";', 1)
          if 'const hijriYear = hijriPartsForDateKey(todayKey).year;' not in s:
              s=s.replace('  const events = islamicEventsForGregorianYear(year);', '  const hijriYear = hijriPartsForDateKey(todayKey).year;\n  const events = [...islamicEventsForGregorianYear(year - 1), ...islamicEventsForGregorianYear(year), ...islamicEventsForGregorianYear(year + 1)]\n    .filter((event, index, all) => event.hijriYear === hijriYear && all.findIndex((item) => item.id === event.id && item.dateKey === event.dateKey) === index)\n    .sort((a, b) => a.dateKey.localeCompare(b.dateKey));', 1)
          s=s.replace('t(`${year} Islamic Events`, `المناسبات الإسلامية ${new Intl.NumberFormat("ar").format(year)}`)', 't(`${hijriYear} AH Islamic Events`, `المناسبات الإسلامية ${new Intl.NumberFormat("ar").format(hijriYear)} هـ`)')
          p.write_text(s)

          for path in ['mobile/package.json','mobile/package-lock.json']:
              f=Path(path); d=json.loads(f.read_text()); d['version']='1.0.3'
              if path.endswith('package-lock.json'): d['packages']['']['version']='1.0.3'
              f.write_text(json.dumps(d,indent=2)+'\n')
          f=Path('mobile/app.config.ts'); s=f.read_text(); s=re.sub(r'version: "1\.0\.\d+"','version: "1.0.3"',s,count=1); s=re.sub(r'versionCode: \d+','versionCode: 44',s,count=1); f.write_text(s)
          f=Path('.github/workflows/android-store-release.yml'); s=f.read_text(); s=s.replace('1.0.2','1.0.3').replace('android_version_code=43','android_version_code=44'); f.write_text(s)
          PY
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx mobile/src/quran/AlHafizClassroom.tsx mobile/src/IslamicEventsPage.tsx mobile/package.json mobile/package-lock.json mobile/app.config.ts .github/workflows/android-store-release.yml
          git commit -m "Integrate Al-Hafiz classroom and full Islamic Events v1.0.3" || true
          git pull --rebase --autostash origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
