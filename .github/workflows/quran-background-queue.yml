name: Integrate native Quran background queue

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/quran-background-queue.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply background queue patch
        run: python .github/scripts/quran-background-queue.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate mobile TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Commit native background queue
        run: |
          git config user.name "Hassoun911"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use native persistent Quran playback queue"
          git push origin main
