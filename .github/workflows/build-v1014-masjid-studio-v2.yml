name: Build Hassoun v1.0.14 Ultimate Masjid Display Studio v2

on:
  push:
    branches:
      - release/v1.0.14-masjid-tv-fixes
    paths:
      - 'mobile/scripts/apply-masjid-display-studio.mjs'
      - 'mobile/scripts/apply-masjid-display-studio-v2.mjs'
      - '.github/workflows/build-v1014-masjid-studio-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-v1014-masjid-studio-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Masjid Studio branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.14-masjid-tv-fixes
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install expo-image-picker expo-file-system expo-battery expo-brightness expo-document-picker expo-screen-orientation expo-video --npm
      - name: Apply complete Masjid Display Studio v2
        run: |
          node scripts/apply-wall-shell-for-masjid.mjs
          node scripts/apply-masjid-tv.mjs
          node scripts/apply-masjid-remote.mjs
          node scripts/apply-masjid-typefix.mjs
          node scripts/apply-masjid-tv-fixes.mjs
          node scripts/apply-masjid-clock-click-branding.mjs
          node scripts/apply-masjid-display-studio-v2.mjs
      - name: Validate TypeScript and ultimate display features
        run: |
          npm run typecheck
          grep -q 'Masjid Display Studio' src/MasjidTvDisplay.tsx
          grep -q 'layout_cinematic' src/MasjidTvDisplay.tsx
          grep -q 'specialMode' src/MasjidTvDisplay.tsx
          grep -q 'showDonation' src/MasjidTvDisplay.tsx
          grep -q 'showPrayerCards' src/MasjidTvDisplay.tsx
          grep -q 'accentColor' src/MasjidTvDisplay.tsx
          grep -q 'SmartLandscape' src/MasjidTvDisplay.tsx
          grep -q 'masjidLogoUri' src/MasjidTvDisplay.tsx
          grep -q 'Mosque location not set' src/MasjidTvDisplay.tsx
          grep -q 'backgroundVideoUrl' src/MasjidTvDisplay.tsx
          grep -q 'Ultimate smart display widgets' src/WallRemoteController.tsx
          grep -q 'cinematic' src/WallRemoteController.tsx
          grep -q 'emergency' src/WallRemoteController.tsx
      - name: Restore verified Hassoun image assets
        run: |
          python3 -m pip install --quiet Pillow
          tr -d '\n\r ' < ../.github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-official.jpg
          echo 'a233f3a8e323499df9643a29280d5f53d2c18468414107b034863f6d82517e75  /tmp/hassoun-official.jpg' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open('/tmp/hassoun-official.jpg').convert('RGB')
          full = ImageOps.fit(source, (1024, 1024), method=Image.Resampling.LANCZOS).convert('RGBA')
          launcher = Image.new('RGBA', (1024, 1024), (7,43,37,255))
          safe = full.resize((720,720), Image.Resampling.LANCZOS)
          launcher.alpha_composite(safe, ((1024-720)//2,(1024-720)//2))
          for target in ['assets/hassoun-logo.png','assets/splash-logo.png','assets/splash-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True); full.save(target, 'PNG', optimize=True)
          for target in ['assets/icon.png','assets/adaptive-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True); launcher.save(target, 'PNG', optimize=True)
          widget = Path('modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png')
          widget.parent.mkdir(parents=True, exist_ok=True)
          full.resize((512,512), Image.Resampling.LANCZOS).save(widget, 'PNG', optimize=True)
          PY
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Enable Android TV launcher and flexible orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          tree = ET.parse(manifest)
          root = tree.getroot()
          def has_feature(name):
              return any(el.tag == 'uses-feature' and el.attrib.get(f'{{{android}}}name') == name for el in root)
          if not has_feature('android.software.leanback'):
              ET.SubElement(root, 'uses-feature', {f'{{{android}}}name':'android.software.leanback', f'{{{android}}}required':'false'})
          if not has_feature('android.hardware.touchscreen'):
              ET.SubElement(root, 'uses-feature', {f'{{{android}}}name':'android.hardware.touchscreen', f'{{{android}}}required':'false'})
          app = root.find('application')
          if app is None: raise SystemExit('application not found')
          app.set(f'{{{android}}}banner', '@drawable/hassoun_widget_logo')
          main = next((a for a in app.findall('activity') if a.attrib.get(f'{{{android}}}name', '').endswith('MainActivity')), None)
          if main is None: raise SystemExit('MainActivity not found')
          main.set(f'{{{android}}}screenOrientation', 'unspecified')
          if not any('android.intent.category.LEANBACK_LAUNCHER' in [x.attrib.get(f'{{{android}}}name') for x in filt.findall('category')] for filt in main.findall('intent-filter')):
              filt = ET.SubElement(main, 'intent-filter')
              ET.SubElement(filt, 'action', {f'{{{android}}}name':'android.intent.action.MAIN'})
              ET.SubElement(filt, 'category', {f'{{{android}}}name':'android.intent.category.LEANBACK_LAUNCHER'})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew clean assembleRelease --no-daemon --stacktrace
      - name: Prepare named APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.14-ultimate-masjid-display.apk
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.14-ultimate-masjid-display.apk | tee android/app/build/outputs/apk/release/Hassoun-v1.0.14-ultimate-masjid-display.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.14-ultimate-masjid-display
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.14-ultimate-masjid-display.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.14-ultimate-masjid-display.apk.sha256
          if-no-files-found: error
          retention-days: 30
