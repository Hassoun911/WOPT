name: Build Hassoun v1.0.8 known-good APK

on:
  push:
    branches:
      - build/v108-from-known-good
    paths:
      - '.github/workflows/build-v108-known-good-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-v108-known-good-apk
  cancel-in-progress: true

env:
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
  NODE_ENV: production

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout exact known-good v1.0.8 layout branch
        uses: actions/checkout@v4
        with:
          ref: build/v108-from-known-good
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify source and exact Hassoun logo
        run: |
          set -euo pipefail
          grep -q 'version: "1.0.8"' app.config.ts
          grep -q 'versionCode: 49' app.config.ts
          test -s assets/hassoun-logo.png
          test -s assets/icon.png
          grep -q 'Today’s Prayer Times' src/HomePrayerPanel.tsx
          grep -q 'PRAYER_KEYS.map' src/HomePrayerPanel.tsx
          grep -q 'QiblaDirectionScreen' App.tsx

      - name: Generate Android project
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify embedded JavaScript bundle and rename APK
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" > /tmp/hassoun-apk-files.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/hassoun-apk-files.txt
          OUT='android/app/build/outputs/apk/release/Hassoun-v1.0.8-new-prayer-layout.apk'
          cp "$APK" "$OUT"
          ls -lh "$OUT"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.8-new-prayer-layout
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.8-new-prayer-layout.apk
          if-no-files-found: error
          retention-days: 14
