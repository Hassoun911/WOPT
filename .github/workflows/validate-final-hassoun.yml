name: Validate finalized Hassoun branch

on:
  push:
    branches:
      - work/store-crm-2026-08-19
    paths:
      - ".github/workflows/validate-final-hassoun.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: 69276452-f6f2-4d13-80e8-399ab32746ff
      EXPO_PUBLIC_PUSH_API_URL: https://wopt-prayer-push.wopt-windsor.workers.dev
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/store-crm-2026-08-19
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate backend
        working-directory: push-server
        run: |
          npm ci --include=dev --no-audit --no-fund
          npx tsc --noEmit
          npm test
      - name: Validate Admin/PWA
        working-directory: pwa
        run: |
          npm ci --include=dev --no-audit --no-fund
          npx tsc --noEmit
          npm run build
      - name: Validate mobile TypeScript and iOS
        working-directory: mobile
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run quran:data
          npx tsc --noEmit
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
          test -f Hassoun.xcworkspace/contents.xcworkspacedata
          xcodebuild -workspace Hassoun.xcworkspace -scheme Hassoun -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Record validation outcome
        if: always()
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          cat > .github/hassoun-final-validation-status.txt <<EOF
          status=${JOB_STATUS}
          branch=work/store-crm-2026-08-19
          source_commit=$(git rev-parse HEAD)
          backend=validated_in_job
          admin_pwa=validated_in_job
          ios_workspace=Hassoun.xcworkspace
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "Hassoun Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/hassoun-final-validation-status.txt
          git commit -m "Record final Hassoun branch validation ${JOB_STATUS}" || true
          git push origin HEAD:work/store-crm-2026-08-19 || true
