name: Fix Islamic Events full Hijri year once

on:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths:
      - ".github/workflows/fix-islamic-events-full-hijri-year-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Show the complete current Hijri year timeline
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/src/IslamicEventsPage.tsx')
          s=p.read_text()

          s=s.replace(
            'import { islamicDateLabelForEvent, islamicEventCountdown, islamicEventsForGregorianYear, islamicEventTimeline, type IslamicEventOccurrence } from "./islamicEvents";',
            'import { daysBetweenDateKeys, hijriPartsForDateKey, islamicDateLabelForEvent, islamicEventCountdown, islamicEventsForGregorianYear, islamicEventTimeline, type IslamicEventOccurrence } from "./islamicEvents";'
          )

          old='''  const year = Number(todayKey.slice(0, 4));\n  const events = islamicEventsForGregorianYear(year);\n  const timeline = islamicEventTimeline(todayKey);\n  const next = timeline.next;\n  const days = timeline.daysUntilNext ?? 0;'''
          new='''  const gregorianYear = Number(todayKey.slice(0, 4));\n  const currentHijriYear = hijriPartsForDateKey(todayKey).year;\n  const allNearbyEvents = [\n    ...islamicEventsForGregorianYear(gregorianYear - 1),\n    ...islamicEventsForGregorianYear(gregorianYear),\n    ...islamicEventsForGregorianYear(gregorianYear + 1)\n  ].sort((a, b) => a.dateKey.localeCompare(b.dateKey));\n  const events = allNearbyEvents.filter((event) => event.hijriYear === currentHijriYear);\n  const upcomingEvents = events.filter((event) => event.dateKey >= todayKey);\n  const pastEvents = events.filter((event) => event.dateKey < todayKey).reverse();\n  const timeline = islamicEventTimeline(todayKey);\n  const next = upcomingEvents[0] ?? timeline.next;\n  const days = next ? daysBetweenDateKeys(todayKey, next.dateKey) : 0;'''
          if old not in s: raise SystemExit('data block anchor not found')
          s=s.replace(old,new,1)

          old_head='''      <View style={styles.sectionHead}>\n        <Text style={styles.sectionTitle}>{t(`${year} Islamic Events`, `المناسبات الإسلامية ${new Intl.NumberFormat("ar").format(year)}`)}</Text>\n        <Text style={styles.sectionMeta}>{events.length} {t("dates", "تواريخ")}</Text>\n      </View>\n\n      <View style={styles.list}>{events.map((event) => {'''
          new_head='''      <View style={styles.sectionHead}>\n        <Text style={styles.sectionTitle}>{t(`Remaining events • ${currentHijriYear} AH`, `المناسبات المتبقية • ${new Intl.NumberFormat("ar").format(currentHijriYear)} هـ`)}</Text>\n        <Text style={styles.sectionMeta}>{upcomingEvents.length} {t("remaining", "متبقية")}</Text>\n      </View>\n\n      <View style={styles.list}>{upcomingEvents.map((event) => {'''
          if old_head not in s: raise SystemExit('upcoming list anchor not found')
          s=s.replace(old_head,new_head,1)

          marker='''      })}</View>\n\n      <View style={styles.notice}>'''
          replacement='''      })}</View>\n\n      {pastEvents.length ? (\n        <>\n          <View style={styles.sectionHead}>\n            <Text style={styles.sectionTitle}>{t(`Earlier in ${currentHijriYear} AH`, `مناسبات سابقة في ${new Intl.NumberFormat("ar").format(currentHijriYear)} هـ`)}</Text>\n            <Text style={styles.sectionMeta}>{pastEvents.length} {t("past", "سابقة")}</Text>\n          </View>\n          <View style={styles.list}>{pastEvents.map((event) => {\n            const date = new Intl.DateTimeFormat(ar ? "ar-CA" : "en-CA", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" }).format(new Date(`${event.dateKey}T12:00:00Z`));\n            return (\n              <View key={`past-${event.id}-${event.dateKey}`} style={[styles.eventRow, styles.eventRowPast]}>\n                <View style={styles.eventIcon}><Text style={styles.eventEmoji}>{event.emoji}</Text></View>\n                <View style={styles.copy}>\n                  <View style={styles.eventTitleRow}><Text style={styles.eventTitle}>{event.name[locale]}</Text><Text style={styles.pastPill}>{t("PAST", "سابقة")}</Text></View>\n                  <Text style={styles.eventDate}>{date} • {islamicDateLabelForEvent(event, locale)}</Text>\n                  <Text style={styles.eventDescription}>{event.description[locale]}</Text>\n                  {event.note ? <Text style={styles.eventNote}>ⓘ {event.note[locale]}</Text> : null}\n                </View>\n              </View>\n            );\n          })}</View>\n        </>\n      ) : null}\n\n      <View style={styles.notice}>'''
          if marker not in s: raise SystemExit('past section insertion anchor not found')
          s=s.replace(marker,replacement,1)

          s=s.replace(
            '  nextPill: { color: "#fff", backgroundColor: "#0b654f", borderRadius: 99, overflow: "hidden", paddingHorizontal: 8, paddingVertical: 3, fontSize: 8, fontWeight: "900" },',
            '  nextPill: { color: "#fff", backgroundColor: "#0b654f", borderRadius: 99, overflow: "hidden", paddingHorizontal: 8, paddingVertical: 3, fontSize: 8, fontWeight: "900" },\n  pastPill: { color: "#725f3d", backgroundColor: "#eee7d8", borderRadius: 99, overflow: "hidden", paddingHorizontal: 8, paddingVertical: 3, fontSize: 8, fontWeight: "900" },'
          )
          p.write_text(s)
          PY

          cd mobile
          npm ci
          npm run typecheck
          cd ..
          git restore mobile/src/quran/quranData.generated.json mobile/src/quran/quranMeta.generated.json 2>/dev/null || true
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add mobile/src/IslamicEventsPage.tsx
          git commit -m "Show all remaining Islamic events in current Hijri year"
          git pull --rebase --autostash origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
