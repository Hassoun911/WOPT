name: Build Hassoun v1.0.13 tablet wall display

on:
  push:
    branches:
      - release/v1.0.13-tablet-wall-display
    paths:
      - 'mobile/src/TabletWallPrayerDisplay.tsx'
      - 'mobile/scripts/apply-tablet-wall-display.mjs'
      - 'mobile/app.config.ts'
      - '.github/logo-official/hassoun-official-256.jpg.b64'
      - '.github/workflows/build-v1013-tablet-wall-display.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-v1013-tablet-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout tablet wall display branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.13-tablet-wall-display

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install expo-image-picker@~57.0.14 --save --ignore-scripts --no-audit --no-fund

      - name: Apply portrait tablet wall display safely
        run: |
          node scripts/apply-tablet-wall-display.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/TabletWallPrayerDisplay.tsx')
          text = path.read_text()
          text = text.replace('import * as ImagePicker from "expo-image-picker";\n', '')
          text = text.replace(
              'const pickBackground = async () => { const result = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ["images"], allowsEditing: false, quality: 0.9 }); if (!result.canceled && result.assets[0]?.uri) updateSettings({ customBackgroundUri: result.assets[0].uri, backgroundPreset: "custom" }); };',
              'const pickBackground = async () => { try { const ImagePicker = await import("expo-image-picker"); const result = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ["images"], allowsEditing: false, quality: 0.9 }); if (!result.canceled && result.assets[0]?.uri) updateSettings({ customBackgroundUri: result.assets[0].uri, backgroundPreset: "custom" }); } catch (error) { console.warn("Wall background picker unavailable", error); } };'
          )
          text = text.replace('customBackgroundShade: { ...StyleSheet.absoluteFillObject, backgroundColor: "#FFFFFF22" }', 'customBackgroundShade: { position: "absolute", top: 0, right: 0, bottom: 0, left: 0, backgroundColor: "#FFFFFF22" }')
          path.write_text(text)
          PY

      - name: Apply official user-provided Hassoun logo everywhere
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcheck
          python3 -m pip install --quiet Pillow

          tr -d '\n\r ' < ../.github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-official.jpg
          echo 'a233f3a8e323499df9643a29280d5f53d2c18468414107b034863f6d82517e75  /tmp/hassoun-official.jpg' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Image.open('/tmp/hassoun-official.jpg').convert('RGB')
          source = ImageOps.fit(source, (1024, 1024), method=Image.Resampling.LANCZOS)
          full = source.convert('RGBA')
          full.save('/tmp/hassoun-full.png', format='PNG', optimize=True)

          # Android launchers mask icons into different shapes. Keep the complete
          # user-provided logo safely inside the mask on Samsung and other launchers.
          launcher = Image.new('RGBA', (1024, 1024), (7, 43, 37, 255))
          safe = full.resize((720, 720), Image.Resampling.LANCZOS)
          launcher.alpha_composite(safe, ((1024 - 720) // 2, (1024 - 720) // 2))
          launcher.save('/tmp/hassoun-launcher.png', format='PNG', optimize=True)

          # Full official artwork everywhere inside Hassoun.
          for target in ['assets/hassoun-logo.png', 'assets/splash-logo.png', 'assets/splash-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              full.save(target, format='PNG', optimize=True)

          # Same official artwork with launcher-only safe padding.
          for target in ['assets/icon.png', 'assets/adaptive-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              launcher.save(target, format='PNG', optimize=True)

          # Widget uses the exact full logo, not the launcher-padded copy.
          widget = Path('modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png')
          widget.parent.mkdir(parents=True, exist_ok=True)
          full.resize((512, 512), Image.Resampling.LANCZOS).save(widget, format='PNG', optimize=True)

          # Keep the web/PWA brand source synchronized too.
          web = Path('../pwa/public/hassoun-logo.png')
          web.parent.mkdir(parents=True, exist_ok=True)
          full.save(web, format='PNG', optimize=True)
          PY

          # React Native brand images must contain the full artwork.
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.tsx'):
              text = path.read_text(errors='ignore')
              if 'hassoun-logo.png' not in text:
                  continue
              text = text.replace('source={require("./assets/hassoun-logo.png")} style={styles.headerLogo}', 'source={require("./assets/hassoun-logo.png")} resizeMode="contain" style={styles.headerLogo}')
              path.write_text(text)
          PY

          # Widget ImageViews must center/contain, never centerCrop.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          for path in Path('modules/hassoun-widget/android/src/main/res/layout').glob('*.xml'):
              try:
                  tree = ET.parse(path)
              except ET.ParseError:
                  continue
              changed = False
              for el in tree.iter():
                  ident = el.attrib.get(f'{{{android}}}id', '')
                  src = el.attrib.get(f'{{{android}}}src', '')
                  if ident.endswith('/widget_logo') or src.endswith('/hassoun_widget_logo'):
                      el.set(f'{{{android}}}scaleType', 'centerInside')
                      el.set(f'{{{android}}}adjustViewBounds', 'true')
                      changed = True
              if changed:
                  tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

          pngcheck -q /tmp/hassoun-full.png
          pngcheck -q /tmp/hassoun-launcher.png
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/adaptive-icon.png
          pngcheck -q modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Validate phone-safe tablet and logo behavior
        run: |
          npm run typecheck
          grep -q 'viewportWidth >= 600' App.tsx
          grep -q 'viewportHeight > viewportWidth' App.tsx
          grep -q 'TabletWallPrayerDisplay' App.tsx
          grep -q 'locationLabel={wallLocationLabel}' App.tsx
          grep -q 'useKeepAwake("hassoun-tablet-wall-display")' src/TabletWallPrayerDisplay.tsx
          grep -q 'onLongPress={() => setEditorOpen(true)}' src/TabletWallPrayerDisplay.tsx
          grep -q 'Wall Display Designer' src/TabletWallPrayerDisplay.tsx
          grep -q 'await import("expo-image-picker")' src/TabletWallPrayerDisplay.tsx
          ! grep -q '^import \* as ImagePicker from "expo-image-picker"' src/TabletWallPrayerDisplay.tsx
          grep -q 'adaptive-icon.png' app.config.ts
          test -s assets/hassoun-logo.png
          test -s assets/icon.png
          test -s assets/adaptive-icon.png
          test -s assets/splash-icon.png
          test -s modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png
          test -s ../pwa/public/hassoun-logo.png

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Prepare named APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.13-official-logo-crash-fixed.apk
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.13-official-logo-crash-fixed.apk | tee android/app/build/outputs/apk/release/Hassoun-v1.0.13-official-logo-crash-fixed.apk.sha256
          ls -lh android/app/build/outputs/apk/release/Hassoun-v1.0.13-official-logo-crash-fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.13-official-logo-crash-fixed
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-official-logo-crash-fixed.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-official-logo-crash-fixed.apk.sha256
          if-no-files-found: error
          retention-days: 30
