name: Build Hassoun v1.0.13 tablet wall display

on:
  push:
    branches:
      - release/v1.0.13-tablet-wall-display
    paths:
      - 'mobile/src/TabletWallPrayerDisplay.tsx'
      - 'mobile/scripts/apply-tablet-wall-display.mjs'
      - '.github/workflows/build-v1013-tablet-wall-display.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-v1013-tablet-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout tablet wall display branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.13-tablet-wall-display

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply portrait tablet wall display
        run: node scripts/apply-tablet-wall-display.mjs

      - name: Validate tablet-only behavior
        run: |
          npm run typecheck
          grep -q 'viewportWidth >= 600' App.tsx
          grep -q 'viewportHeight > viewportWidth' App.tsx
          grep -q 'TabletWallPrayerDisplay' App.tsx
          grep -q 'useKeepAwake("hassoun-tablet-wall-display")' src/TabletWallPrayerDisplay.tsx
          grep -q 'onTogglePrayer(prayer)' src/TabletWallPrayerDisplay.tsx
          grep -q 'onOpenQibla' src/TabletWallPrayerDisplay.tsx

      - name: Repair PNG assets before Android prebuild
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcheck
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          roots = [Path('assets'), Path('src')]
          repaired = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.png'):
                  try:
                      with Image.open(path) as image:
                          image.load()
                          image.convert('RGBA').save(path, format='PNG', optimize=True)
                  except Exception as exc:
                      raise SystemExit(f'Invalid PNG {path}: {exc}')
                  repaired.append(path)
          print(f'Re-encoded {len(repaired)} PNG assets before Android prebuild.')
          PY
          find assets src -type f -iname '*.png' -print0 | xargs -0 -r -n1 pngcheck -q

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare named APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.13-tablet-wall-display.apk
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.13-tablet-wall-display.apk | tee android/app/build/outputs/apk/release/Hassoun-v1.0.13-tablet-wall-display.apk.sha256
          ls -lh android/app/build/outputs/apk/release/Hassoun-v1.0.13-tablet-wall-display.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.13-tablet-wall-display
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-tablet-wall-display.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-tablet-wall-display.apk.sha256
          if-no-files-found: error
          retention-days: 30
