name: Build Hassoun v1.0.13 tablet wall display

on:
  push:
    branches:
      - release/v1.0.13-tablet-wall-display
    paths:
      - 'mobile/src/TabletWallPrayerDisplay.tsx'
      - 'mobile/scripts/apply-tablet-wall-display.mjs'
      - '.github/logo-exact/**'
      - '.github/workflows/build-v1013-tablet-wall-display.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-v1013-tablet-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout tablet wall display branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.13-tablet-wall-display

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install expo-image-picker@~57.0.14 --save --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'); if(!p.dependencies?.['expo-image-picker']) process.exit(1); console.log('expo-image-picker linked dependency', p.dependencies['expo-image-picker'])"

      - name: Apply portrait tablet wall display safely
        run: |
          node scripts/apply-tablet-wall-display.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/TabletWallPrayerDisplay.tsx')
          text = path.read_text()
          text = text.replace('import * as ImagePicker from "expo-image-picker";\n', '')
          text = text.replace(
              'const pickBackground = async () => { const result = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ["images"], allowsEditing: false, quality: 0.9 }); if (!result.canceled && result.assets[0]?.uri) updateSettings({ customBackgroundUri: result.assets[0].uri, backgroundPreset: "custom" }); };',
              'const pickBackground = async () => { try { const ImagePicker = await import("expo-image-picker"); const result = await ImagePicker.launchImageLibraryAsync({ mediaTypes: ["images"], allowsEditing: false, quality: 0.9 }); if (!result.canceled && result.assets[0]?.uri) updateSettings({ customBackgroundUri: result.assets[0].uri, backgroundPreset: "custom" }); } catch (error) { console.warn("Wall background picker unavailable", error); } };'
          )
          text = text.replace('customBackgroundShade: { ...StyleSheet.absoluteFillObject, backgroundColor: "#FFFFFF22" }', 'customBackgroundShade: { position: "absolute", top: 0, right: 0, bottom: 0, left: 0, backgroundColor: "#FFFFFF22" }')
          path.write_text(text)
          PY

      - name: Validate phone-safe and tablet-only behavior
        run: |
          npm run typecheck
          grep -q 'viewportWidth >= 600' App.tsx
          grep -q 'viewportHeight > viewportWidth' App.tsx
          grep -q 'TabletWallPrayerDisplay' App.tsx
          grep -q 'locationLabel={wallLocationLabel}' App.tsx
          grep -q 'useKeepAwake("hassoun-tablet-wall-display")' src/TabletWallPrayerDisplay.tsx
          grep -q 'onTogglePrayer(prayer)' src/TabletWallPrayerDisplay.tsx
          grep -q 'onLongPress={() => setEditorOpen(true)}' src/TabletWallPrayerDisplay.tsx
          grep -q 'Wall Display Designer' src/TabletWallPrayerDisplay.tsx
          grep -q 'await import("expo-image-picker")' src/TabletWallPrayerDisplay.tsx
          ! grep -q '^import \* as ImagePicker from "expo-image-picker"' src/TabletWallPrayerDisplay.tsx
          grep -q 'lockMinutes' src/TabletWallPrayerDisplay.tsx
          grep -q 'showBottomCards' src/TabletWallPrayerDisplay.tsx

      - name: Restore Hassoun icon and repair PNG assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcheck
          python3 -m pip install --quiet Pillow

          cat ../.github/logo-exact/part*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/hassoun-exact-source.png
          python3 - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          source = '/tmp/hassoun-exact-source.png'
          output = '/tmp/hassoun-exact.png'
          with Image.open(source) as image:
              image.load()
              image.convert('RGBA').save(output, format='PNG', optimize=True)
          print('Re-encoded Hassoun icon:', output)
          PY
          pngcheck -q /tmp/hassoun-exact.png

          for target in assets/hassoun-logo.png assets/icon.png assets/adaptive-icon.png assets/splash-logo.png; do
            cp /tmp/hassoun-exact.png "$target"
          done

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          roots = [Path('assets'), Path('src')]
          repaired = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.png'):
                  with Image.open(path) as image:
                      image.load()
                      image.convert('RGBA').save(path, format='PNG', optimize=True)
                  repaired.append(path)
          print(f'Re-encoded {len(repaired)} PNG assets before Android prebuild.')
          PY
          find assets src -type f -iname '*.png' -print0 | xargs -0 -r -n1 pngcheck -q

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify native image picker autolinked
        run: |
          grep -Rqi 'imagepicker' android || { echo 'expo-image-picker native Android module was not linked'; exit 1; }

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Prepare named APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-display-crash-fixed.apk
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-display-crash-fixed.apk | tee android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-display-crash-fixed.apk.sha256
          ls -lh android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-display-crash-fixed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.13-smart-wall-display-crash-fixed
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-display-crash-fixed.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-display-crash-fixed.apk.sha256
          if-no-files-found: error
          retention-days: 30
