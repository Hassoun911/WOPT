name: Build Hassoun v1.0.13 tablet wall display

on:
  push:
    branches:
      - release/v1.0.13-tablet-wall-display
    paths:
      - 'mobile/src/TabletWallPrayerDisplay.tsx'
      - 'mobile/src/WallRemoteController.tsx'
      - 'mobile/src/wallRemote.ts'
      - 'mobile/scripts/apply-tablet-wall-display.mjs'
      - 'mobile/scripts/prepare-wall-remote-main-patch.mjs'
      - 'mobile/scripts/apply-wall-remote-visual-editor.mjs'
      - 'mobile/modules/prayer-audio/**'
      - 'mobile/app.config.ts'
      - '.github/logo-official/hassoun-official-256.jpg.b64'
      - '.github/workflows/build-v1013-tablet-wall-display.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-v1013-tablet-wall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout tablet wall display branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.13-tablet-wall-display

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install expo-image-picker expo-file-system expo-battery expo-brightness --npm

      - name: Prepare live remote editor patch
        run: node scripts/prepare-wall-remote-main-patch.mjs

      - name: Apply smart portrait wall mode and phone remote
        run: node scripts/apply-tablet-wall-display.mjs

      - name: Apply visual tap-to-edit wall remote
        run: node scripts/apply-wall-remote-visual-editor.mjs

      - name: Apply official user-provided Hassoun logo everywhere
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcheck
          python3 -m pip install --quiet Pillow

          tr -d '\n\r ' < ../.github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-official.jpg
          echo 'a233f3a8e323499df9643a29280d5f53d2c18468414107b034863f6d82517e75  /tmp/hassoun-official.jpg' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Image.open('/tmp/hassoun-official.jpg').convert('RGB')
          source = ImageOps.fit(source, (1024, 1024), method=Image.Resampling.LANCZOS)
          full = source.convert('RGBA')
          full.save('/tmp/hassoun-full.png', format='PNG', optimize=True)

          launcher = Image.new('RGBA', (1024, 1024), (7, 43, 37, 255))
          safe = full.resize((720, 720), Image.Resampling.LANCZOS)
          launcher.alpha_composite(safe, ((1024 - 720) // 2, (1024 - 720) // 2))
          launcher.save('/tmp/hassoun-launcher.png', format='PNG', optimize=True)

          for target in ['assets/hassoun-logo.png', 'assets/splash-logo.png', 'assets/splash-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              full.save(target, format='PNG', optimize=True)

          for target in ['assets/icon.png', 'assets/adaptive-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              launcher.save(target, format='PNG', optimize=True)

          widget = Path('modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png')
          widget.parent.mkdir(parents=True, exist_ok=True)
          full.resize((512, 512), Image.Resampling.LANCZOS).save(widget, format='PNG', optimize=True)

          web = Path('../pwa/public/hassoun-logo.png')
          web.parent.mkdir(parents=True, exist_ok=True)
          full.save(web, format='PNG', optimize=True)
          PY

          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.tsx'):
              text = path.read_text(errors='ignore')
              if 'hassoun-logo.png' not in text:
                  continue
              text = text.replace('source={require("./assets/hassoun-logo.png")} style={styles.headerLogo}', 'source={require("./assets/hassoun-logo.png")} resizeMode="contain" style={styles.headerLogo}')
              path.write_text(text)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          for path in Path('modules/hassoun-widget/android/src/main/res/layout').glob('*.xml'):
              try:
                  tree = ET.parse(path)
              except ET.ParseError:
                  continue
              changed = False
              for el in tree.iter():
                  ident = el.attrib.get(f'{{{android}}}id', '')
                  src = el.attrib.get(f'{{{android}}}src', '')
                  if ident.endswith('/widget_logo') or src.endswith('/hassoun_widget_logo'):
                      el.set(f'{{{android}}}scaleType', 'centerInside')
                      el.set(f'{{{android}}}adjustViewBounds', 'true')
                      changed = True
              if changed:
                  tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

          pngcheck -q /tmp/hassoun-full.png
          pngcheck -q /tmp/hassoun-launcher.png
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/adaptive-icon.png
          pngcheck -q modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Validate smart wall, remote, Ramadan audio and phone safety
        run: |
          npm run typecheck
          grep -q 'viewportWidth >= 600' App.tsx
          grep -q 'viewportHeight > viewportWidth' App.tsx
          grep -q 'WallRemoteController' App.tsx
          grep -q 'onOpenWallDisplays' App.tsx
          grep -q 'Wall Displays' src/SettingsHub.tsx
          grep -q 'Live wall preview' src/WallRemoteController.tsx
          grep -q 'Changes apply automatically' src/WallRemoteController.tsx
          grep -q 'locationLabel={wallLocationLabel}' App.tsx
          grep -q 'useKeepAwake("hassoun-tablet-wall-display")' src/TabletWallPrayerDisplay.tsx
          grep -q 'Wall Display Designer' src/TabletWallPrayerDisplay.tsx
          grep -q 'Remote Wall Control' src/TabletWallPrayerDisplay.tsx
          grep -q 'Ramadan Mode' src/TabletWallPrayerDisplay.tsx
          grep -q 'expo-file-system/legacy' src/TabletWallPrayerDisplay.tsx
          grep -q 'backgroundOverlayOpacity' src/TabletWallPrayerDisplay.tsx
          grep -q 'PRAYER APPROACHING' src/TabletWallPrayerDisplay.tsx
          grep -q 'ADHAN NOW' src/TabletWallPrayerDisplay.tsx
          grep -q 'pairWallDisplay' src/WallRemoteController.tsx
          grep -q 'startWallDeviceSync' src/wallRemote.ts
          grep -q 'setRamadanMaghribMode' modules/prayer-audio/android/src/main/java/ca/wopt/prayeraudio/PrayerAudioModule.kt
          grep -q 'playRamadanIntro(3)' modules/prayer-audio/android/src/main/java/ca/wopt/prayeraudio/PrayerAudioService.kt
          test -s modules/prayer-audio/android/src/main/res/raw/ramadan_maghrib.mp3
          grep -q 'adaptive-icon.png' app.config.ts
          test -s assets/hassoun-logo.png
          test -s assets/icon.png
          test -s assets/adaptive-icon.png
          test -s assets/splash-icon.png
          test -s modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png
          test -s ../pwa/public/hassoun-logo.png

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Prepare named APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-remote-ramadan.apk
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-remote-ramadan.apk | tee android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-remote-ramadan.apk.sha256
          ls -lh android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-remote-ramadan.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.13-smart-wall-remote-ramadan
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-remote-ramadan.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.13-smart-wall-remote-ramadan.apk.sha256
          if-no-files-found: error
          retention-days: 30
