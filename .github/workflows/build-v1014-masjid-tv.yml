name: Build Hassoun v1.0.14 Masjid TV

on:
  push:
    branches:
      - release/v1.0.14-masjid-tv
    paths:
      - 'mobile/src/MasjidTvDisplay.tsx'
      - 'mobile/src/TabletWallPrayerDisplay.tsx'
      - 'mobile/src/WallRemoteController.tsx'
      - 'mobile/src/wallRemote.ts'
      - 'mobile/scripts/apply-wall-shell-for-masjid.mjs'
      - 'mobile/scripts/apply-masjid-tv.mjs'
      - 'mobile/scripts/apply-masjid-remote.mjs'
      - 'mobile/scripts/apply-masjid-typefix.mjs'
      - 'mobile/modules/prayer-audio/**'
      - 'mobile/app.config.ts'
      - '.github/logo-official/hassoun-official-256.jpg.b64'
      - '.github/workflows/build-v1014-masjid-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-v1014-masjid-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Masjid TV branch
        uses: actions/checkout@v6
        with:
          ref: release/v1.0.14-masjid-tv
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install expo-image-picker expo-file-system expo-battery expo-brightness expo-document-picker --npm
      - name: Apply shared wall shell
        run: node scripts/apply-wall-shell-for-masjid.mjs
      - name: Apply Masjid TV routing and paired admin remote
        run: |
          node scripts/apply-masjid-tv.mjs
          node scripts/apply-masjid-remote.mjs
          node scripts/apply-masjid-typefix.mjs
      - name: Validate TypeScript and Masjid features
        run: |
          npm run typecheck
          grep -q 'Platform.isTV' App.tsx
          grep -q 'MasjidTvDisplay' App.tsx
          grep -q 'landscapeLayout' src/MasjidTvDisplay.tsx
          grep -q 'portraitLayout' src/MasjidTvDisplay.tsx
          grep -q 'Jumu.ah sessions' src/MasjidTvDisplay.tsx
          grep -q 'Announcements & activities' src/MasjidTvDisplay.tsx
          grep -q 'Choose CSV / JSON Schedule File' src/MasjidTvDisplay.tsx
          grep -q 'Masjid administration' src/WallRemoteController.tsx
          grep -q 'defaultIqama' src/WallRemoteController.tsx
          grep -q 'open_masjid_admin' src/WallRemoteController.tsx
          grep -q 'Ramadan Mode' src/TabletWallPrayerDisplay.tsx
          grep -q 'playRamadanIntro(3)' modules/prayer-audio/android/src/main/java/ca/wopt/prayeraudio/PrayerAudioService.kt
      - name: Restore verified Hassoun image assets
        run: |
          python3 -m pip install --quiet Pillow
          tr -d '\n\r ' < ../.github/logo-official/hassoun-official-256.jpg.b64 | base64 --decode > /tmp/hassoun-official.jpg
          echo 'a233f3a8e323499df9643a29280d5f53d2c18468414107b034863f6d82517e75  /tmp/hassoun-official.jpg' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Image.open('/tmp/hassoun-official.jpg').convert('RGB')
          full = ImageOps.fit(source, (1024, 1024), method=Image.Resampling.LANCZOS).convert('RGBA')
          launcher = Image.new('RGBA', (1024, 1024), (7,43,37,255))
          safe = full.resize((720,720), Image.Resampling.LANCZOS)
          launcher.alpha_composite(safe, ((1024-720)//2,(1024-720)//2))
          for target in ['assets/hassoun-logo.png','assets/splash-logo.png','assets/splash-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True); full.save(target, 'PNG', optimize=True)
          for target in ['assets/icon.png','assets/adaptive-icon.png']:
              Path(target).parent.mkdir(parents=True, exist_ok=True); launcher.save(target, 'PNG', optimize=True)
          widget = Path('modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png')
          widget.parent.mkdir(parents=True, exist_ok=True)
          full.resize((512,512), Image.Resampling.LANCZOS).save(widget, 'PNG', optimize=True)
          PY
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Enable Android TV launcher and full-screen TV orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          android = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android)
          tree = ET.parse(manifest)
          root = tree.getroot()

          def has_feature(name):
              return any(el.tag == 'uses-feature' and el.attrib.get(f'{{{android}}}name') == name for el in root)

          if not has_feature('android.software.leanback'):
              ET.SubElement(root, 'uses-feature', {f'{{{android}}}name':'android.software.leanback', f'{{{android}}}required':'false'})
          if not has_feature('android.hardware.touchscreen'):
              ET.SubElement(root, 'uses-feature', {f'{{{android}}}name':'android.hardware.touchscreen', f'{{{android}}}required':'false'})

          app = root.find('application')
          if app is None:
              raise SystemExit('application not found')
          app.set(f'{{{android}}}banner', '@drawable/hassoun_widget_logo')
          main = next((a for a in app.findall('activity') if a.attrib.get(f'{{{android}}}name', '').endswith('MainActivity')), None)
          if main is None:
              raise SystemExit('MainActivity not found')

          # Expo's app config is portrait for phones. Remove the manifest-level portrait lock
          # and let MainActivity choose landscape only when Android reports a television.
          main.set(f'{{{android}}}screenOrientation', 'unspecified')

          if not any('android.intent.category.LEANBACK_LAUNCHER' in [x.attrib.get(f'{{{android}}}name') for x in filt.findall('category')] for filt in main.findall('intent-filter')):
              filt = ET.SubElement(main, 'intent-filter')
              ET.SubElement(filt, 'action', {f'{{{android}}}name':'android.intent.action.MAIN'})
              ET.SubElement(filt, 'category', {f'{{{android}}}name':'android.intent.category.LEANBACK_LAUNCHER'})
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          activity = next(Path('android/app/src/main/java').rglob('MainActivity.kt'), None)
          if activity is None:
              raise SystemExit('MainActivity.kt not found')
          text = activity.read_text()
          if 'android.content.pm.ActivityInfo' not in text:
              package_end = text.find('\n', text.find('package '))
              text = text[:package_end+1] + 'import android.content.pm.ActivityInfo\nimport android.content.res.Configuration\n' + text[package_end+1:]
          marker = 'super.onCreate(null)'
          if 'UI_MODE_TYPE_TELEVISION' not in text:
              if marker not in text:
                  raise SystemExit('MainActivity onCreate marker not found')
              conditional = '''val deviceType = resources.configuration.uiMode and Configuration.UI_MODE_TYPE_MASK\n    requestedOrientation = if (deviceType == Configuration.UI_MODE_TYPE_TELEVISION) {\n      ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE\n    } else {\n      ActivityInfo.SCREEN_ORIENTATION_PORTRAIT\n    }\n    super.onCreate(null)'''
              text = text.replace(marker, conditional, 1)
          activity.write_text(text)
          print(f'Patched TV orientation in {activity}')
          PY
          grep -q 'LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android.software.leanback' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.touchscreen' android/app/src/main/AndroidManifest.xml
          grep -R -q 'UI_MODE_TYPE_TELEVISION' android/app/src/main/java
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          NODE_ENV=production ./gradlew clean assembleRelease --no-daemon --stacktrace
      - name: Prepare named APK
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/Hassoun-v1.0.14-masjid-tv.apk
          sha256sum android/app/build/outputs/apk/release/Hassoun-v1.0.14-masjid-tv.apk | tee android/app/build/outputs/apk/release/Hassoun-v1.0.14-masjid-tv.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassoun-v1.0.14-masjid-tv
          path: |
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.14-masjid-tv.apk
            mobile/android/app/build/outputs/apk/release/Hassoun-v1.0.14-masjid-tv.apk.sha256
          if-no-files-found: error
          retention-days: 30
