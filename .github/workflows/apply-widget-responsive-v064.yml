name: Apply responsive widget v0.6.4 repair

on:
  push:
    paths:
      - ".github/widget-v064-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply responsive widget repair
        run: python .github/scripts/fix-widget-responsive-v064.py
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile
          git commit -m "Fix responsive widget sizing and initial refresh" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Trigger full validation
        run: |
          printf 'trigger=%s\nreason=responsive-widget-v064-repair\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/v063-trigger.txt
          git add .github/v063-trigger.txt
          git commit -m "Validate responsive widget repair"
          git pull --rebase origin main
          git push origin HEAD:main
