name: Hassoun 1.0.3 Release Housekeeping Once
on:
  workflow_dispatch:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths: [.github/workflows/release-housekeeping-once.yml]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align package lock and remove one-time helpers
        run: |
          cd mobile
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ..
          rm -f \
            .github/workflows/apply-about-guide-integration.yml \
            .github/workflows/fix-alerts-once.yml \
            .github/workflows/fix-fast-start-once.yml \
            .github/workflows/bump-v103-release-once.yml \
            .github/workflows/fix-islamic-events-full-hijri-year-once.yml \
            .github/workflows/fix-multiplayer-null-once.yml \
            .github/workflows/fix-quran-bidirectional-once.yml \
            .github/workflows/release-housekeeping-once.yml
      - name: Commit release housekeeping
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/package-lock.json .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Hassoun 1.0.3 release housekeeping"
          git push origin HEAD:work/hassoun-1.0-store-admin
