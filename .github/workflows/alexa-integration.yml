name: Validate Hassoun Alexa Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "integrations/alexa/**"
      - "push-server/src/alexaData.ts"
      - "push-server/src/voiceAccounts.ts"
      - "push-server/src/entry.ts"
      - "push-server/migrations/0018_voice_accounts.sql"
      - ".github/workflows/alexa-integration.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild approved Alexa dashboard JPG
        run: |
          set -euo pipefail
          cat integrations/alexa/assets/dashboard-bg.part0 \
              integrations/alexa/assets/dashboard-bg.part1 \
              integrations/alexa/assets/dashboard-bg.part2 \
              integrations/alexa/assets/dashboard-bg.part3 \
              integrations/alexa/assets/dashboard-bg.part4 > /tmp/dashboard.b64
          python - <<'PY'
          import base64
          from pathlib import Path
          text = Path('/tmp/dashboard.b64').read_text(encoding='utf-8').strip()
          data = base64.b64decode(text, validate=True)
          assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9'
          assert len(data) > 20000
          Path('integrations/alexa/assets/dashboard-bg.jpg').write_bytes(data)
          print('dashboard JPG bytes:', len(data))
          PY
          test "$(file -b --mime-type integrations/alexa/assets/dashboard-bg.jpg)" = "image/jpeg"

      - name: Publish corrected dashboard JPG when changed
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- integrations/alexa/assets/dashboard-bg.jpg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add integrations/alexa/assets/dashboard-bg.jpg
            git commit -m "Publish corrected approved Alexa dashboard JPG"
            git push
          else
            echo "dashboard-bg.jpg already correct"
          fi

      - name: Polish Echo Show dashboard layout
        run: node integrations/alexa/scripts/polish-dashboard-layout.mjs

      - name: Validate Alexa skill JSON
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('integrations/alexa/skill-package/skill.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/alexa/skill-package/interactionModels/custom/en-CA.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/alexa/skill-package/interactionModels/custom/en-US.json','utf8'))"

      - name: Validate Lambda syntax
        run: |
          node --check integrations/alexa/lambda/index.mjs
          node --check integrations/alexa/lambda/linked.mjs

      - name: Smoke test live Hassoun Alexa data endpoint
        run: |
          set -euo pipefail
          url="https://wopt-prayer-push.wopt-windsor.workers.dev/voice/alexa/context"
          ok=false
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/alexa-context.json -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true and .location == "Windsor, Ontario" and (.prayers.maghrib.displayTime | type == "string") and (.nextPrayer.name | type == "string") and (.hijriDate | type == "string")' /tmp/alexa-context.json >/dev/null; then
              ok=true
              break
            fi
            echo "Waiting for Alexa endpoint (${attempt}/12), HTTP ${code}"
            sleep 5
          done
          test "$ok" = true

      - name: Verify dashboard image is publicly reachable
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/Hassoun911/WOPT/main/integrations/alexa/assets/dashboard-bg.jpg?v=20260916-approved1"
          ok=false
          for attempt in $(seq 1 12); do
            code="$(curl -L -sS -o /tmp/dashboard-public.jpg -w '%{http_code}' "$url" || true)"
            ctype="$(file -b --mime-type /tmp/dashboard-public.jpg 2>/dev/null || true)"
            size="$(wc -c < /tmp/dashboard-public.jpg 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] && [ "$ctype" = "image/jpeg" ] && [ "$size" -gt 20000 ]; then
              ok=true
              break
            fi
            echo "Waiting for public dashboard JPG (${attempt}/12), HTTP ${code}, type ${ctype}, bytes ${size}"
            sleep 5
          done
          test "$ok" = true

      - name: Stage account-linked Lambda package
        run: |
          mkdir -p artifacts/lambda
          cp integrations/alexa/lambda/index.mjs artifacts/lambda/base.mjs
          cp integrations/alexa/lambda/linked.mjs artifacts/lambda/index.mjs

      - name: Simulate Echo Show launch request
        run: |
          node --input-type=module <<'NODE'
          import { handler } from './artifacts/lambda/index.mjs';
          const result = await handler({
            context: { System: { device: { deviceId: 'test-device', supportedInterfaces: { 'Alexa.Presentation.APL': {} } }, user: { userId: 'test-user' }, apiEndpoint: 'https://api.amazonalexa.com' } },
            request: { type: 'LaunchRequest' }
          });
          const directive = result?.response?.directives?.[0];
          if (result?.version !== '1.0') process.exit(1);
          if (!result?.response?.outputSpeech?.text?.includes('Hassoun')) process.exit(1);
          if (directive?.type !== 'Alexa.Presentation.APL.RenderDocument') process.exit(1);
          const src = JSON.stringify(directive.document || {});
          if (!src.includes('dashboard-bg.jpg?v=20260916-approved1')) process.exit(1);
          console.log(result.response.outputSpeech.text);
          NODE

      - name: Package Lambda
        run: |
          cd artifacts/lambda
          zip -r ../hassoun-alexa-lambda.zip .

      - name: Package Alexa skill files
        run: |
          cd integrations/alexa/skill-package
          zip -r ../../../artifacts/hassoun-alexa-skill-package.zip .

      - name: Upload Alexa packages
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-alexa-integration
          path: |
            artifacts/hassoun-alexa-lambda.zip
            artifacts/hassoun-alexa-skill-package.zip
          retention-days: 30
