name: Validate Hassoun Alexa Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "integrations/alexa/**"
      - "push-server/src/alexaData.ts"
      - "push-server/src/voiceAccounts.ts"
      - "push-server/src/entry.ts"
      - "push-server/migrations/0018_voice_accounts.sql"
      - ".github/workflows/alexa-integration.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical Alexa dashboard PNG
        shell: bash
        run: |
          set -euo pipefail
          p='integrations/alexa/assets/alexa-dashboard-approved-960x600.png'
          test -s "$p"
          test "$(file -b --mime-type "$p")" = "image/png"
          python3 - "$p" <<'PY'
          import sys, struct, zlib, binascii
          p=sys.argv[1]
          data=open(p,'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          off=8; w=h=None; idat=[]; saw_iend=False
          while off < len(data):
              assert off+12 <= len(data)
              n=struct.unpack('>I', data[off:off+4])[0]
              typ=data[off+4:off+8]
              chunk=data[off+8:off+8+n]
              crc=struct.unpack('>I', data[off+8+n:off+12+n])[0]
              assert (binascii.crc32(typ+chunk) & 0xffffffff) == crc
              if typ == b'IHDR':
                  w,h=struct.unpack('>II',chunk[:8])
              elif typ == b'IDAT':
                  idat.append(chunk)
              elif typ == b'IEND':
                  saw_iend=True
                  break
              off += 12+n
          assert w and h and w >= 900 and h >= 560, (w,h)
          ratio=w/h
          assert 1.55 <= ratio <= 1.65, (w,h,ratio)
          assert idat and saw_iend
          zlib.decompress(b''.join(idat))
          print('Clean PNG validated:', w, h, 'ratio', round(ratio,4), len(data), 'bytes')
          PY

      - name: Verify public Alexa dashboard image URL
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/Hassoun911/WOPT/main/integrations/alexa/assets/alexa-dashboard-approved-960x600.png?v=20260916-clean2'
          code="$(curl -L -sS -o /tmp/alexa-bg.png -w '%{http_code}' "$url")"
          test "$code" = "200"
          test "$(file -b --mime-type /tmp/alexa-bg.png)" = "image/png"
          cmp -s 'integrations/alexa/assets/alexa-dashboard-approved-960x600.png' /tmp/alexa-bg.png
          echo 'Public clean PNG returned HTTP 200, image/png, and exact committed bytes.'

      - name: Polish Echo Show dashboard layout
        run: node integrations/alexa/scripts/polish-dashboard-layout.mjs
      - name: Validate Alexa skill JSON
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('integrations/alexa/skill-package/skill.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/alexa/skill-package/interactionModels/custom/en-CA.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('integrations/alexa/skill-package/interactionModels/custom/en-US.json','utf8'))"
      - name: Validate Lambda syntax
        run: |
          node --check integrations/alexa/lambda/index.mjs
          node --check integrations/alexa/lambda/linked.mjs
      - name: Smoke test live Hassoun Alexa data endpoint
        run: |
          set -euo pipefail
          url="https://wopt-prayer-push.wopt-windsor.workers.dev/voice/alexa/context"
          code="$(curl -sS -o /tmp/alexa-context.json -w '%{http_code}' "$url" || true)"
          test "$code" = "200"
          jq -e '.ok == true and .location == "Windsor, Ontario" and (.prayers.maghrib.displayTime | type == "string") and (.nextPrayer.name | type == "string") and (.hijriDate | type == "string")' /tmp/alexa-context.json >/dev/null
      - name: Stage account-linked Lambda package
        run: |
          mkdir -p artifacts/lambda
          cp integrations/alexa/lambda/index.mjs artifacts/lambda/base.mjs
          cp integrations/alexa/lambda/linked.mjs artifacts/lambda/index.mjs
      - name: Simulate Echo Show launch request
        run: |
          node --input-type=module <<'NODE'
          import { handler } from './artifacts/lambda/index.mjs';
          const result = await handler({context:{System:{device:{deviceId:'test-device',supportedInterfaces:{'Alexa.Presentation.APL':{}}},user:{userId:'test-user'},apiEndpoint:'https://api.amazonalexa.com'}},request:{type:'LaunchRequest'}});
          const directive = result?.response?.directives?.[0];
          if (result?.version !== '1.0') process.exit(1);
          if (directive?.type !== 'Alexa.Presentation.APL.RenderDocument') process.exit(1);
          const doc = JSON.stringify(directive.document || {});
          if (!doc.includes('alexa-dashboard-approved-960x600.png')) process.exit(1);
          if (doc.includes('dashboard-bg.jpg') || doc.includes('data:image')) process.exit(1);
          if (doc.includes('backgroundColor')) process.exit(1);
          console.log('APL launch uses clean PNG background with live text only.');
          NODE
      - name: Package Lambda
        run: |
          cd artifacts/lambda
          zip -r ../hassoun-alexa-lambda.zip .
      - name: Package Alexa skill files
        run: |
          cd integrations/alexa/skill-package
          zip -r ../../../artifacts/hassoun-alexa-skill-package.zip .
      - name: Upload Alexa packages
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-alexa-integration
          path: |
            artifacts/hassoun-alexa-lambda.zip
            artifacts/hassoun-alexa-skill-package.zip
          retention-days: 30
