name: Deploy Hassoun PWA

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static PWA
        run: npx next build
        env:
          WOPT_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_PUSH_API_URL: "https://wopt-prayer-push.wopt-windsor.workers.dev"

      - name: Verify exported routes
        run: |
          test -f out/index.html
          test -f out/quran/index.html
          test -f out/manifest.webmanifest
          test -f out/sw.js
          test -f out/CNAME
          test "$(cat out/CNAME)" = "hassoun.app"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/out

  deploy:
    environment:
      name: github-pages
      url: https://hassoun.app
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
