name: Deploy Hassoun PWA

on:
  push:
    branches: [main, work/hassoun-1.0-store-admin]
    paths:
      - "pwa/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static PWA for hassoun.app
        run: npx next build
        env:
          WOPT_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_PUSH_API_URL: "https://wopt-prayer-push.wopt-windsor.workers.dev"

      - name: Verify exported routes and custom-domain assets
        run: |
          test -f out/index.html
          test -f out/quran/index.html
          test -f out/admin/index.html
          test -f out/manifest.webmanifest
          test -f out/sw.js
          test -f out/CNAME
          test -f out/icon-192.png
          test -f out/property-cousins-sponsor.jpg
          grep -qx 'hassoun.app' out/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pwa/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout verification branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Record hassoun.app deployment on current branch
        run: |
          cat > .github/pwa-pages-status.txt <<EOF
          hassoun_app_pages=ready
          custom_domain=hassoun.app
          root_base_path=ready
          gps_location_bootstrap=ready
          email_assets=ready
          deployed_url=${{ steps.deployment.outputs.page_url }}
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_commit=${{ github.sha }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pwa-pages-status.txt
          git commit -m "Record hassoun.app Pages deployment" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
