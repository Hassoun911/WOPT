name: Build Hassoun v0.6.6 Widget Events Brand APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v066-trigger.txt"

permissions:
  contents: write

concurrency:
  group: hassoun-v066-widget-events-brand
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Hassoun logo and final widget repair
        id: sourcefix
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix-widget-and-brand-final.py
          cat .github/logo-exact/part0.b64 .github/logo-exact/part1.b64 .github/logo-exact/part2.b64 .github/logo-exact/part3.b64 | base64 -d > mobile/assets/hassoun-logo.png
          mkdir -p pwa/public/assets
          cp mobile/assets/hassoun-logo.png pwa/public/assets/hassoun-logo.png
          mkdir -p mobile/modules/hassoun-widget/android/src/main/res/drawable
          cp mobile/assets/hassoun-logo.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png
          file mobile/assets/hassoun-logo.png
          test -s mobile/assets/hassoun-logo.png

      - name: Verify required fixes before build
        id: sourcecheck
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "0.6.6"' mobile/app.config.ts
          grep -q 'versionCode: 38' mobile/app.config.ts

          # Events must not depend on Android/Hermes Islamic Intl support.
          grep -q 'islamicToJulianDay' mobile/src/islamicEvents.ts
          grep -q 'HIJRI_DAY_OFFSET' mobile/src/islamicEvents.ts
          ! grep -q 'islamic-umalqura' mobile/src/islamicEvents.ts
          grep -q 'islamicToJulianDay' push-server/src/islamicEvents.ts

          # Samsung must start from the safe full Home widget on base and API 36.
          grep -q 'initialLayout="@layout/hassoun_prayer_widget"' mobile/modules/hassoun-widget/android/src/main/res/xml/hassoun_prayer_widget_info.xml
          grep -q 'initialLayout="@layout/hassoun_prayer_widget"' mobile/modules/hassoun-widget/android/src/main/res/xml-v36/hassoun_prayer_widget_info.xml
          grep -q 'minHeight <= 80 || minWidth >= minHeight \* 3.20' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'minWidth <= 0 || minHeight <= 0 -> "full"' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'widgetCategory="keyguard"' mobile/modules/hassoun-widget/android/src/main/res/xml-v36/hassoun_lock_widget_info.xml

          # Full-screen page branding uses the shared Hassoun logo.
          grep -q 'hassoun-logo.png' mobile/App.tsx
          grep -q 'BrandMark' mobile/AppWithEmail.tsx
          grep -q 'BrandMark' mobile/src/IslamicEventsPage.tsx
          grep -q 'BrandMark' mobile/src/QuizGamesHub.tsx
          grep -q 'BrandMark' mobile/src/IslamicQuiz.tsx
          grep -q 'BrandMark' mobile/src/MultiplayerGames.tsx
          grep -q 'BrandMark' mobile/src/SettingsHub.tsx
          grep -q 'BrandMark' mobile/src/EmailSignupCard.tsx
          grep -q 'BrandMark' mobile/src/quran/QuranV3.tsx
          grep -q 'BrandMark' mobile/src/quran/SmartMemorize.tsx
          test -s pwa/public/assets/hassoun-logo.png

          # Retain recent Qur'an/audio/game fixes.
          grep -q 'playVisibleReaderPages' mobile/src/quran/QuranV3.tsx
          grep -q 'QuranAudio.playRange' mobile/src/quran/QuranV3.tsx
          grep -q 'Keep the exact verified page-font sequence intact' mobile/src/quran/quranRendering.tsx
          grep -q 'Live Trivia' mobile/src/MultiplayerGames.tsx
          grep -q 'Imposter' mobile/src/MultiplayerGames.tsx
          grep -q 'Clue Battle' mobile/src/MultiplayerGames.tsx

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            push-server/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate mobile TypeScript
        id: mobilets
        run: |
          set -euo pipefail
          cd mobile
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Validate Worker
        id: worker
        run: |
          set -euo pipefail
          cd push-server
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Commit validated v0.6.6 source before native build
        id: sourcecommit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile push-server pwa/public/assets/hassoun-logo.png
          git commit -m "Hassoun v0.6.6 fix Samsung widget Islamic events and exact branding" || true
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Clean Expo Android prebuild
        id: prebuild
        run: |
          set -euo pipefail
          cd mobile
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        id: gradle
        timeout-minutes: 28
        run: |
          set -euo pipefail
          cd mobile/android
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify standalone bundle
        id: verifyapk
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/v066-apk.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/v066-apk.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v0.6.6.apk

      - name: Upload v0.6.6 APK
        id: uploadapk
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.6.6-widget-events-brand-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.6.6.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record v0.6.6 result
        if: always()
        shell: bash
        run: |
          cat > .github/v066-build-result.txt <<EOF
          status=${{ job.status }}
          version=0.6.6
          versionCode=38
          source_fix=${{ steps.sourcefix.outcome }}
          source_check=${{ steps.sourcecheck.outcome }}
          mobile_typescript=${{ steps.mobilets.outcome }}
          worker_validation=${{ steps.worker.outcome }}
          source_commit=${{ steps.sourcecommit.outcome }}
          expo_prebuild=${{ steps.prebuild.outcome }}
          gradle=${{ steps.gradle.outcome }}
          apk_verify=${{ steps.verifyapk.outcome }}
          apk_upload=${{ steps.uploadapk.outcome }}
          samsung_home_widget_full_initial=true
          samsung_api36_widget_fixed=true
          islamic_events_android_intl_dependency_removed=true
          exact_hassoun_logo_all_pages=true
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          artifact=hassoun-v0.6.6-widget-events-brand-${{ github.run_number }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v066-build-result.txt
          git commit -m "Record Hassoun v0.6.6 build result" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
