name: Hassoun 1.0 Android Store Validation

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - "mobile/**"
      - ".github/workflows/android-store-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hassoun-android-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-android-store:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Repair and verify Hassoun PNG assets
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          assets = [
              Path('assets/hassoun-logo.png'),
              Path('assets/icon.png'),
              Path('assets/adaptive-icon.png'),
              Path('assets/splash-logo.png'),
              Path('assets/notification-icon.png'),
          ]
          for path in assets:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing required Hassoun image: {path}')
              image = Image.open(path).convert('RGBA')
              tmp = path.with_suffix('.repaired.png')
              image.save(tmp, format='PNG', optimize=True)
              tmp.replace(path)
              print(f'Repaired {path}')
          PY
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/adaptive-icon.png
          pngcheck -q assets/splash-logo.png
          pngcheck -q assets/notification-icon.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp assets/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: TypeScript validation
        run: npm run typecheck

      - name: Verify restricted exact-alarm permission is absent
        run: |
          if grep -R --line-number --fixed-strings "android.permission.USE_EXACT_ALARM" app.config.ts modules; then
            echo "USE_EXACT_ALARM is not allowed in the store release source."
            exit 1
          fi
          grep -R --line-number --fixed-strings "android.permission.SCHEDULE_EXACT_ALARM" app.config.ts modules/prayer-audio/android/src/main/AndroidManifest.xml

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify Android target SDK 36+
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found."
            exit 1
          fi
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          TARGET="$($ANALYZER manifest target-sdk "$APK")"
          echo "Detected targetSdkVersion=$TARGET"
          if [ "$TARGET" -lt 36 ]; then
            echo "Google Play store release requires targetSdkVersion 36 or newer."
            exit 1
          fi

      - name: Verify final manifest permissions
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          PERMISSIONS="$($ANALYZER manifest permissions "$APK")"
          echo "$PERMISSIONS"
          if echo "$PERMISSIONS" | grep -q "android.permission.USE_EXACT_ALARM"; then
            echo "Restricted USE_EXACT_ALARM leaked into the final Android manifest."
            exit 1
          fi
          echo "$PERMISSIONS" | grep -q "android.permission.SCHEDULE_EXACT_ALARM"

      - name: Upload Hassoun 1.0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-1.0.5-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Hassoun 1.0.5 AAB
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-1.0.5-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Record Android validation on current branch
        working-directory: .
        run: |
          APK="$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          TARGET="$($ANALYZER manifest target-sdk "$APK")"
          cat > .github/android-store-status.txt <<EOF
          android_store_validation=ready
          app_version=1.0.5
          android_version_code=46
          target_sdk=${TARGET}
          exact_alarm_policy=ready
          startup_adhan_guard=ready
          quran_bidirectional_navigation=ready
          quran_horizontal_browsing=ready
          gps_prayer_location=ready
          al_hafiz_classroom=ready
          islamic_events_full_hijri_year=ready
          settings_feature_guide=ready
          sadaqah_about_page=ready
          alert_center_stability=ready
          islamic_event_alert_controls=ready
          widget_fast_start=ready
          apk_artifact=hassoun-1.0.5-android-apk
          aab_artifact=hassoun-1.0.5-android-aab
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_commit=$(git rev-parse HEAD)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/android-store-status.txt
          git commit -m "Record Hassoun Android store validation" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
