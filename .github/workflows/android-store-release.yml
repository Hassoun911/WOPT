name: Hassoun 1.0 Android Store Validation

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - "mobile/**"
      - ".github/workflows/android-store-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassoun-android-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-android-store:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply clean Home layout
        run: node scripts/apply-v106-clean-home.mjs

      - name: Open Al-Hafiz from Memorize tile
        run: node scripts/fix-memorize-entry.mjs

      - name: Apply Al-Hafiz motivation and AI coach
        run: node scripts/apply-alhafiz-motivation.mjs

      - name: Create full-size launcher branding
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pil pngcheck
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          logo_path = Path('assets/hassoun-logo.png')
          if not logo_path.exists() or logo_path.stat().st_size == 0:
              raise SystemExit('Missing assets/hassoun-logo.png')
          logo = Image.open(logo_path).convert('RGBA')
          logo.save(logo_path, format='PNG', optimize=True)

          # Keep the approved square Hassoun logo full-size instead of putting it
          # inside the adaptive foreground safe zone, which made it tiny on Samsung.
          logo.resize((1024, 1024), Image.Resampling.LANCZOS).save('assets/icon.png', format='PNG', optimize=True)

          splash = Image.new('RGBA', (1024, 1024), (0,0,0,0))
          art = logo.copy()
          art.thumbnail((820, 820), Image.Resampling.LANCZOS)
          splash.alpha_composite(art, ((1024-art.width)//2, (1024-art.height)//2))
          splash.save('assets/splash-logo.png', format='PNG', optimize=True)

          n = Path('assets/notification-icon.png')
          if n.exists() and n.stat().st_size:
              Image.open(n).convert('RGBA').save(n, format='PNG', optimize=True)
          PY
          pngcheck -q assets/hassoun-logo.png
          pngcheck -q assets/icon.png
          pngcheck -q assets/splash-logo.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp assets/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: TypeScript validation
        run: npm run typecheck

      - name: Verify issue fixes in APK source
        run: |
          grep -q 'v106Hero' App.tsx
          grep -q 'Explore Hassoun' App.tsx
          grep -q 'activeTab === "sheikh"' App.tsx
          grep -q 'onPress={() => setScreen("memorize")}' src/quran/QuranV3.tsx
          grep -q 'AI MEMORIZATION COACH' src/quran/AlHafizClassroom.tsx
          grep -q 'KEEP LEARNING' src/quran/AlHafizClassroom.tsx
          grep -q 'StartupSplash' AppRoot.tsx
          grep -q 'icon: "./assets/icon.png"' app.config.ts
          ! grep -q 'adaptiveIcon' app.config.ts
          ! grep -q 'styles.fab' AppExperience.tsx
          ! grep -q 'Qur’an + Hadith' AppExperience.tsx

      - name: Verify restricted exact-alarm permission is absent
        run: |
          if grep -R --line-number --fixed-strings "android.permission.USE_EXACT_ALARM" app.config.ts modules; then
            echo "USE_EXACT_ALARM is not allowed in the store release source."
            exit 1
          fi

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify Android target SDK 36+
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          TARGET="$($ANALYZER manifest target-sdk "$APK")"
          echo "Detected targetSdkVersion=$TARGET"
          test "$TARGET" -ge 36

      - name: Upload Hassoun 1.0.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-1.0.7-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Hassoun 1.0.7 AAB
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-1.0.7-android-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
