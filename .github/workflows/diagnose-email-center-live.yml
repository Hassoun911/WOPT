name: Diagnose Email Center Live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-email-center-live.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect email tables and run Email Center queries
        run: |
          set -euo pipefail
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "PRAGMA table_info(email_campaigns); PRAGMA table_info(email_templates); PRAGMA table_info(email_deliveries); PRAGMA table_info(email_template_profiles); PRAGMA table_info(email_content_library);" | tee /tmp/schema.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT c.public_id, c.name, c.category, c.audience, c.target_locale, c.target_country_code, c.target_city, c.target_timezone, c.status, c.scheduled_at, c.started_at, c.sent_at, c.created_at, t.subject_en, t.subject_ar, SUM(CASE WHEN d.status = 'sent' THEN 1 ELSE 0 END) AS sent_count, SUM(CASE WHEN d.status = 'failed' THEN 1 ELSE 0 END) AS failed_count, SUM(CASE WHEN d.status = 'pending' THEN 1 ELSE 0 END) AS pending_count, COUNT(d.id) AS delivery_count FROM email_campaigns c LEFT JOIN email_templates t ON t.template_key = c.template_key LEFT JOIN email_deliveries d ON d.campaign_id = c.id GROUP BY c.id ORDER BY c.id DESC LIMIT 100;" | tee /tmp/campaigns.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT template_key, name, category, enabled, include_islamic_occasion, include_daily_hadith, include_daily_surah, include_occasion_countdown, include_motivation, include_sadaqah_jariyah, include_sponsor, sponsor_name, sponsor_url, sponsor_message_en, sponsor_message_ar, sponsor_logo_mime, CASE WHEN sponsor_logo_data IS NOT NULL AND sponsor_logo_data <> '' THEN 1 ELSE 0 END AS sponsor_logo_present, updated_at FROM email_template_profiles ORDER BY category, name;" | tee /tmp/profiles.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT template_key, name, category, subject_en, subject_ar, enabled, updated_at FROM email_templates ORDER BY id DESC LIMIT 200;" | tee /tmp/templates.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT id, content_type, title_en, title_ar, body_en, body_ar, source_ref, enabled, sort_order, updated_at FROM email_content_library ORDER BY content_type, sort_order, id;" | tee /tmp/content.json
