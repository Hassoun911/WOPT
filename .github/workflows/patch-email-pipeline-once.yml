name: Patch Hassoun Email Pipeline Once
on:
  workflow_dispatch:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths: [.github/workflows/patch-email-pipeline-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Lock Worker sender to hassoun.app and working branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-push-worker.yml')
          s=p.read_text()
          s=s.replace('branches: [main, work/hassoun-1.0-store-admin]', 'branches: [work/hassoun-1.0-store-admin]')
          s=s.replace('          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}\n','')
          s=s.replace('          put_optional_secret EMAIL_FROM "$EMAIL_FROM"\n', '          printf %s "Hassoun <notifications@hassoun.app>" | npx wrangler secret put EMAIL_FROM\n')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/deploy-push-worker.yml
          git commit -m "Lock Hassoun email sender and deployment branch" || true
          git push origin HEAD:work/hassoun-1.0-store-admin
