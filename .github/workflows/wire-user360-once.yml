name: Wire User 360 once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'Wire User 360 admin routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch Worker router
        shell: python
        run: |
          from pathlib import Path
          p = Path('push-server/src/index.ts')
          s = p.read_text()
          anchor = 'import { createAdminTeamMember } from "./adminTeamCreate";\n'
          addition = '''import {\n  getAdminUser360,\n  listAdminDevices360,\n  updateAdminDevice360,\n  updateAdminSubscriberPreferences,\n  updateAdminSubscriberProfile\n} from "./adminUser360";\n'''
          if addition not in s:
              s = s.replace(anchor, anchor + addition)
          route_anchor = '''      } else if (request.method === "POST" && /^\\/admin\\/subscribers\\/[^/]+\\/status$/.test(url.pathname)) {\n        response = await updateRestrictedSubscriberStatus(request, env, url.pathname.split("/")[3]);\n'''
          route_add = '''      } else if (request.method === "GET" && /^\\/admin\\/subscribers\\/[^/]+\\/360$/.test(url.pathname)) {\n        response = await getAdminUser360(request, env, url.pathname.split("/")[3]);\n      } else if (request.method === "POST" && /^\\/admin\\/subscribers\\/[^/]+\\/profile$/.test(url.pathname)) {\n        response = await updateAdminSubscriberProfile(request, env, url.pathname.split("/")[3]);\n      } else if (request.method === "POST" && /^\\/admin\\/subscribers\\/[^/]+\\/preferences$/.test(url.pathname)) {\n        response = await updateAdminSubscriberPreferences(request, env, url.pathname.split("/")[3]);\n      } else if (request.method === "GET" && url.pathname === "/admin/devices") {\n        response = await listAdminDevices360(request, env, url);\n      } else if (request.method === "POST" && /^\\/admin\\/devices\\/\\d+$/.test(url.pathname)) {\n        response = await updateAdminDevice360(request, env, Number(url.pathname.split("/")[3]));\n'''
          if route_add not in s:
              s = s.replace(route_anchor, route_anchor + route_add)
          p.write_text(s)
      - name: Commit router wiring
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- push-server/src/index.ts; then
            echo "No router changes."
            exit 0
          fi
          git add push-server/src/index.ts
          git commit -m "Wire User 360 admin routes"
          git push origin HEAD:work/hassoun-1.0-store-admin
