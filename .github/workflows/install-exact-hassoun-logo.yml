name: Install Exact Hassoun Logo

on:
  push:
    paths:
      - ".github/logo-master/part7.b64"

permissions:
  contents: write

jobs:
  install-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild exact uploaded logo
        run: |
          mkdir -p mobile/assets
          cat .github/logo-master/part0.b64 \
              .github/logo-master/part1.b64 \
              .github/logo-master/part2.b64 \
              .github/logo-master/part3.b64 \
              .github/logo-master/part4.b64 \
              .github/logo-master/part5.b64 \
              .github/logo-master/part6.b64 \
              .github/logo-master/part7.b64 | base64 -d > mobile/assets/hassoun-logo-master.jpg
          echo "e603f82c3cd6778a6ace95b7058150913bea0a1a98b07dd117e8d35d5de385e6  mobile/assets/hassoun-logo-master.jpg" | sha256sum -c -

      - name: Create platform copies from the same logo
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          convert mobile/assets/hassoun-logo-master.jpg mobile/assets/hassoun-logo.png
          cp mobile/assets/hassoun-logo.png mobile/assets/splash-logo.png
          convert mobile/assets/hassoun-logo-master.jpg -resize 1008x1024 -background '#10251f' -gravity center -extent 1024x1024 mobile/assets/icon.png
          cp mobile/assets/icon.png mobile/assets/adaptive-icon.png

      - name: Remove obsolete alternate logo sources
        run: |
          rm -f mobile/assets/hassoun-app-icon.svg
          rm -f mobile/assets/hassoun-brand.svg
          rm -rf .github/logo-master

      - name: Commit exact logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mobile/assets .github/logo-master
          git commit -m "Restore exact Hassoun app logo" || exit 0
          git push origin main
