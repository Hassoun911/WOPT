name: Audit Hassoun Legacy Email Recipients Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-hassoun-legacy-email-recipients-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit delivery kinds without exposing addresses
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.github/legacy-email-recipient-audit.txt"
          {
            echo "Hassoun legacy email recipient audit"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_commit=$(git rev-parse HEAD)"
            echo
            echo "email_deliveries by notification_kind:"
          } > "$out"
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT COALESCE(notification_kind,'NULL') AS kind, COUNT(*) AS rows, COUNT(DISTINCT lower(recipient_email)) AS distinct_recipients, SUM(CASE WHEN status IN ('bounced','complained','unsubscribed') THEN 1 ELSE 0 END) AS blocked_rows FROM email_deliveries GROUP BY notification_kind ORDER BY rows DESC;" | jq -r '.[0].results[] | (.kind + "|rows=" + (.rows|tostring) + "|distinct_recipients=" + (.distinct_recipients|tostring) + "|blocked_rows=" + (.blocked_rows|tostring))' >> "$out"
          echo >> "$out"
          echo "email_outbox by kind:" >> "$out"
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT COALESCE(kind,'NULL') AS kind, COUNT(*) AS rows, COUNT(DISTINCT lower(recipient_email)) AS distinct_recipients FROM email_outbox GROUP BY kind ORDER BY rows DESC;" | jq -r '.[0].results[] | (.kind + "|rows=" + (.rows|tostring) + "|distinct_recipients=" + (.distinct_recipients|tostring))' >> "$out"
          echo >> "$out"
          echo "historical prayer-like recipient count:" >> "$out"
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT COUNT(DISTINCT lower(recipient_email)) AS n FROM email_deliveries WHERE notification_kind IN ('twenty','ten','athan','prayer') AND status NOT IN ('bounced','complained','unsubscribed');" | jq -r '.[0].results[] | "eligible_distinct_recipients=" + (.n|tostring)' >> "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Save audit result
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/legacy-email-recipient-audit.txt
          git commit -m "Record Hassoun legacy email recipient audit" || true
          git push origin HEAD:main || true
