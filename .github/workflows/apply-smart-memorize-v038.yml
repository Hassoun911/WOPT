name: Apply Smart Memorize v0.3.8

on:
  push:
    paths:
      - ".github/workflows/apply-smart-memorize-v038.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Smart Memorize
        run: node .github/scripts/apply-smart-memorize-v038.mjs

      - name: Commit Smart Memorize wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Wire Smart Memorize into native Quran"
          git push origin HEAD:main
