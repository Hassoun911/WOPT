name: Auto Sync Old Resend Users Once

on:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths:
      - ".github/workflows/auto-sync-old-resend-users-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/hassoun-1.0-store-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        working-directory: push-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Discover and safely import old prayer recipients
        working-directory: push-server
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RESEND_API_KEY"
          cat > /tmp/import.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const apiKey = process.env.RESEND_API_KEY;
          const secret = process.env.EMAIL_LINK_SECRET || process.env.VAPID_PRIVATE_KEY;
          if (!secret) throw new Error('Missing email link secret');
          const headers = { Authorization: `Bearer ${apiKey}`, Accept: 'application/json' };
          async function get(path) {
            const r = await fetch(`https://api.resend.com${path}`, { headers });
            if (!r.ok) throw new Error(`${path}: ${r.status} ${await r.text()}`);
            return r.json();
          }
          const people = new Map();
          function merge(email, blocked=false, source='history') {
            if (typeof email !== 'string') return;
            email = email.trim().toLowerCase();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
            const previous = people.get(email);
            people.set(email, { email, blocked: Boolean(blocked || previous?.blocked), source });
          }
          try {
            let after = '';
            for (let page=0; page<50; page++) {
              const qs = new URLSearchParams({ limit:'100' }); if (after) qs.set('after', after);
              const payload = await get(`/emails?${qs}`);
              const rows = payload.data || [];
              if (!rows.length) break;
              for (const row of rows) {
                const subject = String(row.subject || '');
                if (!/(fajr|dhuhr|zuhr|asr|maghrib|isha|prayer time|athan|adhan|وقت الصلاة|الفجر|الظهر|العصر|المغرب|العشاء)/i.test(subject)) continue;
                const recipients = Array.isArray(row.to) ? row.to : [row.to];
                for (const email of recipients) merge(email, row.last_event === 'suppressed', 'prayer-history');
              }
              if (rows.length < 100 || !rows.at(-1)?.id) break;
              after = rows.at(-1).id;
            }
          } catch (error) { console.warn('Email-history scan:', error.message); }
          try {
            let after = '';
            for (let page=0; page<50; page++) {
              const qs = new URLSearchParams({ limit:'100' }); if (after) qs.set('after', after);
              const payload = await get(`/contacts?${qs}`);
              const rows = payload.data || [];
              if (!rows.length) break;
              for (const contact of rows) merge(contact.email, contact.unsubscribed === true, 'contact');
              if (rows.length < 100 || !rows.at(-1)?.id) break;
              after = rows.at(-1).id;
            }
          } catch (error) { console.warn('Contacts scan:', error.message); }
          const q = (v) => `'${String(v).replaceAll("'", "''")}'`;
          const statements = [];
          let active = 0, blocked = 0;
          for (const person of people.values()) {
            const status = person.blocked ? 'unsubscribed' : 'active';
            status === 'active' ? active++ : blocked++;
            const publicId = crypto.randomUUID();
            const manageToken = crypto.createHmac('sha256', secret).update(`manage|${publicId}|${person.email}`).digest('base64url');
            const manageHash = crypto.createHash('sha256').update(manageToken).digest('hex');
            statements.push(`INSERT INTO email_subscribers (public_id,email,locale,latitude,longitude,timezone,country_code,country_name,region,city,calculation_method,madhab,status,manage_token_hash,verified_at,unsubscribed_at) SELECT ${q(publicId)},${q(person.email)},'en',42.3149,-83.0364,'America/Toronto','CA','Canada','Ontario','Windsor',3,'standard',${q(status)},${q(manageHash)},${status==='active'?'CURRENT_TIMESTAMP':'NULL'},${status==='active'?'NULL':'CURRENT_TIMESTAMP'} WHERE NOT EXISTS (SELECT 1 FROM email_subscribers WHERE email=${q(person.email)} COLLATE NOCASE);`);
            statements.push(`INSERT OR IGNORE INTO subscriber_email_preferences (subscriber_id,prayer_alerts,daily_prayer_schedule,religious_occasions,daily_content,announcements,community_events,marketing) SELECT id,${status==='active'?1:0},0,1,0,1,1,0 FROM email_subscribers WHERE email=${q(person.email)} COLLATE NOCASE;`);
            for (const prayer of ['fajr','dhuhr','asr','maghrib','isha']) statements.push(`INSERT OR IGNORE INTO subscriber_prayer_preferences (subscriber_id,prayer,email_twenty,email_ten,email_athan) SELECT id,${q(prayer)},0,0,${status==='active'?1:0} FROM email_subscribers WHERE email=${q(person.email)} COLLATE NOCASE;`);
          }
          fs.writeFileSync('/tmp/legacy-users.sql', statements.join('\n'));
          fs.writeFileSync('/tmp/discovery.json', JSON.stringify({ discovered: people.size, active, blocked }));
          NODE
          node /tmp/import.mjs
          if [ -s /tmp/legacy-users.sql ]; then npx wrangler d1 execute wopt-prayer-push --remote --file /tmp/legacy-users.sql; fi
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT status, COUNT(*) AS n FROM email_subscribers GROUP BY status ORDER BY status;" > /tmp/counts.json
          out="$GITHUB_WORKSPACE/.github/legacy-user-import-result.txt"
          {
            echo "legacy_resend_import=completed"
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            jq -r '"discovered="+(.discovered|tostring),"candidate_active="+(.active|tostring),"candidate_blocked="+(.blocked|tostring)' /tmp/discovery.json
            jq -r '.[0].results[] | "crm_status_"+.status+"="+(.n|tostring)' /tmp/counts.json
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Save count-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/legacy-user-import-result.txt
          git commit -m "Record Hassoun legacy Resend user import" || true
          git push origin HEAD:work/hassoun-1.0-store-admin || true
