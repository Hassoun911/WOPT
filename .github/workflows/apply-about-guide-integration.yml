name: Apply About Guide Integration Once
on:
  workflow_dispatch:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths: [.github/workflows/apply-about-guide-integration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch app and CRM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('mobile/src/SettingsHub.tsx')
          s=p.read_text()
          if 'import FeatureGuidePage from "./FeatureGuidePage";' not in s:
              s=s.replace('import BrandMark from "./BrandMark";', 'import BrandMark from "./BrandMark";\nimport FeatureGuidePage from "./FeatureGuidePage";\nimport AboutHassounPage from "./AboutHassounPage";')
          s=s.replace('type SettingsPage = "root" | "about" | "contact" | "privacy" | "terms" | "data" | "permissions" | "widgets";', 'type SettingsPage = "root" | "about" | "guide" | "contact" | "privacy" | "terms" | "data" | "permissions" | "widgets";')
          needle='<Section title={t("HELP & SUPPORT", "المساعدة والدعم")}>\n        <Row emoji="✉️"'
          if needle in s and 'title={t("Learn the App"' not in s:
              s=s.replace(needle, '<Section title={t("HELP & SUPPORT", "المساعدة والدعم")}>\n        <Row emoji="🧭" title={t("Learn the App", "تعرّف على التطبيق")} text={t("Easy feature guide with search, steps, examples, emojis and troubleshooting", "دليل سهل للميزات مع البحث والخطوات والأمثلة والإيموجي وحل المشاكل")} onPress={() => setPage("guide")} />\n        <Row emoji="✉️"')
          pattern=r'  if \(page === "about"\) \{.*?\n  \}\n\n  if \(page === "permissions"\)'
          repl='  if (page === "about") return <AboutHassounPage locale={locale} version={appVersion} onBack={() => setPage("root")} />;\n\n  if (page === "permissions")'
          s2,n=re.subn(pattern,repl,s,flags=re.S)
          if n: s=s2
          contact='  if (page === "contact") return <ContactPage locale={locale} version={appVersion} onBack={() => setPage("root")} />;'
          if contact in s and 'page === "guide"' not in s:
              s=s.replace(contact, '  if (page === "guide") return <FeatureGuidePage locale={locale} onBack={() => setPage("root")} />;\n\n'+contact)
          p.write_text(s)

          p=Path('admin-crm/app/CrmDashboard.tsx')
          s=p.read_text()
          if 'import AboutGuideControl from "./AboutGuideControl";' not in s:
              s=s.replace('import TickerControl from "./TickerControl";', 'import TickerControl from "./TickerControl";\nimport AboutGuideControl from "./AboutGuideControl";')
          s=s.replace('type View = "dashboard" | "subscribers" | "content" | "control" | "push" | "ticker" | "team" | "audit";', 'type View = "dashboard" | "subscribers" | "content" | "control" | "push" | "ticker" | "aboutguide" | "team" | "audit";')
          old='{ key: "control", label: "App Control" }, { key: "push", label: "Push" }, { key: "ticker", label: "Ticker" }, { key: "team", label: "Admins" }'
          new='{ key: "control", label: "App Control" }, { key: "push", label: "Push" }, { key: "ticker", label: "Ticker" }, { key: "aboutguide", label: "About & Guide" }, { key: "team", label: "Admins" }'
          s=s.replace(old,new)
          ticker='{view === "ticker" ? <TickerControl /> : null}'
          if ticker in s and 'view === "aboutguide"' not in s:
              s=s.replace(ticker, ticker+'\n\n    {view === "aboutguide" ? <AboutGuideControl token={token} /> : null}')
          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/src/SettingsHub.tsx admin-crm/app/CrmDashboard.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate feature guide About Sadaqah and CRM controls"
          git push origin HEAD:work/hassoun-1.0-store-admin
