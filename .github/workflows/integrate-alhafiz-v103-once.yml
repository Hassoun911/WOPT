name: Integrate Al-Hafiz v1.0.3 once

on:
  push:
    branches: [work/hassoun-1.0-store-admin]
    paths:
      - ".github/workflows/integrate-alhafiz-v103-once.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire classroom, events, and v1.0.3
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          q = Path('mobile/src/quran/QuranV3.tsx')
          s = q.read_text()
          if 'import SmartMemorize from "./SmartMemorize";' in s:
              s = s.replace('import SmartMemorize from "./SmartMemorize";', 'import AlHafizClassroom from "./AlHafizClassroom";', 1)
          s = s.replace('<SmartMemorize', '<AlHafizClassroom').replace('</SmartMemorize>', '</AlHafizClassroom>')
          if 'AlHafizClassroom' not in s:
              raise SystemExit('Al-Hafiz integration did not land in QuranV3')
          q.write_text(s)

          events = Path('mobile/src/IslamicEventsPage.tsx')
          s = events.read_text()
          old_import = 'import { islamicDateLabelForEvent, islamicEventCountdown, islamicEventsForGregorianYear, islamicEventTimeline, type IslamicEventOccurrence } from "./islamicEvents";'
          new_import = 'import { hijriPartsForDateKey, islamicDateLabelForEvent, islamicEventCountdown, islamicEventsForGregorianYear, islamicEventTimeline, type IslamicEventOccurrence } from "./islamicEvents";'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          old_logic = '''  const year = Number(todayKey.slice(0, 4));\n  const events = islamicEventsForGregorianYear(year);\n  const timeline = islamicEventTimeline(todayKey);'''
          new_logic = '''  const year = Number(todayKey.slice(0, 4));\n  const hijriYear = hijriPartsForDateKey(todayKey).year;\n  const events = [...islamicEventsForGregorianYear(year - 1), ...islamicEventsForGregorianYear(year), ...islamicEventsForGregorianYear(year + 1)]\n    .filter((event, index, all) => event.hijriYear === hijriYear && all.findIndex((item) => item.id === event.id && item.dateKey === event.dateKey) === index)\n    .sort((a, b) => a.dateKey.localeCompare(b.dateKey));\n  const timeline = islamicEventTimeline(todayKey);'''
          if old_logic in s:
              s = s.replace(old_logic, new_logic, 1)
          elif 'const hijriYear = hijriPartsForDateKey(todayKey).year;' not in s:
              raise SystemExit('Islamic Events logic anchor not found')
          s = s.replace('t(`${year} Islamic Events`, `المناسبات الإسلامية ${new Intl.NumberFormat("ar").format(year)}`)', 't(`${hijriYear} AH Islamic Events`, `المناسبات الإسلامية ${new Intl.NumberFormat("ar").format(hijriYear)} هـ`)')
          events.write_text(s)

          pkg = Path('mobile/package.json')
          data = json.loads(pkg.read_text())
          data['version'] = '1.0.3'
          pkg.write_text(json.dumps(data, indent=2) + '\n')

          lock = Path('mobile/package-lock.json')
          data = json.loads(lock.read_text())
          data['version'] = '1.0.3'
          data['packages']['']['version'] = '1.0.3'
          lock.write_text(json.dumps(data, indent=2) + '\n')

          cfg = Path('mobile/app.config.ts')
          s = cfg.read_text()
          s = re.sub(r'version: "1\.0\.\d+"', 'version: "1.0.3"', s, count=1)
          s = re.sub(r'versionCode: \d+', 'versionCode: 44', s, count=1)
          cfg.write_text(s)

          wf = Path('.github/workflows/android-store-release.yml')
          s = wf.read_text()
          s = s.replace('1.0.2', '1.0.3').replace('android_version_code=43', 'android_version_code=44')
          wf.write_text(s)
          PY

          cd mobile
          npm ci
          npm run typecheck
          cd ..
          git restore mobile/src/quran/generated/quran-data.json 2>/dev/null || true
          git restore mobile/src/quran/quranData.generated.json mobile/src/quran/quranMeta.generated.json 2>/dev/null || true
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx mobile/src/quran/AlHafizClassroom.tsx mobile/src/IslamicEventsPage.tsx mobile/package.json mobile/package-lock.json mobile/app.config.ts .github/workflows/android-store-release.yml
          git commit -m "Upgrade Al-Hafiz classroom and Islamic Events for v1.0.3" || true
          git pull --rebase --autostash origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
