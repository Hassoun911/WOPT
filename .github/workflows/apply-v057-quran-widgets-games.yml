name: Apply Hassoun v0.5.7 Quran Widgets Games

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/apply-v057-quran-widgets-games.py"
      - ".github/scripts/post-v057-responsive.py"
      - ".github/scripts/fix-v057-widget-bridge.py"
      - ".github/workflows/apply-v057-quran-widgets-games.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-v057-quran-widgets-games.py')
          s = p.read_text()
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in s:
              raise SystemExit('Expected regex helper was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply v0.5.7 patch
        shell: bash
        run: |
          set +e
          python .github/scripts/apply-v057-quran-widgets-games.py > /tmp/v057-patch.log 2>&1
          code=$?
          echo "$code" > /tmp/v057-patch.status
          cat /tmp/v057-patch.log
          exit 0

      - name: Harden generated code
        shell: bash
        run: |
          if [ "$(cat /tmp/v057-patch.status)" != "0" ]; then
            echo 99 > /tmp/v057-harden.status
            echo "Skipped because patch stage failed" > /tmp/v057-harden.log
            exit 0
          fi
          set +e
          python - <<'PY' > /tmp/v057-harden.log 2>&1
          from pathlib import Path
          p = Path("push-server/src/games.ts")
          s = p.read_text()
          s = s.replace('await request.json<Record<string, unknown>>()', '(await request.json()) as Record<string, unknown>')
          s = s.replace('const imposter = players[bytes[0] % players.length];', 'const imposter = players[(bytes[0] ?? 0) % players.length]!;')
          s = s.replace('const active = players[roundIndex(round, players.length)];', 'const active = players[roundIndex(round, players.length)]!;')
          s = s.replace('const question = TRIVIA[room.category][state.index % TRIVIA[room.category].length];', 'const question = TRIVIA[room.category][state.index % TRIVIA[room.category].length]!;')
          s = s.replace('return getRoom(env, roomMatch[1], url.searchParams.get("playerId") ?? "");', 'return getRoom(env, roomMatch[1]!, url.searchParams.get("playerId") ?? "");')
          s = s.replace('return action(request, env, actionMatch[1]);', 'return action(request, env, actionMatch[1]!);')
          p.write_text(s)

          p = Path("mobile/src/MultiplayerGames.tsx")
          s = p.read_text().replace('useEffect, useMemo, useState', 'useEffect, useState')
          s = s.replace('  const me = room?.players.find((p) => p.id === playerId);\n', '')
          p.write_text(s)
          PY
          code=$?
          echo "$code" > /tmp/v057-harden.status
          cat /tmp/v057-harden.log
          exit 0

      - name: Apply responsive widget finishing pass
        shell: bash
        run: |
          if [ "$(cat /tmp/v057-patch.status)" != "0" ] || [ "$(cat /tmp/v057-harden.status)" != "0" ]; then
            echo 99 > /tmp/v057-responsive.status
            echo "Skipped because an earlier generation stage failed" > /tmp/v057-responsive.log
            exit 0
          fi
          set +e
          (
            python .github/scripts/post-v057-responsive.py
            python .github/scripts/fix-v057-widget-bridge.py
          ) > /tmp/v057-responsive.log 2>&1
          code=$?
          echo "$code" > /tmp/v057-responsive.status
          cat /tmp/v057-responsive.log
          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            push-server/package-lock.json

      - name: Validate mobile
        shell: bash
        run: |
          if [ "$(cat /tmp/v057-responsive.status)" != "0" ]; then
            echo 99 > /tmp/v057-mobile.status
            echo "Skipped because generation failed" > /tmp/v057-mobile.log
            exit 0
          fi
          set +e
          (
            cd mobile
            npm ci --ignore-scripts --no-audit --no-fund
            npx tsc --noEmit
          ) > /tmp/v057-mobile.log 2>&1
          code=$?
          echo "$code" > /tmp/v057-mobile.status
          tail -n 160 /tmp/v057-mobile.log
          exit 0

      - name: Validate Worker
        shell: bash
        run: |
          if [ "$(cat /tmp/v057-responsive.status)" != "0" ]; then
            echo 99 > /tmp/v057-worker.status
            echo "Skipped because generation failed" > /tmp/v057-worker.log
            exit 0
          fi
          set +e
          (
            cd push-server
            npm ci --ignore-scripts --no-audit --no-fund
            npm run typecheck
            npm test
          ) > /tmp/v057-worker.log 2>&1
          code=$?
          echo "$code" > /tmp/v057-worker.status
          tail -n 160 /tmp/v057-worker.log
          exit 0

      - name: Regenerate Android-safe Hassoun widget logo
        shell: bash
        run: |
          if [ "$(cat /tmp/v057-mobile.status)" != "0" ]; then
            echo 99 > /tmp/v057-logo.status
            echo "Skipped because mobile validation failed" > /tmp/v057-logo.log
            exit 0
          fi
          set +e
          (
            sudo apt-get update -y
            sudo apt-get install -y librsvg2-bin pngcrush
            rsvg-convert -w 512 -h 512 mobile/assets/hassoun-brand.svg -o /tmp/hassoun-widget-logo.png
            pngcrush -q -ow /tmp/hassoun-widget-logo.png
            cp /tmp/hassoun-widget-logo.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png
            file mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png
          ) > /tmp/v057-logo.log 2>&1
          code=$?
          echo "$code" > /tmp/v057-logo.status
          tail -n 80 /tmp/v057-logo.log
          exit 0

      - name: Validate Android native widgets
        shell: bash
        run: |
          if [ "$(cat /tmp/v057-logo.status)" != "0" ]; then
            echo 99 > /tmp/v057-native.status
            echo "Skipped because logo preparation failed" > /tmp/v057-native.log
            exit 0
          fi
          set +e
          (
            cd mobile
            npx expo prebuild --platform android --clean --no-install
            cd android
            ./gradlew :app:processReleaseResources :app:compileReleaseKotlin
          ) > /tmp/v057-native.log 2>&1
          code=$?
          echo "$code" > /tmp/v057-native.status
          tail -n 160 /tmp/v057-native.log
          exit 0
        env:
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}

      - name: Commit success or diagnostics
        shell: bash
        run: |
          patch="$(cat /tmp/v057-patch.status)"
          harden="$(cat /tmp/v057-harden.status)"
          responsive="$(cat /tmp/v057-responsive.status)"
          mobile="$(cat /tmp/v057-mobile.status)"
          worker="$(cat /tmp/v057-worker.status)"
          logo="$(cat /tmp/v057-logo.status)"
          native="$(cat /tmp/v057-native.status)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$patch" = 0 ] && [ "$harden" = 0 ] && [ "$responsive" = 0 ] && [ "$mobile" = 0 ] && [ "$worker" = 0 ] && [ "$logo" = 0 ] && [ "$native" = 0 ]; then
            rm -f .github/v057-last-error.log
            git add -f mobile push-server .github/v057-last-error.log 2>/dev/null || true
            git commit -m "Hassoun v0.5.7 Quran widgets multiplayer games" || exit 0
            git push origin HEAD:main
            exit 0
          fi

          {
            echo "Hassoun v0.5.7 integration failed"
            echo "patch=$patch harden=$harden responsive=$responsive mobile=$mobile worker=$worker logo=$logo native=$native"
            for name in patch harden responsive mobile worker logo native; do
              echo
              echo "===== $name ====="
              tail -n 120 "/tmp/v057-$name.log" 2>/dev/null || true
            done
          } > .github/v057-last-error.log

          git add -f .github/v057-last-error.log
          git commit -m "Record v0.5.7 integration failure"
          git push origin HEAD:main
          exit 1
