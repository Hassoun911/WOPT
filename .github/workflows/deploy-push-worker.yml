name: Deploy Hassoun Push Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "push-server/**"
      - ".github/workflows/deploy-push-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_WORKER_URL: https://wopt-prayer-push.wopt-windsor.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Worker
        run: |
          npm run typecheck
          npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote

      - name: Ensure workers.dev subdomain
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          existing="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$api")"
          current="$(printf '%s' "$existing" | jq -r 'if .success then (.result.subdomain // "") else "" end')"
          if [ -n "$current" ]; then
            echo "Workers subdomain already configured: ${current}.workers.dev"
            exit 0
          fi

          for candidate in wopt-windsor wopt-f8834317 windsor-prayer-f8834317; do
            response="$(curl -sS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"${candidate}\"}" \
              "$api")"
            if [ "$(printf '%s' "$response" | jq -r '.success // false')" = "true" ]; then
              echo "Workers subdomain created: ${candidate}.workers.dev"
              exit 0
            fi
          done

          echo "Unable to create a workers.dev subdomain"
          exit 1

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Install Worker secrets
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
          ADMIN_BOOTSTRAP_KEY: ${{ secrets.ADMIN_BOOTSTRAP_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          put_required_secret() {
            name="$1"
            value="$2"
            test -n "$value"
            printf '%s' "$value" | npx wrangler secret put "$name"
          }

          put_optional_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "Installed optional Worker secret: $name"
            else
              echo "Optional Worker secret not configured: $name"
            fi
          }

          put_required_secret VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          put_optional_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_optional_secret EMAIL_FROM "$EMAIL_FROM"
          put_optional_secret EMAIL_REPLY_TO "$EMAIL_REPLY_TO"
          put_optional_secret EMAIL_LINK_SECRET "$EMAIL_LINK_SECRET"
          put_optional_secret ADMIN_BOOTSTRAP_KEY "$ADMIN_BOOTSTRAP_KEY"
          put_optional_secret EXPO_ACCESS_TOKEN "$EXPO_ACCESS_TOKEN"

      - name: Smoke test Worker
        run: |
          set -euo pipefail

          health_ok=false
          for attempt in $(seq 1 10); do
            if curl -fsS "${PUSH_WORKER_URL}/health" -o /tmp/health.json \
              && jq -e '.ok == true and .service == "wopt-prayer-push"' /tmp/health.json >/dev/null; then
              health_ok=true
              break
            fi
            sleep 2
          done
          test "$health_ok" = true

          config_ok=false
          for attempt in $(seq 1 15); do
            if curl -fsS "${PUSH_WORKER_URL}/config" -o /tmp/config.json \
              && jq -e '.vapidPublicKey | type == "string" and length > 40' /tmp/config.json >/dev/null \
              && jq -e '.emailSignup == true and .automaticLocation == true' /tmp/config.json >/dev/null; then
              config_ok=true
              break
            fi
            echo "Waiting for latest Worker config to propagate (${attempt}/15)…"
            sleep 2
          done
          test "$config_ok" = true

          echo "Worker health, push, and email-signup config checks passed."
          jq '{emailDeliveryConfigured}' /tmp/config.json
