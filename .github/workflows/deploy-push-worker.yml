# Deploy Hassoun Worker with prayer alerts, support, multiplayer games, and native Android FCM
name: Deploy Hassoun Push Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "push-server/**"
      - ".github/workflows/deploy-push-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_WORKER_URL: https://wopt-prayer-push.wopt-windsor.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply native Android FCM routing patch
        run: node scripts/apply-native-fcm-routing.mjs

      - name: Apply CRM push campaign actions
        run: node scripts/apply-crm-push-actions.mjs

      - name: Align Email Center sponsor-logo schema with production
        run: node scripts/fix-email-logo-column.mjs

      - name: Finalize mixed bilingual email rendering
        run: node scripts/fix-bilingual-email-mix.mjs

      - name: Wire finite games v2 and CRM routes
        run: node scripts/apply-games-v2-routing.mjs

      - name: Apply smart mosque schedule parser
        run: node scripts/apply-smart-masjid-schedule-parser.mjs

      - name: Apply robust schedule text decoding and fallback
        run: node scripts/fix-schedule-text-decoding.mjs

      - name: Normalize generated TypeScript compatibility
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/masjidDisplays.ts';
          let s = fs.readFileSync(p, 'utf8');

          const oldBlob = 'blob:new Blob([bytes],{type:mimeType||"application/octet-stream"})';
          const newBlob = 'blob:new Blob([bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength) as ArrayBuffer],{type:mimeType||"application/octet-stream"})';
          if (s.includes(oldBlob)) s = s.replace(oldBlob, newBlob);

          // The loose prayer parser indexes a five-item time array. Make every access
          // explicitly string-safe so strict TypeScript accepts the generated code.
          s = s.replace(/prayerClock\(vals\[(\d)\],/g, "prayerClock(vals[$1]||'',");
          s = s.replace(/\/SUNSET\/i\.test\(vals\[(\d)\]\)/g, "/SUNSET/i.test(vals[$1]||'')");

          fs.writeFileSync(p, s);
          console.log('Normalized generated Worker TypeScript compatibility.');
          NODE

      - name: Validate Worker
        run: |
          npm run typecheck
          npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote

      - name: Ensure workers.dev subdomain
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          existing="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$api")"
          current="$(printf '%s' "$existing" | jq -r 'if .success then (.result.subdomain // "") else "" end')"
          if [ -n "$current" ]; then
            echo "Workers subdomain already configured: ${current}.workers.dev"
            exit 0
          fi

          for candidate in wopt-windsor wopt-f8834317 windsor-prayer-f8834317; do
            response="$(curl -sS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"${candidate}\"}" \
              "$api")"
            if [ "$(printf '%s' "$response" | jq -r '.success // false')" = "true" ]; then
              echo "Workers subdomain created: ${candidate}.workers.dev"
              exit 0
            fi
          done
          echo "Unable to create a workers.dev subdomain"
          exit 1

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Install Worker secrets
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
          ADMIN_BOOTSTRAP_KEY: ${{ secrets.ADMIN_BOOTSTRAP_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          put_required_secret() { name="$1"; value="$2"; test -n "$value"; printf '%s' "$value" | npx wrangler secret put "$name"; }
          put_optional_secret() { name="$1"; value="$2"; if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name"; echo "Installed optional Worker secret: $name"; else echo "Optional Worker secret not configured: $name"; fi; }
          put_required_secret VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          put_optional_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_optional_secret EMAIL_FROM "$EMAIL_FROM"
          put_optional_secret EMAIL_REPLY_TO "$EMAIL_REPLY_TO"
          put_optional_secret EMAIL_LINK_SECRET "$EMAIL_LINK_SECRET"
          put_optional_secret ADMIN_BOOTSTRAP_KEY "$ADMIN_BOOTSTRAP_KEY"
          put_optional_secret EXPO_ACCESS_TOKEN "$EXPO_ACCESS_TOKEN"
          put_optional_secret FIREBASE_SERVICE_ACCOUNT_JSON "$FIREBASE_SERVICE_ACCOUNT_JSON"

      - name: Smoke test Worker and prayer schedule AI routes
        run: |
          set -euo pipefail
          health_ok=false
          for attempt in $(seq 1 10); do
            if curl -fsS "${PUSH_WORKER_URL}/health" -o /tmp/health.json && jq -e '.ok == true and .service == "wopt-prayer-push"' /tmp/health.json >/dev/null; then health_ok=true; break; fi
            sleep 2
          done
          test "$health_ok" = true

          config_ok=false
          for attempt in $(seq 1 15); do
            if curl -fsS "${PUSH_WORKER_URL}/config" -o /tmp/config.json && jq -e '.vapidPublicKey | type == "string" and length > 40' /tmp/config.json >/dev/null && jq -e '.emailSignup == true and .automaticLocation == true' /tmp/config.json >/dev/null; then config_ok=true; break; fi
            echo "Waiting for latest Worker config to propagate (${attempt}/15)…"
            sleep 2
          done
          test "$config_ok" = true

          # These protected AI routes must exist after deploy. Without auth they should reject,
          # but they must never return 404 Not found.
          file_code="$(curl -sS -o /tmp/schedule-file-route.json -w '%{http_code}' -X POST "${PUSH_WORKER_URL}/masjid-displays/ai/schedule-import" -H 'Content-Type: application/json' --data '{}')"
          text_code="$(curl -sS -o /tmp/schedule-text-route.json -w '%{http_code}' -X POST "${PUSH_WORKER_URL}/masjid-displays/ai/schedule-text" -H 'Content-Type: application/json' --data '{}')"
          test "$file_code" != "404"
          test "$text_code" != "404"
          echo "Schedule AI routes are live: file=${file_code}, text=${text_code}"

          player_id="smoke_$(date +%s)_$RANDOM"
          games_ok=false
          for attempt in $(seq 1 10); do
            http_code="$(curl -sS -o /tmp/game-room.json -w '%{http_code}' -X POST "${PUSH_WORKER_URL}/games/rooms" -H 'Content-Type: application/json' --data "{\"playerId\":\"${player_id}\",\"playerName\":\"Smoke Test\",\"gameType\":\"wordrace\",\"category\":\"general\"}")"
            if [ "$http_code" = "200" ] && jq -e '.room.code | type == "string" and length == 6' /tmp/game-room.json >/dev/null && jq -e '.room.gameType == "wordrace" and .room.category == "general"' /tmp/game-room.json >/dev/null; then games_ok=true; break; fi
            sleep 2
          done
          test "$games_ok" = true

      - name: Record multiplayer backend ready
        working-directory: .
        run: |
          code="$(jq -r '.room.code' /tmp/game-room.json)"
          cat > .github/games-backend-status.txt <<EOF
          games_backend=ready
          worker=https://wopt-prayer-push.wopt-windsor.workers.dev
          verified_game=wordrace
          verified_room_code=${code}
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_commit=$(git rev-parse HEAD)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Hassoun911@users.noreply.github.com"
          git add .github/games-backend-status.txt
          git commit -m "Record Hassoun multiplayer backend ready" || true
          git push origin HEAD:main || true

# Redeploy marker: Email Center backend fix must be published to the live Worker.
