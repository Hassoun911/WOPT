# Deploy Hassoun Worker with prayer alerts, support, multiplayer games, Admin CRM, and Wall Remote
name: Deploy Hassoun Push Worker

on:
  workflow_dispatch:
  push:
    branches: [work/hassoun-1.0-store-admin, release/v1.0.13-tablet-wall-display]
    paths:
      - "push-server/**"
      - ".github/workflows/deploy-push-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_WORKER_URL: https://wopt-prayer-push.wopt-windsor.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply smart wall remote routes
        run: node scripts/apply-wall-remote.mjs

      - name: Validate Worker
        run: |
          npm run typecheck
          npm test
          grep -q '/wall/display/register' src/index.ts
          grep -q '/wall/controller/pair' src/index.ts

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote

      - name: Ensure workers.dev subdomain
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          existing="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$api")"
          current="$(printf '%s' "$existing" | jq -r 'if .success then (.result.subdomain // "") else "" end')"
          if [ -n "$current" ]; then
            echo "Workers subdomain already configured: ${current}.workers.dev"
            exit 0
          fi

          for candidate in wopt-windsor wopt-f8834317 windsor-prayer-f8834317; do
            response="$(curl -sS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"${candidate}\"}" \
              "$api")"
            if [ "$(printf '%s' "$response" | jq -r '.success // false')" = "true" ]; then
              echo "Workers subdomain created: ${candidate}.workers.dev"
              exit 0
            fi
          done

          echo "Unable to create a workers.dev subdomain"
          exit 1

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Install Worker secrets
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_LINK_SECRET: ${{ secrets.EMAIL_LINK_SECRET }}
          ADMIN_BOOTSTRAP_KEY: ${{ secrets.ADMIN_BOOTSTRAP_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          put_required_secret() {
            name="$1"
            value="$2"
            test -n "$value"
            printf '%s' "$value" | npx wrangler secret put "$name"
          }

          put_optional_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "Installed optional Worker secret: $name"
            else
              echo "Optional Worker secret not configured: $name"
            fi
          }

          put_required_secret VAPID_PRIVATE_KEY "$VAPID_PRIVATE_KEY"
          put_optional_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_optional_secret EMAIL_REPLY_TO "$EMAIL_REPLY_TO"
          put_optional_secret EMAIL_LINK_SECRET "$EMAIL_LINK_SECRET"
          put_optional_secret ADMIN_BOOTSTRAP_KEY "$ADMIN_BOOTSTRAP_KEY"
          put_optional_secret EXPO_ACCESS_TOKEN "$EXPO_ACCESS_TOKEN"

      - name: Smoke test Worker, wall remote, GPS prayer API, activity, CRM runtime, and multiplayer
        run: |
          set -euo pipefail

          for attempt in $(seq 1 15); do
            if curl -fsS "${PUSH_WORKER_URL}/health" -o /tmp/health.json \
              && jq -e '.ok == true and .service == "wopt-prayer-push"' /tmp/health.json >/dev/null; then
              break
            fi
            test "$attempt" -lt 15
            sleep 2
          done

          wall_installation="wallsmoke$(date +%s)$RANDOM"
          curl -fsS -X POST "${PUSH_WORKER_URL}/wall/display/register" \
            -H 'Content-Type: application/json' \
            --data "{\"installationId\":\"${wall_installation}\",\"name\":\"Smoke Wall\",\"settings\":{\"ramadanMode\":true}}" \
            -o /tmp/wall-register.json
          jq -e '.ok == true and (.deviceToken | length == 64) and (.pairingCode | length == 6)' /tmp/wall-register.json >/dev/null
          wall_pair="$(jq -r '.pairingCode' /tmp/wall-register.json)"
          controller_installation="controllersmoke$(date +%s)$RANDOM"
          curl -fsS -X POST "${PUSH_WORKER_URL}/wall/controller/pair" \
            -H 'Content-Type: application/json' \
            --data "{\"pairingCode\":\"${wall_pair}\",\"controllerInstallationId\":\"${controller_installation}\",\"controllerName\":\"Smoke Controller\"}" \
            -o /tmp/wall-pair.json
          jq -e '.ok == true and (.controllerToken | length == 64)' /tmp/wall-pair.json >/dev/null
          controller_token="$(jq -r '.controllerToken' /tmp/wall-pair.json)"
          curl -fsS "${PUSH_WORKER_URL}/wall/controller/state" \
            -H "Authorization: Bearer ${controller_token}" \
            -o /tmp/wall-state.json
          jq -e '.ok == true and .display.settings.ramadanMode == true' /tmp/wall-state.json >/dev/null

          curl -fsS "${PUSH_WORKER_URL}/prayer-times?lat=42.3149&lng=-83.0364&timezone=America%2FToronto&year=2026&month=8" -o /tmp/windsor-prayers.json
          jq -e '.source == "windsor_islamic_association" and (.prayer_times | type == "object") and (.prayer_times | length > 0)' /tmp/windsor-prayers.json >/dev/null

          curl -fsS "${PUSH_WORKER_URL}/prayer-times?lat=43.6532&lng=-79.3832&timezone=America%2FToronto&year=2026&month=8" -o /tmp/global-prayers.json
          jq -e '.source == "aladhan" and (.prayer_times | type == "object") and (.prayer_times | length > 0)' /tmp/global-prayers.json >/dev/null

          activity_installation="smokeactivity$(date +%s)$RANDOM"
          curl -fsS -X POST "${PUSH_WORKER_URL}/activity" \
            -H 'Content-Type: application/json' \
            --data "{\"installationId\":\"${activity_installation}\",\"activity\":\"app_open\",\"platform\":\"smoke\"}" \
            -o /tmp/activity.json
          jq -e '.ok == true' /tmp/activity.json >/dev/null

          for attempt in $(seq 1 15); do
            if curl -fsS "${PUSH_WORKER_URL}/app/runtime" -o /tmp/runtime.json \
              && jq -e '.ok == true and (.settings | type == "object")' /tmp/runtime.json >/dev/null; then
              break
            fi
            test "$attempt" -lt 15
            sleep 2
          done

          player_id="smoke_$(date +%s)_$RANDOM"
          for attempt in $(seq 1 10); do
            http_code="$(curl -sS -o /tmp/game-room.json -w '%{http_code}' \
              -X POST "${PUSH_WORKER_URL}/games/rooms" \
              -H 'Content-Type: application/json' \
              --data "{\"playerId\":\"${player_id}\",\"playerName\":\"Smoke Test\",\"gameType\":\"trivia\",\"category\":\"islamic\"}")"
            if [ "$http_code" = "200" ] \
              && jq -e '.room.code | type == "string" and length == 6' /tmp/game-room.json >/dev/null; then
              break
            fi
            test "$attempt" -lt 10
            sleep 2
          done

          echo "Worker, secure wall remote, GPS prayer API, activity API, Admin CRM runtime, D1 migrations, and multiplayer endpoint passed."

      - name: Record backend verification on current branch
        working-directory: .
        run: |
          code="$(jq -r '.room.code' /tmp/game-room.json)"
          backend_version="$(jq -r '.backendVersion // "unknown"' /tmp/health.json)"
          cat > .github/games-backend-status.txt <<EOF
          games_backend=ready
          crm_runtime=ready
          gps_prayer_api=ready
          activity_api=ready
          wall_remote=ready
          worker=https://wopt-prayer-push.wopt-windsor.workers.dev
          backend_version=${backend_version}
          verified_room_code=${code}
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          source_commit=$(git rev-parse HEAD)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/games-backend-status.txt
          git commit -m "Record Hassoun backend verification" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
