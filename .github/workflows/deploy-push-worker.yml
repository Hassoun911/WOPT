name: Deploy WOPT Push Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUSH_WORKER_URL: https://wopt-prayer-push.wopt-windsor.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Worker
        run: |
          npm run typecheck
          npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply wopt-prayer-push --remote

      - name: Ensure workers.dev subdomain
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          existing="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$api")"
          current="$(printf '%s' "$existing" | jq -r 'if .success then (.result.subdomain // "") else "" end')"
          if [ -n "$current" ]; then
            echo "Workers subdomain already configured: ${current}.workers.dev"
            exit 0
          fi

          for candidate in wopt-windsor wopt-f8834317 windsor-prayer-f8834317; do
            response="$(curl -sS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"${candidate}\"}" \
              "$api")"
            if [ "$(printf '%s' "$response" | jq -r '.success // false')" = "true" ]; then
              echo "Workers subdomain created: ${candidate}.workers.dev"
              exit 0
            fi
          done

          echo "Unable to create a workers.dev subdomain"
          exit 1

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Install VAPID private key
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          test -n "$VAPID_PRIVATE_KEY"
          printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY

      - name: Smoke test Worker
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${PUSH_WORKER_URL}/health" -o /tmp/health.json; then
              break
            fi
            sleep 2
          done
          jq -e '.ok == true and .service == "wopt-prayer-push"' /tmp/health.json
          curl -fsS "${PUSH_WORKER_URL}/config" -o /tmp/config.json
          jq -e '.vapidPublicKey | type == "string" and length > 40' /tmp/config.json
          echo "Worker health and VAPID config checks passed."
