name: Fix Prayer Email Catch-up Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-prayer-email-catchup-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make prayer email scheduling resilient to delayed cron runs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('push-server/src/globalPrayerEmail.ts')
          s=p.read_text()
          old='function sameMinute(leftMs: number, rightMs: number) { return Math.floor(leftMs / 60_000) === Math.floor(rightMs / 60_000); }'
          new='''const EMAIL_CATCHUP_MINUTES = 5;\nfunction dueWithinCatchupWindow(targetMs: number, scheduledTime: number) {\n  const targetMinute = Math.floor(targetMs / 60_000);\n  const scheduledMinute = Math.floor(scheduledTime / 60_000);\n  const ageMinutes = scheduledMinute - targetMinute;\n  return ageMinutes >= 0 && ageMinutes <= EMAIL_CATCHUP_MINUTES;\n}'''
          if old not in s:
              raise SystemExit('sameMinute helper not found')
          s=s.replace(old,new,1)
          old2='if (!sameMinute(targetMs, scheduledTime)) continue;'
          new2='if (!dueWithinCatchupWindow(targetMs, scheduledTime)) continue;'
          if old2 not in s:
              raise SystemExit('exact-minute check not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          grep -q 'EMAIL_CATCHUP_MINUTES = 5' push-server/src/globalPrayerEmail.ts
          grep -q 'dueWithinCatchupWindow(targetMs, scheduledTime)' push-server/src/globalPrayerEmail.ts
      - name: Typecheck Worker
        working-directory: push-server
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
      - name: Commit fix
        run: |
          git config user.name 'Hassoun911'
          git config user.email '65694110+Hassoun911@users.noreply.github.com'
          git add push-server/src/globalPrayerEmail.ts
          if git diff --cached --quiet; then
            echo 'Prayer email catch-up fix already present.'
            exit 0
          fi
          git commit -m 'Make prayer email scheduler catch up missed cron minutes'
          git push origin main
