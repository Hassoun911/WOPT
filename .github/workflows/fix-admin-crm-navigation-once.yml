name: Fix Admin CRM Navigation Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-crm-navigation-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair CRM routes and clickable dashboard cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('admin-crm/app/CrmDashboard.tsx')
          s = p.read_text()
          s = s.replace('export default function CrmDashboard() {', 'export default function CrmDashboard({ initialView = "dashboard" }: { initialView?: View }) {', 1)
          s = s.replace('const [view, setView] = useState<View>("dashboard");', 'const [view, setView] = useState<View>(initialView);', 1)
          anchor = '  useEffect(() => { const saved = window.localStorage.getItem(TOKEN_KEY);'
          sync = '  useEffect(() => { setView(initialView); }, [initialView]);\n'
          if sync.strip() not in s:
              if anchor not in s: raise SystemExit('Could not find CRM initialization anchor')
              s = s.replace(anchor, sync + anchor, 1)

          old = '[["Active subscribers", dashboard.subscribers?.active || 0, "👥"],["Push devices",dashboard.devices?.active || 0,"📱"],["Android",dashboard.devices?.android || 0,"🤖"],["iOS",dashboard.devices?.ios || 0,"🍎"],["Published content",crm.content?.published || 0,"📖"],["Admins",crm.admins?.active || 0,"🔐"],["Audit events",crm.audit?.total || 0,"🧾"]].map(([label,value,emoji]) => <div key={String(label)} style={s.stat}><span style={{fontSize:20}}>{emoji}</span><strong style={s.statValue}>{value}</strong><span style={s.statLabel}>{label}</span></div>)'
          new = '[["Active subscribers", dashboard.subscribers?.active || 0, "👥", "/admin/users"],["Push devices",dashboard.devices?.active || 0,"📱","/admin/push"],["Android",dashboard.devices?.android || 0,"🤖","/admin/push"],["iOS",dashboard.devices?.ios || 0,"🍎","/admin/push"],["Published content",crm.content?.published || 0,"📖","/admin/quran"],["Admins",crm.admins?.active || 0,"🔐","team"],["Audit events",crm.audit?.total || 0,"🧾","audit"]].map(([label,value,emoji,target]) => <button type="button" key={String(label)} style={{...s.stat,cursor:"pointer",textAlign:"left",font:"inherit",width:"100%"}} onClick={() => String(target).startsWith("/") ? window.location.assign(String(target)) : setView(target as View)} title={`Open ${label}`}><span style={{fontSize:20}}>{emoji}</span><strong style={s.statValue}>{value}</strong><span style={s.statLabel}>{label}</span></button>)'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not find dashboard stat cards')
          p.write_text(s)

          page_tpl = 'import CrmDashboard from "../../CrmDashboard";\nimport PasswordResetLink from "../../PasswordResetLink";\n\nexport default function Page() { return <><CrmDashboard initialView="VIEW" /><PasswordResetLink /></>; }\n'
          for route, view in [('quran','content'), ('push','push'), ('settings','control')]:
              out = Path(f'admin-crm/app/admin/{route}/page.tsx')
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(page_tpl.replace('VIEW', view))

          support_src = '"use client";\nimport { useEffect, useState } from "react";\nconst API="https://wopt-prayer-push.wopt-windsor.workers.dev"; const TOKEN_KEY="wopt:admin-token:v1";\ntype Contact={public_id?:string;name?:string|null;email:string;subject?:string|null;message?:string|null;platform?:string|null;status?:string|null;created_at?:string|null};\nexport default function Page(){const[rows,setRows]=useState<Contact[]>([]);const[error,setError]=useState("");useEffect(()=>{const token=localStorage.getItem(TOKEN_KEY);if(!token){location.replace("/admin/");return;}fetch(`${API}/admin/support/contacts?limit=200`,{headers:{Authorization:`Bearer ${token}`}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to load support");return d}).then(d=>setRows(d.contacts||[])).catch(e=>setError(String(e.message||e)));},[]);return <main style={{minHeight:"100vh",background:"#f6f3e9",padding:28,color:"#163f35",fontFamily:"system-ui,sans-serif"}}><div style={{maxWidth:1250,margin:"0 auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:12,fontWeight:800,letterSpacing:2,color:"#08765d"}}>HASSOUN ADMIN</div><h1>Support</h1></div><a href="/admin/" style={{color:"#163f35",fontWeight:800}}>← Dashboard</a></div>{error?<p style={{color:"#9c2626"}}>{error}</p>:null}<div style={{display:"grid",gap:12}}>{rows.map((x,i)=><article key={x.public_id||i} style={{background:"white",border:"1px solid #d7dfd9",borderRadius:14,padding:16}}><strong>{x.subject||"Support message"}</strong><div style={{fontSize:13,opacity:.7,marginTop:4}}>{x.name||x.email} · {x.email} · {x.platform||"unknown"}</div><p>{x.message||"—"}</p><div style={{fontSize:12,opacity:.7}}>{x.status||"new"}{x.created_at?` · ${new Date(x.created_at).toLocaleString()}`:""}</div></article>)}</div>{!rows.length&&!error?<p>No support messages yet.</p>:null}</div></main>}\n'
          support = Path('admin-crm/app/admin/support/page.tsx')
          support.parent.mkdir(parents=True, exist_ok=True)
          support.write_text(support_src)

          Path('admin-crm/.vercel-force-navigation-fix-20260825.txt').write_text('CRM missing routes and dashboard cards fixed\n')
          PY
          git diff --check

      - name: Build admin CRM
        working-directory: admin-crm
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Commit repair to CRM source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-crm
          git commit -m "Fix admin CRM missing pages and clickable dashboard cards"
          git push origin HEAD:work/hassoun-1.0-store-admin
