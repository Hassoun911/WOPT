name: Wire User 360 link once
on:
  push:
    branches: [work/hassoun-1.0-store-admin]
permissions:
  contents: write
jobs:
  wire:
    if: github.event.head_commit.message != 'Link CRM Users to User 360 control center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch CRM users view
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin-crm/app/CrmDashboard.tsx')
          s = p.read_text()
          old = '{view === "subscribers" ? <section><Title eyebrow="USER & SUBSCRIBER CONTROL" title="Users" />\n      <div style={s.filters}>'
          new = '{view === "subscribers" ? <section><Title eyebrow="USER & SUBSCRIBER CONTROL" title="Users" />\n      <div style={{ ...s.panel, marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}><div><strong>Full User 360 Control</strong><div style={s.subtle}>Manage GPS, timezone, prayer source, email preferences, linked devices, push settings and real activity history.</div></div><a href="/admin/users" style={s.primary}>Open User Control Center</a></div>\n      <div style={s.filters}>'
          if 'Open User Control Center' not in s:
              if old not in s: raise SystemExit('users view anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- admin-crm/app/CrmDashboard.tsx; then exit 0; fi
          git add admin-crm/app/CrmDashboard.tsx
          git commit -m "Link CRM Users to User 360 control center"
          git pull --rebase origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
