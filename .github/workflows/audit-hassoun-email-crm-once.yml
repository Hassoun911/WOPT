name: Audit Hassoun Email CRM Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-hassoun-email-crm-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: push-server
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit tables and counts without private data
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND (lower(name) LIKE '%email%' OR lower(name) LIKE '%subscr%' OR lower(name) LIKE '%user%' OR lower(name) LIKE '%contact%') ORDER BY name;" > /tmp/tables.json
          out="$GITHUB_WORKSPACE/.github/email-crm-audit.txt"
          {
            echo "Hassoun email CRM live D1 audit"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_commit=$(git rev-parse HEAD)"
            echo
          } > "$out"
          for table in $(jq -r '.[0].results[].name' /tmp/tables.json); do
            count=$(npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT COUNT(*) AS n FROM \"$table\";" | jq -r '.[0].results[0].n')
            cols=$(npx wrangler d1 execute wopt-prayer-push --remote --json --command "PRAGMA table_info(\"$table\");" | jq -r '.[0].results | map(.name) | join(", ")')
            echo "$table|rows=$count|columns=$cols" >> "$out"
          done
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Save audit result
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/email-crm-audit.txt
          git commit -m "Record Hassoun email CRM live audit" || true
          git push origin HEAD:main || true
