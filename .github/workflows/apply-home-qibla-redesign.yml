name: Apply Hassoun Home Qibla Redesign

on:
  push:
    paths:
      - '.github/scripts/apply-home-qibla-redesign.py'
      - '.github/workflows/apply-home-qibla-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply redesign patch
        run: python .github/scripts/apply-home-qibla-redesign.py

      - name: Commit integrated app screen
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/App.tsx
          git commit -m "Integrate redesigned prayer home and Qibla screen"
          git push origin main
