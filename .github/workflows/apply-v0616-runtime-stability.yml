name: Apply v0.6.17 Continuous Quran Scrolling
# trigger continuous scrolling final

on:
  push:
    paths:
      - '.github/workflows/apply-v0616-runtime-stability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enable automatic previous and next page scrolling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          quran = Path('mobile/src/quran/QuranV3.tsx')
          text = quran.read_text(encoding='utf-8')

          if 'readerScrollDirection' not in text:
              old = '''  const readerViewportHeight = useRef(0);\n  const readerContentHeight = useRef(0);'''
              new = '''  const readerViewportHeight = useRef(0);\n  const readerContentHeight = useRef(0);\n  const readerLastScrollY = useRef(0);\n  const readerScrollDirection = useRef<"up" | "down" | null>(null);'''
              if old not in text: raise SystemExit('reader refs block missing')
              text = text.replace(old, new, 1)

          if 'onScrollEndDrag={() =>' not in text:
              old = '''            onScroll={({ nativeEvent }) => {\n              readerViewportHeight.current = nativeEvent.layoutMeasurement.height;\n              readerContentHeight.current = nativeEvent.contentSize.height;\n              readerAtTop.current = nativeEvent.contentOffset.y <= 8;\n              readerAtBottom.current = nativeEvent.contentOffset.y + nativeEvent.layoutMeasurement.height >= nativeEvent.contentSize.height - 8;\n            }}'''
              new = '''            onScroll={({ nativeEvent }) => {\n              readerViewportHeight.current = nativeEvent.layoutMeasurement.height;\n              readerContentHeight.current = nativeEvent.contentSize.height;\n              const y = nativeEvent.contentOffset.y;\n              if (y > readerLastScrollY.current + 1) readerScrollDirection.current = "down";\n              else if (y < readerLastScrollY.current - 1) readerScrollDirection.current = "up";\n              readerLastScrollY.current = y;\n              readerAtTop.current = y <= 8;\n              readerAtBottom.current = y + nativeEvent.layoutMeasurement.height >= nativeEvent.contentSize.height - 8;\n            }}\n            onScrollEndDrag={() => {\n              const contentFits = readerContentHeight.current <= readerViewportHeight.current + 12;\n              if (readerScrollDirection.current === "down" && (readerAtBottom.current || contentFits)) {\n                turnReaderPage(1);\n              } else if (readerScrollDirection.current === "up" && (readerAtTop.current || contentFits)) {\n                turnReaderPage(-1);\n              }\n              readerScrollDirection.current = null;\n            }}'''
              if old not in text: raise SystemExit('reader scroll block missing')
              text = text.replace(old, new, 1)

          quran.write_text(text, encoding='utf-8')

          rendering = Path('mobile/src/quran/quranRendering.tsx')
          rtext = rendering.read_text(encoding='utf-8')
          old = 'setAppearanceState({ ...DEFAULT_QURAN_APPEARANCE, ...parsed });'
          new = 'setAppearanceState({ ...DEFAULT_QURAN_APPEARANCE, ...parsed, browseMode: "vertical" });'
          if old in rtext:
              rtext = rtext.replace(old, new, 1)
              rendering.write_text(rtext, encoding='utf-8')
          PY

      - name: Validate TypeScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'readerScrollDirection' mobile/src/quran/QuranV3.tsx
          grep -q 'onScrollEndDrag' mobile/src/quran/QuranV3.tsx
          grep -q 'browseMode: "vertical"' mobile/src/quran/quranRendering.tsx
          cd mobile
          npm ci --include=dev --no-audit --no-fund
          npm install --no-save --no-package-lock @typescript/typescript-linux-x64@7.0.2 expo-font
          npx tsc --noEmit

      - name: Commit scrolling fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/quran/QuranV3.tsx mobile/src/quran/quranRendering.tsx
          git commit -m "Enable continuous Quran page scrolling v0.6.17" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
