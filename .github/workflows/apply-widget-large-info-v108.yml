name: Apply premium large widget layout

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin
    paths:
      - '.github/scripts/apply-widget-large-info-v108.py'
      - '.github/workflows/apply-widget-large-info-v108.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm premium widget layout is applied
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          xml_path = Path('mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml')
          kt_path = Path('mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt')
          ET.parse(xml_path)
          xml = xml_path.read_text(encoding='utf-8')
          kt = kt_path.read_text(encoding='utf-8')

          required_xml = [
              'widget_following_icon',
              'widget_following_name',
              'widget_following_time',
              'widget_following_countdown',
              'android:layout_width="56dp"',
              'android:textSize="46sp"',
          ]
          required_kt = [
              'findFollowingPrayer',
              'countdownTextColor',
              'views.setTextColor(R.id.widget_countdown, countdownTextColor)',
              'views.setTextColor(R.id.widget_following_countdown, countdownTextColor)',
              '"xlarge" -> 46f',
              '"xlarge" -> 48f',
          ]

          missing = [x for x in required_xml if x not in xml] + [x for x in required_kt if x not in kt]
          if missing:
              raise SystemExit('Premium widget markers missing: ' + ', '.join(missing))

          print('Premium bilingual widget is already applied; no destructive re-patch needed.')
          PY

      - name: Validate countdown color scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt').read_text(encoding='utf-8')
          assert p.count('val countdownTextColor =') == 1
          assert p.index('val countdownTextColor =') < p.index('if (showCountdown) {')
          print('Countdown timer color is scoped correctly.')
          PY

      - name: No-op commit check
        run: |
          TARGET_XML='mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml'
          TARGET_KT='mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt'
          if git diff --quiet -- "$TARGET_XML" "$TARGET_KT"; then
            echo 'Widget source is already committed. Nothing to persist.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f -- "$TARGET_XML" "$TARGET_KT"
            git commit -m 'Persist premium prayer widget layout'
            git push origin HEAD:work/hassoun-1.0-store-admin
          fi
