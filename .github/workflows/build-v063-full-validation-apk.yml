name: Build Hassoun v0.6.3 Fully Validated APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v063-trigger.txt"

permissions:
  contents: write

concurrency:
  group: hassoun-v063-full-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply retained v0.6.2 fixes
        id: v062
        run: python .github/scripts/apply-v062-final.py

      - name: Apply v0.6.3 smart alerts
        id: v063
        run: python .github/scripts/apply-v063-smart-alerts.py

      - name: Verify every requested Hassoun feature in source
        id: sourcecheck
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "0.6.3"' mobile/app.config.ts
          grep -q 'versionCode: 35' mobile/app.config.ts

          # Samsung / Android 16 widgets: Home provider and transparent keyguard provider are separated.
          grep -q 'widgetCategory="home_screen"' mobile/modules/hassoun-widget/android/src/main/res/xml-v36/hassoun_prayer_widget_info.xml
          grep -q 'initialLayout="@layout/hassoun_prayer_widget_slim"' mobile/modules/hassoun-widget/android/src/main/res/xml-v36/hassoun_prayer_widget_info.xml
          grep -q 'widgetCategory="keyguard"' mobile/modules/hassoun-widget/android/src/main/res/xml-v36/hassoun_lock_widget_info.xml
          ! grep -q 'home_screen|keyguard' mobile/modules/hassoun-widget/android/src/main/res/xml-v36/hassoun_lock_widget_info.xml
          grep -q 'getAppWidgetIds(lock).forEach { updateWidget(context, manager, it, false) }' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'countdownStyleV061Migrated' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'android:layout_width="92dp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml
          grep -q 'android:layout_height="92dp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml

          # Islamic Events page and 15-day reminders.
          grep -q 'islamicToJulianDay' mobile/src/islamicEvents.ts
          grep -q 'islamicDateLabelForEvent' mobile/src/IslamicEventsPage.tsx
          grep -q 'scheduleIslamicEventReminders' mobile/App.tsx
          grep -q 'upcomingIslamicDays <= 15' mobile/App.tsx
          grep -q 'upcomingEvent' push-server/src/prayerEmailTemplate.ts

          # Exact Hassoun logo branding instead of random page branding.
          grep -q 'BrandMark' mobile/src/MultiplayerGames.tsx
          grep -q 'BrandMark' mobile/src/EmailSignupCard.tsx
          grep -q 'BrandMark' mobile/src/quran/SmartMemorize.tsx
          grep -q 'BrandMark' mobile/src/quran/QuranV3.tsx
          grep -q 'BrandMark' mobile/src/QuizGamesHub.tsx
          grep -q 'BrandMark' mobile/src/IslamicQuiz.tsx
          grep -q 'BrandMark' mobile/src/SettingsHub.tsx
          grep -q 'BrandMark' mobile/src/IslamicEventsPage.tsx
          grep -q 'heroLogoShell' mobile/App.tsx
          grep -q '<BrandMark size={70} />' mobile/AppWithEmail.tsx
          grep -q 'notification-icon.png' mobile/app.config.ts
          grep -q 'hassoun911.github.io/WOPT/assets/hassoun-logo.png' push-server/src/prayerEmailTemplate.ts

          # Smart per-user phone alert controls.
          grep -q 'phonePrayerAlerts' mobile/src/config.ts
          grep -q 'PrayerAlertPreferenceGrid' mobile/App.tsx
          grep -q 'updatePhoneAlertPreferences' mobile/App.tsx
          grep -q 'Tap any prayer to mute or unmute its Adhan audio' mobile/App.tsx
          grep -q 'const muted = !phoneAlertPreferences\[prayer\].athan;' mobile/App.tsx
          grep -q 'eventEnabled(event, preferences)' mobile/src/notifications.ts
          grep -q 'preferences\[event.prayer\]?.athan === true' mobile/src/prayerAudio.ts
          grep -q 'Stop all' mobile/src/PrayerAlertPreferenceGrid.tsx
          grep -q '20 min only' mobile/src/PrayerAlertPreferenceGrid.tsx
          grep -q '10 min only' mobile/src/PrayerAlertPreferenceGrid.tsx
          grep -q 'Adhan only' mobile/src/PrayerAlertPreferenceGrid.tsx

          # Smart per-user email controls + backend storage.
          grep -q 'Email alerts, your way' mobile/src/EmailSignupCard.tsx
          grep -q 'PrayerAlertPreferenceGrid' mobile/src/EmailSignupCard.tsx
          grep -q 'prayers: choices' mobile/src/emailSignup.ts
          grep -q 'subscriber_prayer_preferences' push-server/src/subscribers.ts
          grep -q 'email_twenty' push-server/src/subscribers.ts
          grep -q 'email_ten' push-server/src/subscribers.ts
          grep -q 'email_athan' push-server/src/subscribers.ts
          grep -q 'prefs\[rule.field\] !== 1' push-server/src/globalPrayerEmail.ts
          grep -q 'const LOGO =' pwa/app/email/manage/page.tsx

          # Prayer rollover and Home per-prayer Adhan control.
          grep -q 'const deltaMs = target.getTime() - now.getTime();' mobile/App.tsx
          grep -q 'seconds < 60' mobile/App.tsx

          # Qur'an navigation, text shaping, visible-page playback, multi-Surah popup, radio range.
          grep -q 'MULTI_SURAH_PLAY_CHOOSER_V061' mobile/src/quran/QuranV3.tsx
          grep -q 'Which Surah do you want to play?' mobile/src/quran/QuranV3.tsx
          grep -q 'playReaderSurahFromVisibleAyah' mobile/src/quran/QuranV3.tsx
          grep -q 'readerViewportHeight' mobile/src/quran/QuranV3.tsx
          grep -q 'Keep the exact verified page-font sequence intact' mobile/src/quran/quranRendering.tsx
          grep -q 'QuranAudio.playRange' mobile/src/quran/QuranV3.tsx

          # Games remain multiplayer-only for the new games and backend routes exist.
          grep -q 'Live Trivia' mobile/src/MultiplayerGames.tsx
          grep -q 'Imposter' mobile/src/MultiplayerGames.tsx
          grep -q 'Clue Battle' mobile/src/MultiplayerGames.tsx
          test -f push-server/src/games.ts
          grep -q '/games/' push-server/src/index.ts

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            push-server/package-lock.json
            pwa/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate mobile TypeScript
        id: mobilets
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      - name: Validate Worker typecheck and tests
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          cd push-server
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Validate PWA email management and rendered output
        id: pwa
        shell: bash
        run: |
          set -euo pipefail
          cd pwa
          npm ci --no-audit --no-fund
          npm test

      - name: Commit fully validated v0.6.3 source before Android build
        id: sourcecommit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile push-server pwa
          git commit -m "Hassoun v0.6.3 fully validated smart alerts and retained fixes" || true
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare exact Hassoun widget logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/modules/hassoun-widget/android/src/main/res/drawable
          cp mobile/assets/hassoun-logo.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Clean Expo Android prebuild
        id: prebuild
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Build native standalone release APK
        id: gradle
        timeout-minutes: 28
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/android
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Verify production JS bundle is embedded
        id: verifyapk
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" > /tmp/v063-apk.txt
          grep -E 'assets/(index\.android\.bundle|.*\.hbc)' /tmp/v063-apk.txt
          cp "$APK" mobile/android/app/build/outputs/apk/release/Hassoun-v0.6.3.apk

      - name: Upload Hassoun v0.6.3 APK
        id: uploadapk
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.6.3-fully-validated-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.6.3.apk
          if-no-files-found: error
          retention-days: 14

      - name: Record full v0.6.3 success
        if: success()
        shell: bash
        run: |
          cat > .github/v063-build-result.txt <<EOF
          status=success
          version=0.6.3
          versionCode=35
          source_checks=success
          mobile_typescript=success
          worker_tests=success
          pwa_tests=success
          expo_prebuild=success
          gradle=success
          apk_verify=success
          apk_upload=success
          widget_android16_fixed=true
          widget_home_theme_fixed=true
          widget_transparent_keyguard_only=true
          widget_center_countdown_fixed=true
          islamic_events_fixed=true
          islamic_event_15_day_system=true
          exact_logo_all_pages=true
          smart_prayer_emails=true
          phone_per_prayer_alerts=true
          email_per_prayer_alerts=true
          alert_20_10_adhan_presets=true
          stop_all_alerts=true
          home_per_prayer_adhan_mute=true
          next_prayer_rollover_fixed=true
          quran_multi_surah_popup=true
          quran_visible_playback=true
          quran_page_navigation=true
          quran_text_shaping=true
          quran_radio_range=true
          multiplayer_tests=success
          standalone=true
          js_bundle_verified=true
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          artifact=hassoun-v0.6.3-fully-validated-${{ github.run_number }}
          source_commit=${{ steps.sourcecommit.outputs.sha }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v063-build-result.txt
          git commit -m "Record Hassoun v0.6.3 fully validated APK success" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Record exact v0.6.3 failure
        if: failure()
        shell: bash
        run: |
          cat > .github/v063-build-result.txt <<EOF
          status=failure
          version=0.6.3
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          retained_v062=${{ steps.v062.outcome }}
          smart_alert_patch=${{ steps.v063.outcome }}
          sourcecheck=${{ steps.sourcecheck.outcome }}
          mobile_typescript=${{ steps.mobilets.outcome }}
          worker_validation=${{ steps.worker.outcome }}
          pwa_validation=${{ steps.pwa.outcome }}
          source_commit=${{ steps.sourcecommit.outcome }}
          expo_prebuild=${{ steps.prebuild.outcome }}
          gradle=${{ steps.gradle.outcome }}
          apk_verify=${{ steps.verifyapk.outcome }}
          apk_upload=${{ steps.uploadapk.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v063-build-result.txt
          git commit -m "Record Hassoun v0.6.3 validation/build failure" || true
          git push origin HEAD:main || true
