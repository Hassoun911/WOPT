name: Apply mobile activity tracking once

on:
  push:
    branches:
      - work/hassoun-1.0-store-admin

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Wire real activity tracking into mobile App'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - name: Patch mobile App
        shell: python
        run: |
          from pathlib import Path
          p = Path('mobile/App.tsx')
          s = p.read_text()
          old_import = 'import { badgeForWins, EMPTY_QUIZ_STATS, loadQuizStats, nextBadge, type QuizStats } from "./src/islamicQuiz";'
          new_import = old_import + '\nimport { reportHassounActivity } from "./src/activity";'
          if 'from "./src/activity"' not in s:
              if old_import not in s:
                  raise SystemExit('activity import anchor missing')
              s = s.replace(old_import, new_import, 1)
          anchor = '  const upcomingIslamicDays = islamicTimeline.daysUntilNext;\n\n  useEffect(() => {\n    if (Object.keys(prayerTimes).length) HassounWidget.syncPrayerSchedule(JSON.stringify(prayerTimes), locale);\n  }, [prayerTimes, locale]);'
          replacement = '''  const upcomingIslamicDays = islamicTimeline.daysUntilNext;\n\n  useEffect(() => {\n    void reportHassounActivity("app_open");\n  }, []);\n\n  useEffect(() => {\n    const tracked = activeTab === "quiz" ? "games" : activeTab;\n    void reportHassounActivity(tracked);\n  }, [activeTab]);\n\n  useEffect(() => {\n    if (Object.keys(prayerTimes).length) HassounWidget.syncPrayerSchedule(JSON.stringify(prayerTimes), locale);\n  }, [prayerTimes, locale]);'''
          if 'void reportHassounActivity("app_open")' not in s:
              if anchor not in s:
                  raise SystemExit('activity effect anchor missing')
              s = s.replace(anchor, replacement, 1)
          p.write_text(s)
      - name: Commit mobile activity tracking
        run: |
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          if git diff --quiet -- mobile/App.tsx; then
            echo "No App changes to commit."
            exit 0
          fi
          git add mobile/App.tsx
          git commit -m "Wire real activity tracking into mobile App"
          git push origin HEAD:work/hassoun-1.0-store-admin
