name: Apply Hassoun v0.6.15 Widget Safe Spacing

on:
  push:
    paths:
      - '.github/workflows/apply-widget-safe-spacing-v0615.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply safe spacing and readability fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          large = 'mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml'
          vertical = 'mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml'
          square = 'mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml'
          slim = 'mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml'
          provider = 'mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt'

          # LARGE 4x2 — keep everything away from rounded edges and enlarge supporting text.
          replace_once(large,
              'android:orientation="vertical" android:padding="10dp"',
              'android:orientation="vertical" android:paddingStart="14dp" android:paddingEnd="14dp" android:paddingTop="12dp" android:paddingBottom="12dp"')
          replace_once(large, 'android:layout_height="42dp" android:orientation="horizontal"', 'android:layout_height="46dp" android:orientation="horizontal"')
          replace_once(large, 'android:layout_width="38dp" android:layout_height="38dp"', 'android:layout_width="40dp" android:layout_height="40dp"')
          replace_once(large, 'android:textSize="14sp" android:letterSpacing="0.11"', 'android:textSize="15sp" android:letterSpacing="0.10"')
          replace_once(large, 'android:textSize="6.2sp" android:letterSpacing="0.08"', 'android:textSize="7sp" android:letterSpacing="0.07"')
          replace_once(large,
              '<LinearLayout android:layout_width="112dp" android:layout_height="wrap_content" android:orientation="vertical" android:gravity="end">',
              '<LinearLayout android:layout_width="132dp" android:layout_height="wrap_content" android:layout_marginEnd="6dp" android:orientation="vertical" android:gravity="end">')
          replace_once(large, 'android:textStyle="bold" android:textSize="7sp" android:maxLines="1"', 'android:textStyle="bold" android:textSize="8.5sp" android:maxLines="1"')
          replace_once(large, 'android:gravity="end" android:textSize="6sp" android:maxLines="1"', 'android:gravity="end" android:textSize="7.2sp" android:maxLines="1"')
          replace_once(large, 'android:paddingLeft="13dp" android:paddingRight="13dp"', 'android:paddingLeft="18dp" android:paddingRight="18dp"')
          replace_once(large, 'android:layout_marginTop="2dp" android:textSize="10sp"', 'android:layout_marginTop="4dp" android:textSize="12sp"')
          replace_once(large, 'android:layout_height="78dp" android:orientation="horizontal"', 'android:layout_height="82dp" android:orientation="horizontal"')
          replace_once(large, 'android:autoSizeMinTextSize="7sp" android:autoSizeMaxTextSize="9sp"', 'android:autoSizeMinTextSize="8sp" android:autoSizeMaxTextSize="11sp"')
          # remaining four prayer cards
          for _ in range(4):
              replace_once(large, 'android:autoSizeMinTextSize="7sp" android:autoSizeMaxTextSize="9sp"', 'android:autoSizeMinTextSize="8sp" android:autoSizeMaxTextSize="11sp"')

          # VERTICAL 2x4 — add inner breathing room and make header/date/rows readable.
          replace_once(vertical, 'android:orientation="vertical" android:padding="8dp"', 'android:orientation="vertical" android:padding="12dp"')
          replace_once(vertical, 'android:layout_height="34dp" android:orientation="horizontal"', 'android:layout_height="38dp" android:orientation="horizontal"')
          replace_once(vertical, 'android:layout_width="30dp" android:layout_height="30dp"', 'android:layout_width="32dp" android:layout_height="32dp"')
          replace_once(vertical, 'android:textSize="10.5sp" android:letterSpacing="0.07"', 'android:textSize="12sp" android:letterSpacing="0.06"')
          replace_once(vertical, 'android:textSize="4.8sp" android:maxLines="1"', 'android:textSize="5.8sp" android:maxLines="1"')
          replace_once(vertical, '<LinearLayout android:layout_width="88dp"', '<LinearLayout android:layout_width="100dp" android:layout_marginEnd="3dp"')
          replace_once(vertical, 'android:textStyle="bold" android:textSize="5.5sp"', 'android:textStyle="bold" android:textSize="7sp"')
          replace_once(vertical, 'android:gravity="end" android:textSize="4.8sp"', 'android:gravity="end" android:textSize="6sp"')
          replace_once(vertical, 'android:orientation="vertical" android:padding="10dp"', 'android:orientation="vertical" android:padding="12dp"')
          replace_once(vertical, 'android:textSize="8sp" android:maxLines="1"', 'android:textSize="10sp" android:maxLines="1"')
          replace_once(vertical, 'android:paddingLeft="10dp" android:paddingRight="10dp"', 'android:paddingLeft="12dp" android:paddingRight="12dp"')
          for _ in range(4):
              replace_once(vertical, 'android:paddingLeft="10dp" android:paddingRight="10dp"', 'android:paddingLeft="12dp" android:paddingRight="12dp"')

          # SQUARE 2x2 — safe inset and larger support text.
          replace_once(square, 'android:orientation="vertical" android:padding="7dp"', 'android:orientation="vertical" android:padding="10dp"')
          replace_once(square, 'android:layout_height="28dp" android:orientation="horizontal"', 'android:layout_height="32dp" android:orientation="horizontal"')
          replace_once(square, 'android:layout_width="26dp" android:layout_height="26dp"', 'android:layout_width="28dp" android:layout_height="28dp"')
          replace_once(square, 'android:textSize="9sp" android:letterSpacing="0.06"', 'android:textSize="10.5sp" android:letterSpacing="0.05"')
          replace_once(square, 'android:textSize="4sp" android:maxLines="1"', 'android:textSize="5sp" android:maxLines="1"')
          replace_once(square, 'android:orientation="vertical" android:padding="7dp"', 'android:orientation="vertical" android:padding="9dp"')
          replace_once(square, 'android:textSize="6.5sp" android:maxLines="1"', 'android:textSize="7.5sp" android:maxLines="1"')
          replace_once(square, 'android:layout_height="42dp" android:orientation="horizontal"', 'android:layout_height="46dp" android:orientation="horizontal"')

          # SLIM 4x1 — larger text while preserving the already-working safe structure.
          replace_once(slim, 'android:orientation="horizontal" android:padding="6dp"', 'android:orientation="horizontal" android:padding="8dp"')
          replace_once(slim, 'android:textSize="7sp" android:maxLines="1"', 'android:textSize="8.5sp" android:maxLines="1"')
          replace_once(slim, 'android:textSize="3.5sp" android:maxLines="1"', 'android:textSize="4.5sp" android:maxLines="1"')
          replace_once(slim, 'android:textStyle="bold" android:textSize="4.5sp"', 'android:textStyle="bold" android:textSize="5.5sp"')
          replace_once(slim, 'android:fontFamily="serif" android:textSize="17sp"', 'android:fontFamily="serif" android:textSize="19sp"')
          replace_once(slim, 'android:textSize="4.5sp" android:maxLines="1"', 'android:textSize="5.5sp" android:maxLines="1"')
          replace_once(slim, 'android:fontFamily="serif" android:textSize="18sp"', 'android:fontFamily="serif" android:textSize="20sp"')
          replace_once(slim, 'android:fontFamily="serif" android:textSize="6sp"', 'android:fontFamily="serif" android:textSize="7sp"')

          # Provider currently overrides prayer-card XML sizes. Raise those controlled limits per size.
          p = Path(provider)
          text = p.read_text()
          old = '''        val stripSp = if (lockScreen) 9.5f else when (layout) {
          "vertical" -> when (timeSize) { "small" -> 8.4f; "medium" -> 9.2f; "xlarge" -> 10.4f; else -> 9.8f }
          "square" -> when (timeSize) { "small" -> 5.0f; "medium" -> 5.6f; "xlarge" -> 6.6f; else -> 6.1f }
          "slim", "compact", "next" -> when (timeSize) { "small" -> 4.0f; "medium" -> 4.5f; "xlarge" -> 5.4f; else -> 5.0f }
          else -> when (timeSize) { "small" -> 7.2f; "medium" -> 8.0f; "xlarge" -> 9.2f; else -> 8.6f }
        }'''
          new = '''        val stripSp = if (lockScreen) 10.0f else when (layout) {
          "vertical" -> when (timeSize) { "small" -> 9.2f; "medium" -> 10.0f; "xlarge" -> 11.5f; else -> 10.8f }
          "square" -> when (timeSize) { "small" -> 6.0f; "medium" -> 6.8f; "xlarge" -> 8.0f; else -> 7.4f }
          "slim", "compact", "next" -> when (timeSize) { "small" -> 5.2f; "medium" -> 5.8f; "xlarge" -> 7.0f; else -> 6.3f }
          else -> when (timeSize) { "small" -> 8.5f; "medium" -> 9.3f; "xlarge" -> 10.8f; else -> 10.0f }
        }'''
          if old not in text:
              raise SystemExit('Expected stripSp block not found in provider')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Validate changed widget XML and provider
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'paddingStart="14dp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml
          grep -q 'textSize="8.5sp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml
          grep -q 'android:padding="12dp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml
          grep -q 'android:padding="10dp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml
          grep -q 'android:textSize="8.5sp"' mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml
          grep -q '"xlarge" -> 10.8f' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt

      - name: Commit fixes and trigger APK
        shell: bash
        run: |
          set -euo pipefail
          printf 'trigger=%s\nreason=v0.6.15-safe-spacing-readable-widgets\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/v067-build-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget.xml \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_vertical.xml \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_square.xml \
            mobile/modules/hassoun-widget/android/src/main/res/layout/hassoun_prayer_widget_slim.xml \
            mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt \
            .github/v067-build-trigger.txt
          git commit -m "Fix widget safe spacing and readability v0.6.15"
          git push origin HEAD:main
