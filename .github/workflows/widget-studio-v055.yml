name: Hassoun widget studio v0.5.5

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/widget-studio-v055.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply widget studio
        run: python .github/scripts/widget-studio-v055.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Validate native widget resources and Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease

      - name: Commit widget studio
        run: |
          git config user.name "Hassoun911"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add mobile/src/SettingsHub.tsx mobile/modules/hassoun-widget/index.ts mobile/app.config.ts
          git add -f mobile/modules/hassoun-widget/android
          git diff --cached --quiet && exit 0
          git commit -m "Add Hassoun widget studio and Samsung lock-screen provider"
          git push origin main
