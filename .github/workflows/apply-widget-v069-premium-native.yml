name: Apply Hassoun v0.6.9 Premium Native Widgets

on:
  push:
    paths:
      - ".github/scripts/widget-v069-premium-native.py"
      - ".github/workflows/apply-widget-v069-premium-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply premium native widget repair
        run: python .github/scripts/widget-v069-premium-native.py

      - name: Verify key changes
        run: |
          set -euo pipefail
          grep -q 'HassounSquareWidgetProvider::class.java' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounWidgetModule.kt
          grep -q 'layout in setOf("full", "vertical")' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'hassoun_widget_prayer_chip_light' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'initialLayout="@layout/hassoun_prayer_widget"' mobile/modules/hassoun-widget/android/src/main/res/xml/hassoun_prayer_widget_info.xml
          test -s mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_prayer_chip_light.xml
          test -s mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_prayer_chip_dark.xml

      - name: Commit repaired widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/modules/hassoun-widget mobile/src/SettingsHub.tsx
          git commit -m "Apply v0.6.9 premium native widget layouts" || true
          git pull --rebase origin main
          git push origin HEAD:main
