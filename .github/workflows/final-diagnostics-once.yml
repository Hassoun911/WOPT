name: Final Hassoun diagnostics once
on:
  push:
    branches: [work/hassoun-1.0-store-admin]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker validation
        id: worker
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd push-server
          npm ci --ignore-scripts --no-audit --no-fund > /tmp/worker.log 2>&1
          a=$?
          if [ $a -eq 0 ]; then npm run typecheck >> /tmp/worker.log 2>&1; a=$?; fi
          if [ $a -eq 0 ]; then npm test >> /tmp/worker.log 2>&1; a=$?; fi
          echo "code=$a" >> "$GITHUB_OUTPUT"
          exit 0
      - name: CRM validation
        id: crm
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd admin-crm
          npm install --ignore-scripts --no-audit --no-fund > /tmp/crm.log 2>&1
          a=$?
          if [ $a -eq 0 ]; then npx tsc --noEmit >> /tmp/crm.log 2>&1; a=$?; fi
          if [ $a -eq 0 ]; then npx next build >> /tmp/crm.log 2>&1; a=$?; fi
          echo "code=$a" >> "$GITHUB_OUTPUT"
          exit 0
      - name: PWA validation
        id: pwa
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd pwa
          npm ci --ignore-scripts --no-audit --no-fund > /tmp/pwa.log 2>&1
          a=$?
          if [ $a -eq 0 ]; then WOPT_STATIC_EXPORT=1 NEXT_PUBLIC_BASE_PATH='' NEXT_PUBLIC_PUSH_API_URL='https://wopt-prayer-push.wopt-windsor.workers.dev' npx next build >> /tmp/pwa.log 2>&1; a=$?; fi
          echo "code=$a" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Mobile TypeScript validation
        id: mobile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd mobile
          npm ci --ignore-scripts --no-audit --no-fund > /tmp/mobile.log 2>&1
          a=$?
          if [ $a -eq 0 ]; then npm run typecheck >> /tmp/mobile.log 2>&1; a=$?; fi
          echo "code=$a" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record diagnostics
        shell: bash
        run: |
          worker='${{ steps.worker.outputs.code }}'
          crm='${{ steps.crm.outputs.code }}'
          pwa='${{ steps.pwa.outputs.code }}'
          mobile='${{ steps.mobile.outputs.code }}'
          {
            echo "worker_exit=${worker:-unknown}"
            echo "crm_exit=${crm:-unknown}"
            echo "pwa_exit=${pwa:-unknown}"
            echo "mobile_exit=${mobile:-unknown}"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for part in worker crm pwa mobile; do
              echo ""
              echo "===== ${part} tail ====="
              tail -n 80 "/tmp/${part}.log" 2>/dev/null || true
            done
          } > .github/final-diagnostics.txt
          git config user.name "Hassoun Build Bot"
          git config user.email "65694110+Hassoun911@users.noreply.github.com"
          git add .github/final-diagnostics.txt
          git commit -m "Record final Hassoun diagnostics" || true
          git pull --rebase origin work/hassoun-1.0-store-admin
          git push origin HEAD:work/hassoun-1.0-store-admin
