name: Audit Final Hassoun CRM Users Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-final-crm-users-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-server/package-lock.json
      - working-directory: push-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit counts only
        working-directory: push-server
        run: |
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT status,COUNT(*) AS n FROM email_subscribers GROUP BY status ORDER BY status;" > /tmp/status.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT COUNT(*) AS total FROM email_subscribers;" > /tmp/total.json
          npx wrangler d1 execute wopt-prayer-push --remote --json --command "SELECT summary_json FROM one_time_imports WHERE import_key='resend_prayer_users_v1' LIMIT 1;" > /tmp/import.json || true
          {
            echo "final_crm_user_audit=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            jq -r '.[0].results[0] | "crm_total="+(.total|tostring)' /tmp/total.json
            jq -r '.[0].results[] | "crm_"+.status+"="+(.n|tostring)' /tmp/status.json
            if jq -e '.[0].results[0].summary_json' /tmp/import.json >/dev/null 2>&1; then
              jq -r '.[0].results[0].summary_json | fromjson | "legacy_discovered="+(.discovered|tostring)+"\nlegacy_inserted="+(.inserted|tostring)+"\nlegacy_blocked="+(.blocked|tostring)' /tmp/import.json
            fi
          } > ../.github/final-crm-user-audit.txt
      - name: Save audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/final-crm-user-audit.txt
          git commit -m "Record final Hassoun CRM user totals" || true
          git push origin HEAD:main || true
