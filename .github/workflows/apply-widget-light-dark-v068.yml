name: Apply Hassoun v0.6.8 Light Dark Widgets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/apply-widget-light-dark-v068.py"
      - ".github/workflows/apply-widget-light-dark-v068.yml"

permissions:
  contents: write

concurrency:
  group: hassoun-v068-theme-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Light Dark Auto widget support
        run: python .github/scripts/apply-widget-light-dark-v068.py

      - name: Validate patched sources
        run: |
          set -euo pipefail
          grep -q 'HassounWidgetAppearance = "light" | "dark" | "auto"' mobile/modules/hassoun-widget/index.ts
          grep -q 'putString("appearance", appearance)' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounWidgetModule.kt
          grep -q 'ACTION_CONFIGURATION_CHANGED' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q '"light" -> "ivory"' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q '"dark" -> "midnight"' mobile/modules/hassoun-widget/android/src/main/java/ca/wopt/hassounwidget/HassounPrayerWidgetProvider.kt
          grep -q 'WIDGET APPEARANCE' mobile/src/SettingsHub.tsx
          git diff --check

      - name: Commit repaired theme system and trigger APK build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'trigger=%s\nreason=v0.6.8-light-dark-auto-widget-theme\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/v067-build-trigger.txt
          git add mobile/modules/hassoun-widget mobile/src/SettingsHub.tsx .github/v067-build-trigger.txt
          git commit -m "Add Light Dark Auto widget themes and fix Large 4x2 add" || true
          git pull --rebase origin main
          git push origin HEAD:main
