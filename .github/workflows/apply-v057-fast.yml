name: Apply Hassoun v0.5.7 Fast Integration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-v057-fast.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and Java
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            push-server/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply integrated v0.5.7 code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-v057-quran-widgets-games.py')
          s = p.read_text()
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          python .github/scripts/apply-v057-quran-widgets-games.py
          python - <<'PY'
          from pathlib import Path
          p = Path('push-server/src/games.ts')
          s = p.read_text()
          s = s.replace('await request.json<Record<string, unknown>>()', '(await request.json()) as Record<string, unknown>')
          s = s.replace('const imposter = players[bytes[0] % players.length];', 'const imposter = players[(bytes[0] ?? 0) % players.length]!;')
          s = s.replace('const active = players[roundIndex(round, players.length)];', 'const active = players[roundIndex(round, players.length)]!;')
          s = s.replace('const question = TRIVIA[room.category][state.index % TRIVIA[room.category].length];', 'const question = TRIVIA[room.category][state.index % TRIVIA[room.category].length]!;')
          s = s.replace('return getRoom(env, roomMatch[1], url.searchParams.get("playerId") ?? "");', 'return getRoom(env, roomMatch[1]!, url.searchParams.get("playerId") ?? "");')
          s = s.replace('return action(request, env, actionMatch[1]);', 'return action(request, env, actionMatch[1]!);')
          p.write_text(s)

          p = Path('mobile/src/MultiplayerGames.tsx')
          s = p.read_text().replace('useEffect, useMemo, useState', 'useEffect, useState')
          s = s.replace('  const me = room?.players.find((p) => p.id === playerId);\n', '')
          p.write_text(s)
          PY
          python .github/scripts/post-v057-responsive.py
          python .github/scripts/fix-v057-widget-bridge.py

      - name: Validate mobile and multiplayer backend
        run: |
          cd mobile
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          cd ../push-server
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Regenerate Android-safe widget logo
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin pngcrush
          rsvg-convert -w 512 -h 512 mobile/assets/hassoun-brand.svg -o /tmp/hassoun-widget-logo.png
          pngcrush -q -ow /tmp/hassoun-widget-logo.png
          mkdir -p mobile/modules/hassoun-widget/android/src/main/res/drawable
          cp /tmp/hassoun-widget-logo.png mobile/modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Validate only native widget module
        run: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew :wopt-hassoun-widget:compileReleaseLibraryResources :wopt-hassoun-widget:compileReleaseKotlin

      - name: Update APK workflow to v0.5.7
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/android-debug.yml')
          s = p.read_text()
          s = s.replace('# Build Hassoun v0.5.5 widget studio + Samsung LockStar release', '# Build Hassoun v0.5.7 Quran + widgets + multiplayer games release')
          s = s.replace('Hassoun-v0.5.5.apk', 'Hassoun-v0.5.7.apk')
          s = s.replace('hassoun-v0.5.5-${{ github.run_number }}', 'hassoun-v0.5.7-${{ github.run_number }}')
          p.write_text(s)
          PY

      - name: Commit v0.5.7 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/v057-last-error.log
          git add -f mobile push-server .github/workflows/android-debug.yml .github/v057-last-error.log 2>/dev/null || true
          git commit -m "Hassoun v0.5.7 Quran widgets multiplayer games"
          git push origin HEAD:main
