name: Build Hassoun v0.5.7 APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/v057-trigger.txt"

permissions:
  contents: write

concurrency:
  group: hassoun-v057-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || '69276452-f6f2-4d13-80e8-399ab32746ff' }}
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout v0.5.7
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify committed release
        run: |
          grep -q 'version: "0.5.7"' mobile/app.config.ts
          grep -q 'versionCode: 29' mobile/app.config.ts
          echo "Hassoun v0.5.7 source confirmed."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies and typecheck
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit

      - name: Regenerate Android-safe Hassoun assets
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin pngcrush
          cd mobile
          rsvg-convert -w 1024 -h 1024 assets/hassoun-app-icon.svg -o /tmp/icon.png
          rsvg-convert -w 1024 -h 1024 assets/hassoun-app-icon.svg -o /tmp/adaptive-icon.png
          rsvg-convert -w 512 -h 512 assets/hassoun-notification.svg -o /tmp/notification-icon.png
          rsvg-convert -w 512 -h 512 assets/hassoun-brand.svg -o /tmp/hassoun-logo.png
          rsvg-convert -w 512 -h 512 assets/hassoun-brand.svg -o /tmp/splash-logo.png
          pngcrush -q -ow /tmp/icon.png
          pngcrush -q -ow /tmp/adaptive-icon.png
          pngcrush -q -ow /tmp/notification-icon.png
          pngcrush -q -ow /tmp/hassoun-logo.png
          pngcrush -q -ow /tmp/splash-logo.png
          cp /tmp/icon.png assets/icon.png
          cp /tmp/adaptive-icon.png assets/adaptive-icon.png
          cp /tmp/notification-icon.png assets/notification-icon.png
          cp /tmp/hassoun-logo.png assets/hassoun-logo.png
          cp /tmp/splash-logo.png assets/splash-logo.png
          mkdir -p modules/hassoun-widget/android/src/main/res/drawable
          cp /tmp/hassoun-logo.png modules/hassoun-widget/android/src/main/res/drawable/hassoun_widget_logo.png

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hassoun-v0.5.7-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/Hassoun-v0.5.7.apk
          if-no-files-found: error
          retention-days: 14

      - name: Deploy multiplayer Worker
        id: worker
        continue-on-error: true
        working-directory: push-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler d1 migrations apply wopt-prayer-push --remote
          npx wrangler deploy

      - name: Record verified build status
        if: always()
        run: |
          cat > .github/v057-build-status.txt <<EOF
          version=0.5.7
          versionCode=29
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          artifact=hassoun-v0.5.7-${{ github.run_number }}
          apk_step=${{ steps.worker.outcome != '' && 'uploaded-before-worker' || 'check-run' }}
          worker=${{ steps.worker.outcome }}
          source_commit=$(git rev-parse HEAD)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v057-build-status.txt
          git commit -m "Record Hassoun v0.5.7 build status" || true
          git push origin HEAD:main || true
