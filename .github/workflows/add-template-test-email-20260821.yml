name: Add Template Test Email 2026-08-21

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-template-test-email-20260821.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: f883431754898c8aaf1d551a33e7641d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/hassoun-1.0-store-admin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            push-server/package-lock.json
            admin-crm/package-lock.json

      - name: Add real template test sender and CRM buttons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Backend: expose a real one-off test sender using the exact renderer + Resend path.
          p=Path('push-server/src/emailDelivery.ts'); s=p.read_text()
          old='  if (!profile || profile.enabled !== 1) return { ...builtIn, subject: decorateSubject(builtIn.subject) };'
          new='  if (!profile || (profile.enabled !== 1 && rawData.adminTemplateTest !== true)) return { ...builtIn, subject: decorateSubject(builtIn.subject) };'
          if old in s: s=s.replace(old,new)
          marker='\nasync function claimOutbox(env: Env, id: number) {'
          if 'export async function sendAdminTemplateTest' not in s:
              helper=r'''
export async function sendAdminTemplateTest(env: Env, templateKey: string, recipient = "windsor.hassoun@gmail.com") {
  const now = new Date();
  const prayerDate = now.toISOString().slice(0, 10);
  const kind = templateKey === "prayer_alert" ? "prayer" : templateKey;
  const row: OutboxRow = {
    id: 0,
    delivery_id: null,
    subscriber_id: null,
    recipient_email: recipient,
    locale: "en",
    kind,
    template_key: null,
    template_data_json: JSON.stringify({
      adminTemplateTest: true,
      kind: "athan",
      prayer: "isha",
      prayerTime: "21:48",
      prayerDate,
      prayerTimes: { fajr: "05:12", dhuhr: "13:35", asr: "17:23", maghrib: "20:26", isha: "21:48" },
      locationLabel: "Windsor, Ontario",
      timezone: "America/Toronto",
      message: `This is a Hassoun test of the ${templateKey} email template.`,
      verificationUrl: "https://admin.hassoun.app/admin/email",
      manageUrl: "https://admin.hassoun.app/admin/email",
      resetUrl: "https://admin.hassoun.app/admin/email",
      upcomingEvent: {
        emoji: "🌙",
        nameEn: "Upcoming Islamic Occasion",
        nameAr: "المناسبة الإسلامية القادمة",
        descriptionEn: "Prepare with worship, gratitude, family and good deeds.",
        descriptionAr: "استعد بالعبادة والشكر والأسرة والأعمال الصالحة.",
        daysLeft: 18
      }
    }),
    idempotency_key: null,
    attempts: 0
  };
  const email = await renderEmail(env, row);
  const providerMessageId = await sendResend(env, row, email);
  return { ok: true, providerMessageId, recipient, subject: email.subject, templateKey };
}
'''
              s=s.replace(marker,helper+marker)
          p.write_text(s)

          # Admin API action.
          p=Path('push-server/src/adminEmail.ts'); s=p.read_text()
          if 'sendAdminTemplateTest' not in s:
              s=s.replace('import { subscriberManageUrl } from "./subscribers";','import { subscriberManageUrl } from "./subscribers";\nimport { sendAdminTemplateTest } from "./emailDelivery";')
          marker='async function updateContentItem(env:Env,body:Record<string,unknown>)'
          if 'async function sendTemplateTest' not in s:
              helper=r'''async function sendTemplateTest(env:Env,adminId:number,body:Record<string,unknown>){
  const key=clean(body.templateKey,120);if(!key)return json({error:"Template key is required"},400);
  const profile=await env.DB.prepare("SELECT template_key FROM email_template_profiles WHERE template_key = ? LIMIT 1").bind(key).first<{template_key:string}>();
  if(!profile)return json({error:"Template profile not found"},404);
  try{
    const result=await sendAdminTemplateTest(env,key,"windsor.hassoun@gmail.com");
    await logAdmin(env,adminId,"email_template_test_sent",key,{recipient:"windsor.hassoun@gmail.com",providerMessageId:result.providerMessageId,subject:result.subject});
    return json(result);
  }catch(error){
    const message=error instanceof Error?error.message:String(error);
    await logAdmin(env,adminId,"email_template_test_failed",key,{recipient:"windsor.hassoun@gmail.com",error:message});
    return json({error:`Test email failed: ${message}`},502);
  }
}

'''
              s=s.replace(marker,helper+marker)
          route='  if(body.action==="update_template_profile")return updateTemplateProfile(env,auth.admin.id,body);\n  if(body.action==="update_content_item")return updateContentItem(env,body);'
          replacement='  if(body.action==="update_template_profile")return updateTemplateProfile(env,auth.admin.id,body);\n  if(body.action==="send_template_test")return sendTemplateTest(env,auth.admin.id,body);\n  if(body.action==="update_content_item")return updateContentItem(env,body);'
          if route in s: s=s.replace(route,replacement)
          p.write_text(s)

          # Real production CRM: one-click test button on every template.
          p=Path('admin-crm/app/admin/email/page.tsx'); s=p.read_text()
          target='<button style={s.previewButton} onClick={()=>{setPreviewMode("mobile");setPreview({profile:{...p,sponsor_name:d.name,sponsor_url:normalizeUrl(d.url),sponsor_message_en:d.en,sponsor_message_ar:d.ar}})}}>📱 Full email preview</button><Toggle on={p.enabled===1} onClick={()=>void toggle(p,"enabled")}/>'
          replacement='<button style={s.previewButton} onClick={()=>{setPreviewMode("mobile");setPreview({profile:{...p,sponsor_name:d.name,sponsor_url:normalizeUrl(d.url),sponsor_message_en:d.en,sponsor_message_ar:d.ar}})}}>📱 Full email preview</button><button style={s.testButton} disabled={busy} onClick={()=>void postAction({action:"send_template_test",templateKey:p.template_key},`📨 Test ${p.name} email sent to windsor.hassoun@gmail.com.`)}>🧪 Send test</button><Toggle on={p.enabled===1} onClick={()=>void toggle(p,"enabled")}/>'
          if target not in s: raise SystemExit('Template action anchor not found')
          s=s.replace(target,replacement)
          style_anchor='previewButton:{border:"1px solid #d8bc6b",background:"#fff9e9",color:"#755819",borderRadius:9,padding:"8px 10px",fontWeight:850,cursor:"pointer"},'
          style_repl=style_anchor+'testButton:{border:"1px solid #8fc8b7",background:"#edf9f4",color:"#0b5b47",borderRadius:9,padding:"8px 10px",fontWeight:900,cursor:"pointer"},'
          if style_anchor in s and 'testButton:{' not in s: s=s.replace(style_anchor,style_repl)
          p.write_text(s)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add push-server/src/emailDelivery.ts push-server/src/adminEmail.ts admin-crm/app/admin/email/page.tsx
          git commit -m "Add test email action to every Email Center template"
          git push origin HEAD:work/hassoun-1.0-store-admin

      - name: Validate Worker
        working-directory: push-server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Deploy Worker
        working-directory: push-server
        run: npx wrangler deploy

      - name: Validate Admin CRM
        working-directory: admin-crm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Smoke test Worker
        run: |
          sleep 8
          curl -fsS https://wopt-prayer-push.wopt-windsor.workers.dev/health
